name: Create Weather File

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create file
        run: |
          echo "15°C Cloudy" > weather.txt

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add weather.txt
          git commit -m "Update weather" || exit 0
          git push
