<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sheffield Weather</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
background:#fff;
overflow:hidden;
}

.dashboard{
width:100%;
height:100%;
display:flex;
flex-direction:column;
background:#fff;
}

/* =====================
CURRENT CONDITIONS
===================== */

.current{
height:55%;
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 50px;
border-bottom:1px solid #e5e7eb;
}

.left{
display:flex;
align-items:center;
gap:30px;
}

#weatherIcon{
width:180px;
height:180px;
}

.location{
font-size:28px;
color:#666;
margin-bottom:10px;
}

.temp{
font-size:140px;
font-weight:700;
line-height:1;
color:#005CB9;
}

.condition{
font-size:42px;
color:#333;
}

.right{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px 80px;
}

.metric-label{
font-size:20px;
color:#777;
margin-bottom:4px;
}

.metric-value{
font-size:34px;
color:#005CB9;
font-weight:bold;
}

/* =====================
FORECAST
===================== */

.forecast{
flex:1;
padding:20px;
}

.forecast-title{
font-size:28px;
font-weight:bold;
color:#005CB9;
margin-bottom:15px;
}

.forecast-grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:10px;
height:100%;
}

.day{
border:1px solid #e5e7eb;
border-radius:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-evenly;
}

.day-name{
font-size:20px;
font-weight:bold;
color:#005CB9;
}

.day img{
width:70px;
height:70px;
}

.high{
font-size:30px;
font-weight:bold;
color:#222;
}

.low{
font-size:22px;
color:#666;
}

</style>
</head>

<body>

<div class="dashboard">

<div class="current">

<div class="left">

<img id="weatherIcon" src="">

<div>
<div class="location">Sheffield, United Kingdom</div>
<div class="temp" id="temp">--°</div>
<div class="condition" id="condition">Loading...</div>
</div>

</div>

<div class="right">

<div>
<div class="metric-label">Feels Like</div>
<div class="metric-value" id="feelsLike">--°</div>
</div>

<div>
<div class="metric-label">Humidity</div>
<div class="metric-value" id="humidity">--%</div>
</div>

<div>
<div class="metric-label">Wind</div>
<div class="metric-value" id="wind">-- mph</div>
</div>

<div>
<div class="metric-label">Pressure</div>
<div class="metric-value" id="pressure">----</div>
</div>

</div>

</div>

<div class="forecast">

<div class="forecast-title">
10 DAY FORECAST
</div>

<div class="forecast-grid" id="forecastGrid"></div>

</div>

</div>

<script>

function weatherDescription(code){

const map = {
0:'Clear Sky',
1:'Mainly Clear',
2:'Partly Cloudy',
3:'Overcast',
45:'Fog',
48:'Fog',
51:'Light Drizzle',
53:'Drizzle',
55:'Heavy Drizzle',
61:'Rain',
63:'Rain',
65:'Heavy Rain',
71:'Snow',
80:'Rain Showers',
81:'Rain Showers',
82:'Heavy Showers',
95:'Thunderstorm'
};

return map[code] || 'Unknown';
}

function weatherIcon(code){

if(code === 0)
return 'https://openweathermap.org/img/wn/01d@4x.png';

if([1,2].includes(code))
return 'https://openweathermap.org/img/wn/02d@4x.png';

if(code === 3)
return 'https://openweathermap.org/img/wn/04d@4x.png';

if([45,48].includes(code))
return 'https://openweathermap.org/img/wn/50d@4x.png';

if([51,53,55,61,63,65,80,81,82].includes(code))
return 'https://openweathermap.org/img/wn/10d@4x.png';

if([71,73,75].includes(code))
return 'https://openweathermap.org/img/wn/13d@4x.png';

if(code === 95)
return 'https://openweathermap.org/img/wn/11d@4x.png';

return 'https://openweathermap.org/img/wn/03d@4x.png';
}

async function loadWeather(){

try{

const response = await fetch(
'https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,relative_humidity_2m,apparent_temperature,pressure_msl,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=10&timezone=Europe/London'
);

const data = await response.json();

document.getElementById('temp').innerHTML =
Math.round(data.current.temperature_2m) + '°';

document.getElementById('condition').innerHTML =
weatherDescription(data.current.weather_code);

document.getElementById('feelsLike').innerHTML =
Math.round(data.current.apparent_temperature) + '°';

document.getElementById('humidity').innerHTML =
data.current.relative_humidity_2m + '%';

document.getElementById('wind').innerHTML =
Math.round(data.current.wind_speed_10m) + ' mph';

document.getElementById('pressure').innerHTML =
Math.round(data.current.pressure_msl) + ' hPa';

document.getElementById('weatherIcon').src =
weatherIcon(data.current.weather_code);

const forecastGrid =
document.getElementById('forecastGrid');

forecastGrid.innerHTML = '';

data.daily.time.forEach((date,index)=>{

const dayDate = new Date(date);

const card = document.createElement('div');

card.className = 'day';

card.innerHTML = `
<div class="day-name">
${dayDate.toLocaleDateString('en-GB',{
weekday:'short'
})}
</div>

<img src="${weatherIcon(
data.daily.weather_code[index]
)}">

<div class="high">
${Math.round(
data.daily.temperature_2m_max[index]
)}°
</div>

<div class="low">
${Math.round(
data.daily.temperature_2m_min[index]
)}°
</div>
`;

forecastGrid.appendChild(card);

});

}
catch(error){
console.error(error);
}
}

loadWeather();

/* Refresh every 5 minutes */

setInterval(loadWeather,300000);

</script>

</body>
</html>
