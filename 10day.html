<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
background:#ffffff;
overflow:hidden;
}

.dashboard{
width:100%;
height:100%;
display:flex;
flex-direction:column;
background:#fff;
}

/* CURRENT CONDITIONS */

.current{
height:55%;
display:flex;
align-items:center;
justify-content:space-between;
padding:30px 50px;
border-bottom:1px solid #e5e7eb;
}

.left{
display:flex;
align-items:center;
gap:30px;
}

.left img{
width:170px;
height:170px;
}

.temp{
font-size:120px;
font-weight:700;
color:#005CB9;
line-height:1;
}

.condition{
font-size:42px;
color:#333;
margin-top:10px;
}

.location{
font-size:26px;
color:#666;
margin-bottom:15px;
}

.right{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px 70px;
}

.metric{
display:flex;
flex-direction:column;
}

.metric-label{
font-size:20px;
color:#666;
}

.metric-value{
font-size:34px;
color:#005CB9;
font-weight:bold;
}

/* FORECAST */

.forecast{
flex:1;
display:flex;
flex-direction:column;
padding:20px;
}

.forecast-title{
font-size:28px;
color:#005CB9;
font-weight:bold;
margin-bottom:15px;
}

.forecast-grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:10px;
flex:1;
}

.day{
border:1px solid #e5e7eb;
border-radius:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-evenly;
}

.day-name{
font-size:20px;
font-weight:bold;
color:#005CB9;
}

.day img{
width:70px;
height:70px;
}

.high{
font-size:30px;
font-weight:bold;
color:#222;
}

.low{
font-size:22px;
color:#666;
}

</style>
</head>

<body>

<div class="dashboard">

<div class="current">

<div class="left">

<img id="weatherIcon">

<div>
<div class="location">Sheffield, UK</div>
<div class="temp" id="temp">--°</div>
<div class="condition" id="condition">Loading...</div>
</div>

</div>

<div class="right">

<div class="metric">
<span class="metric-label">Feels Like</span>
<span class="metric-value" id="feelsLike">--°</span>
</div>

<div class="metric">
<span class="metric-label">Humidity</span>
<span class="metric-value" id="humidity">--%</span>
</div>

<div class="metric">
<span class="metric-label">Wind</span>
<span class="metric-value" id="wind">-- mph</span>
</div>

<div class="metric">
<span class="metric-label">Pressure</span>
<span class="metric-value" id="pressure">----</span>
</div>

</div>

</div>

<div class="forecast">

<div class="forecast-title">
10 DAY FORECAST
</div>

<div class="forecast-grid" id="forecastGrid"></div>

</div>

</div>

<script>

const apiKey = "YOUR_API_KEY";

/* Sheffield */
const lat = 53.3811;
const lon = -1.4701;

async function loadWeather(){

const response = await fetch(
`https://api.openweathermap.org/data/3.0/onecall?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`
);

const data = await response.json();

/* Current */

document.getElementById("temp").innerHTML =
Math.round(data.current.temp) + "°";

document.getElementById("condition").innerHTML =
data.current.weather[0].description;

document.getElementById("feelsLike").innerHTML =
Math.round(data.current.feels_like) + "°";

document.getElementById("humidity").innerHTML =
data.current.humidity + "%";

document.getElementById("wind").innerHTML =
Math.round(data.current.wind_speed * 2.237) + " mph";

document.getElementById("pressure").innerHTML =
data.current.pressure + " hPa";

document.getElementById("weatherIcon").src =
`https://openweathermap.org/img/wn/${data.current.weather[0].icon}@4x.png`;

/* Forecast */

const grid = document.getElementById("forecastGrid");
grid.innerHTML = "";

data.daily.slice(0,10).forEach(day=>{

const date = new Date(day.dt * 1000);

const card = document.createElement("div");
card.className="day";

card.innerHTML=`
<div class="day-name">
${date.toLocaleDateString('en-GB',{weekday:'short'})}
</div>

<img src="https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png">

<div class="high">${Math.round(day.temp.max)}°</div>

<div class="low">${Math.round(day.temp.min)}°</div>
`;

grid.appendChild(card);

});

}

loadWeather();

/* Refresh every 10 mins */

setInterval(loadWeather,600000);

</script>

</body>
</html>
