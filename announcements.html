<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:500px;
height:250px;
overflow:hidden;
font-family:Arial,sans-serif;
background:#ffffff;
}

.container{
width:500px;
height:250px;
border:0px solid #d8d8d8;
border-radius:8px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.header{
height:48px;
background:#002D72;
color:white;
display:flex;
align-items:center;
padding-left:18px;
font-size:24px;
font-weight:700;
border-bottom:4px solid #E31837;
}

.kpi{
padding:14px 18px;
background:#ffffff;
border-bottom:1px solid #e6e6e6;
}

.kpi-days{
color:#00843D;
font-size:35px;
font-weight:700;
line-height:1;
}

.kpi-text{
color:#00843D;
font-size:18px;
font-weight:700;
margin-top:4px;
}

.kpi-sub{
color:#444;
font-size:12px;
margin-top:4px;
}

.announcements{
flex:1;
display:flex;
flex-direction:column;
}

.row{
flex:1;
padding:10px 10px;
border-bottom:1px solid #ececec;
display:flex;
flex-direction:column;
justify-content:center;
}

.row:nth-child(even){
background:#f8f9fb;
}

.title{
color:#002D72;
font-size:16px;
font-weight:700;
line-height:1.1;
}

.message{
color:#444;
font-size:12px;
margin-top:1px;
}

.progress-wrap{
height:5px;
background:#e8e8e8;
}

.progress{
height:100%;
width:0%;
background:#E31837;
animation:progress 10s linear infinite;
}

@keyframes progress{
from{width:0%;}
to{width:100%;}
}

</style>
</head>

<body>

<div class="container">

<div class="kpi">
<div class="kpi-days" id="days">0</div>
<div class="kpi-text">DAYS INCIDENT FREE</div>
</div>

<div class="announcements">

<div class="row">
<div class="title" id="t1"></div>
<div class="message" id="m1"></div>
</div>

<div class="row">
<div class="title" id="t2"></div>
<div class="message" id="m2"></div>
</div>

<div class="row">
<div class="title" id="t3"></div>
<div class="message" id="m3"></div>
</div>

<div class="row">
<div class="title" id="t4"></div>
<div class="message" id="m4"></div>
</div>

</div>

<div class="progress-wrap">
<div class="progress"></div>
</div>

</div>

<script>

// ======================================
// CONFIGURATION
// ======================================

// Update only when an incident occurs
const lastIncidentDate = "2026-01-08";

// Optional API endpoint
const apiUrl = "";

// Fallback announcements
const localAnnouncements = [

{
title:"Compliance Training",
message:"Please arrange with your line manager to complete mandatory compliance training as soon as possible."
},

{
title:"Callum Rickhuss Promotion",
message:"Congratulations to Callum Rickhuss on his promotion to Warehouse Team Leader. Well done Callum!"
},

{
title:"Team Briefing",
message:"Friday 10:00 AM in canteen."
},

{
title:"New H&S Policy",
message:"Available now on intranet."
},

{
title:"Employee Recognition",
message:"Celebrating our amazing team."
},

{
title:"Production Milestone",
message:"Monthly target achieved."
},

{
title:"Visitor Notice",
message:"Reception improvement works."
},

{
title:"Charity Event",
message:"Friday lunchtime fundraiser."
}

];

let announcements = [...localAnnouncements];
let currentPage = 0;

function updateIncidentDays(){

const start = new Date(lastIncidentDate);
const now = new Date();

const diff = Math.floor(
(now - start) / 86400000
);

document.getElementById("days").innerText = diff;
}

async function loadApiData(){

if(!apiUrl) return;

try{

const response = await fetch(
apiUrl + "?t=" + Date.now()
);

const data = await response.json();

announcements = data;

}
catch(e){
console.log(e);
}
}

function showPage(){

const start = currentPage * 2;

for(let i=0;i<4;i++){

const item =
announcements[start+i];

const title =
document.getElementById(
"t"+(i+1)
);

const msg =
document.getElementById(
"m"+(i+1)
);

if(item){

title.innerText =
item.title;

msg.innerText =
item.message;

}
else{

title.innerText="";
msg.innerText="";

}

}

currentPage++;

if(currentPage * 4 >= announcements.length){
currentPage = 0;
}

}

updateIncidentDays();
showPage();

setInterval(updateIncidentDays,3600000);

setInterval(()=>{

showPage();

},10000);

setInterval(loadApiData,300000);

loadApiData();

</script>

</body>
</html>
