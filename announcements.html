<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">
<title>Announcements & Alerts</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:450px;
height:450px;
overflow:hidden;

font-family:Arial, Helvetica, sans-serif;


}

/* HEADER */

.header{
height:60px;

display:flex;
align-items:center;
gap:8px;

padding:0 10px;

color:white;

font-size:16px;
font-weight:700;
letter-spacing:1px;

border-bottom:1px solid rgba(255,255,255,0.15);
}

.header .material-symbols-outlined{
font-size:32px;
opacity:.9;
}

/* CONTENT */

#content{
height:390px;

display:grid;
grid-template-rows:repeat(4,1fr);
}

/* CARDS */

.row{
display:flex;
align-items:center;
gap:4px;

margin:8px 12px;
padding:10px 10px;

border-radius:10px;

background:
linear-gradient(
180deg,
rgba(6,48,100,.95),
rgba(2,28,65,.95)
);

border:1px solid rgba(255,255,255,.08);

color:white;
}

/* WEATHER COLOURS */

.weather.normal{
background:
linear-gradient(
180deg,
#00A651,
#008f46
);
}

.weather.yellow{
background:
linear-gradient(
180deg,
#FFD100,
#e0ba00
);

color:#000;
}

.weather.amber{
background:
linear-gradient(
180deg,
#d8871a,
#c8700d
);
}

.weather.red{
background:
linear-gradient(
180deg,
#d3203e,
#b00020
);
}

/* ICON CIRCLE */

.icon-wrap{
width:54px;
height:54px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

border:2px solid rgba(255,255,255,.15);

background:rgba(0,0,0,.15);

flex-shrink:0;
}

.material-symbols-outlined{
font-size:34px;

font-variation-settings:
'FILL' 0,
'wght' 400,
'GRAD' 0,
'opsz' 48;
}

/* TEXT */

.text{
flex:1;
min-width:0;

display:flex;
flex-direction:column;
}

.title{
font-size:20px;
font-weight:700;
line-height:1.15;
}

.message{
margin-top:6px;

font-size:15px;
line-height:1.35;

opacity:.95;
}

/* RIGHT ARROW */


/* WEATHER CARD ICONS */

.weather.yellow .material-symbols-outlined{
color:black;
}

.weather.yellow .title,
.weather.yellow .message{
color:black;
}

.weather .arrow{
display:none;
}

</style>
</head>
<body>

<div class="header">
<span class="material-symbols-outlined">info</span>
<span>ANNOUNCEMENTS & ALERTS</span>
</div>

<div id="content"></div>

<script>

/*****************************************
CONFIG
*****************************************/

const ROTATE_EVERY = 30000;

// Sheffield
const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

// Optional API
const ANNOUNCEMENT_API = "";

/*****************************************
ICONS
*****************************************/

const iconMap = {

safety: "shield",
maintenance: "build",
people: "groups",
production: "factory",
training: "school",
logistics: "local_shipping",
quality: "verified",
environment: "eco",
visitor: "badge",
announcement: "campaign",
celebration: "celebration"

};

/*****************************************
DEMO DATA
*****************************************/

let announcements = [

{
category:"training",
title:"Compliance Training - Now Due!",
message:"Please arrange completion of your Code of Conduct training with your line manager."
},

{
category:"celebration",
title:"Callum Rickhuss Promotion",
message:"Congratulations to Callum on his promotion to Warehouse Team Leader - well done Callum!"
},

{
category:"announcement",
title:"Site Communication",
message:"Please ensure noticeboards are checked regularly for important updates."
}

];

let weatherInfo = {
class:"normal",
title:"WEATHER",
message:"No active alerts"
};

let currentPage = 0;

/*****************************************
WEATHER
*****************************************/

async function loadWeather(){

try{

const response =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`
);

const data = await response.json();

const code = data.daily.weather_code[0];

weatherInfo = {
class:"normal",
title:"WEATHER",
message:"No Alerts in Effect"
};

if([95,96,99].includes(code)){

weatherInfo = {
class:"red",
title:"WEATHER WARNING",
message:"Severe Thunderstorm Warning in Effect"
};

}
else if(
[61,63,65,80,81,82].includes(code)
){

weatherInfo = {
class:"amber",
title:"WEATHER WARNING",
message:"Heavy Rain Expected"
};

}
else if(
[71,73,75,77,85,86].includes(code)
){

weatherInfo = {
class:"yellow",
title:"WEATHER WARNING",
message:"Heavy Snow Expected"
};

}

}
catch(err){

console.log(err);

}

}

/*****************************************
API
*****************************************/

async function loadAnnouncements(){

if(!ANNOUNCEMENT_API) return;

try{

const response =
await fetch(
ANNOUNCEMENT_API +
"?t=" +
Date.now()
);

announcements =
await response.json();

}
catch(err){

console.log(err);

}

}

/*****************************************
PAGING
*****************************************/

function getPages(){

const pages = [];

for(
let i=0;
i<announcements.length;
i+=3
){

pages.push(
announcements.slice(
i,
i+3
)
);

}

if(pages.length === 0){

pages.push([]);

}

return pages;

}

/*****************************************
RENDER
*****************************************/

function render(){

const pages = getPages();
const page = pages[currentPage] || [];

let html = `

<div class="row weather ${weatherInfo.class}">

<div class="icon-wrap">
<span class="material-symbols-outlined">
warning
</span>
</div>

<div class="text">

<div class="title">
${weatherInfo.title}
</div>

<div class="message">
${weatherInfo.message}
</div>

</div>

</div>

`;

for(let i=0;i<3;i++){

const item = page[i];

if(item){

const icon =
iconMap[item.category] ||
"campaign";

html += `

<div class="row">

<div class="icon-wrap">
<span class="material-symbols-outlined">
${icon}
</span>
</div>

<div class="text">

<div class="title">
${item.title}
</div>

<div class="message">
${item.message}
</div>

</div>



</div>

`;

}
else{

html += `

<div class="row">

<div class="text">
<div class="title">&nbsp;</div>
</div>

</div>

`;

}

}

document
.getElementById("content")
.innerHTML = html;

currentPage++;

if(currentPage >= pages.length){

currentPage = 0;

}

}

/*****************************************
START
*****************************************/

async function start(){

await loadWeather();
await loadAnnouncements();

render();

setInterval(
render,
ROTATE_EVERY
);

setInterval(
loadWeather,
900000
);

setInterval(
loadAnnouncements,
300000
);

}

start();

</script>

</body>
</html>
