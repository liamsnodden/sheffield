<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:450px;
height:450px;
overflow:hidden;
background:#ffffff;
font-family:Arial,Helvetica,sans-serif;
}

#content{
width:450px;
height:calc(100% - 4px);
display:flex;
flex-direction:column;
}

.item{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
padding:12px 16px;
border-bottom:1px solid #ececec;
}

.item:last-child{
border-bottom:none;
}

.kpi{
flex:1.2;
background:#ffffff;
}

.kpi-days{
font-size:72px;
font-weight:800;
color:#00A651;
line-height:0.9;
}

.kpi-label{
font-size:28px;
font-weight:700;
color:#00A651;
line-height:1;
}

.kpi-sub{
font-size:14px;
color:#666;
margin-top:4px;
}

.alert{
color:white;
}

.alert-title{
font-size:16px;
font-weight:700;
text-transform:uppercase;
}

.alert-message{
font-size:14px;
margin-top:2px;
}

.title{
font-size:18px;
font-weight:700;
color:#002D72;
}

.message{
font-size:14px;
color:#555;
margin-top:2px;
}

.progress{
height:4px;
background:#efefef;
}

.progress-bar{
height:100%;
width:0%;
background:#E31837;
animation:progress 10s linear infinite;
}

@keyframes progress{
from {width:0%;}
to {width:100%;}
}

</style>
</head>

<body>

<div id="content"></div>

<div class="progress">
<div class="progress-bar"></div>
</div>

<script>

/*************************************************
CONFIGURATION
**************************************************/

const LAST_INCIDENT_DATE = "2026-01-08";

const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

const ROTATION_TIME = 10000;

// Leave blank to use built-in announcements
const ANNOUNCEMENT_API = "";

/*************************************************
FALLBACK ANNOUNCEMENTS
**************************************************/

let announcements = [

{
title:"Safety Week",
message:"Remember hearing protection in all production areas."
},

{
title:"Maintenance Shutdown",
message:"Saturday 14th June."
},

{
title:"Team Briefing",
message:"Friday 10:00 AM in canteen."
},

{
title:"New H&S Policy",
message:"Available on the intranet."
},

{
title:"Production Milestone",
message:"Monthly target achieved."
},

{
title:"Visitor Notice",
message:"Reception refurbishment works."
},

{
title:"Charity Event",
message:"Friday lunchtime fundraiser."
}

];

let weatherAlert = null;
let pages = [];
let currentPage = 0;

/*************************************************
INCIDENT DAYS
**************************************************/

function getIncidentDays(){

const start = new Date(LAST_INCIDENT_DATE);
const now = new Date();

return Math.floor(
(now - start) / 86400000
);
}

/*************************************************
OPEN METEO ALERT CHECK
**************************************************/

async function loadWeatherAlert(){

try{

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`;

const response = await fetch(url);
const data = await response.json();

weatherAlert = null;

const code = data.daily.weather_code[0];

if([95,96,99].includes(code)){

weatherAlert = {
color:"#C8102E",
title:"WEATHER ALERT",
message:"SEVERE THUNDERSTORM WARNING"
};
}

else if([71,73,75,77,85,86].includes(code)){

weatherAlert = {
color:"#F39C12",
title:"WEATHER ALERT",
message:"HEAVY SNOW EXPECTED"
};
}

else if([61,63,65,80,81,82].includes(code)){

weatherAlert = {
color:"#F39C12",
title:"WEATHER ALERT",
message:"HEAVY RAIN EXPECTED"
};
}

buildPages();

}
catch(error){

console.log(error);

}

}

/*************************************************
ANNOUNCEMENT API
**************************************************/

async function loadAnnouncements(){

if(!ANNOUNCEMENT_API) return;

try{

const response =
await fetch(
ANNOUNCEMENT_API +
"?t=" +
Date.now()
);

announcements =
await response.json();

buildPages();

}
catch(error){

console.log(error);

}

}

/*************************************************
PAGE BUILDER
**************************************************/

function buildPages(){

pages = [];

const availableSlots =
weatherAlert ? 2 : 3;

for(
let i = 0;
i < announcements.length;
i += availableSlots
){

pages.push(
announcements.slice(
i,
i + availableSlots
)
);
}

if(pages.length === 0){
pages.push([]);
}

}

/*************************************************
RENDER
**************************************************/

function render(){

const content =
document.getElementById("content");

const page =
pages[currentPage] || [];

let html = "";

html += `
<div class="item kpi">
<div class="kpi-days">
${getIncidentDays()}
</div>

<div class="kpi-label">
DAYS INCIDENT FREE
</div>

<div class="kpi-sub">
Great work Sheffield team
</div>
</div>
`;

if(weatherAlert){

html += `
<div
class="item alert"
style="background:${weatherAlert.color};"
>
<div class="alert-title">
${weatherAlert.title}
</div>

<div class="alert-message">
${weatherAlert.message}
</div>
</div>
`;
}

page.forEach(item => {

html += `
<div class="item">

<div class="title">
${item.title}
</div>

<div class="message">
${item.message}
</div>

</div>
`;

});

content.innerHTML = html;

currentPage++;

if(currentPage >= pages.length){
currentPage = 0;
}

}

/*************************************************
STARTUP
**************************************************/

buildPages();
render();

setInterval(render, ROTATION_TIME);

loadWeatherAlert();
loadAnnouncements();

setInterval(loadWeatherAlert, 900000);
setInterval(loadAnnouncements, 300000);

</script>

</body>
</html>
