<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">
<title>Factory Announcements</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
width:450px;height:450px;overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#002D72;color:white;
}
#content{
width:450px;height:450px;
display:grid;
grid-template-rows:140px 80px 76px 76px 78px;
background:;
}
.kpi-wrap{padding:10px;}
.kpi{
height:100%;
border:5px solid #00A651;
border-radius:8px;
background:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}
.kpi-days{font-size:78px;font-weight:800;color:#00A651;line-height:.9;}
.kpi-text{font-size:24px;font-weight:700;color:#00A651;}

.alert,.item{
padding:10px 14px;
display:flex;
flex-direction:column;
justify-content:center;
}
.alert{
color:white;
}
.alert-head{
display:flex;align-items:center;gap:10px;
font-size:20px;font-weight:700;
}
.alert-msg{font-size:16px;font-weight:700;margin-top:4px;}
.triangle{font-size:34px;line-height:1;}

.item{
border-top:1px solid rgba(255,255,255,.15);
}
.title{font-size:22px;font-weight:700;}
.message{font-size:14px;opacity:.95;margin-top:3px;}
.empty{border-top:1px solid rgba(255,255,255,.15);}
</style>
</head>
<body>
<div id="content"></div>

<script>
const LAST_INCIDENT_DATE="2026-01-08";
const LAT=53.3811;
const LON=-1.4701;
const ROTATE=10000;
const ANNOUNCEMENT_API="";

let weatherAlert=null;
let pages=[];
let currentPage=0;

let announcements=[
{title:"SAFETY WEEK",message:"Remember hearing protection in all production areas."},
{title:"MAINTENANCE SHUTDOWN",message:"Saturday 14th June."},
{title:"TEAM BRIEFING",message:"Friday 10:00 AM in the canteen."},
{title:"NEW H&S POLICY",message:"Available on the intranet."},
{title:"PRODUCTION MILESTONE",message:"Monthly target achieved."}
];

function incidentDays(){
 return Math.floor((new Date()-new Date(LAST_INCIDENT_DATE))/86400000);
}

async function loadWeather(){
 try{
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=weather_code&timezone=Europe/London`);
  const d=await r.json();
  weatherAlert=null;
  const c=d.daily.weather_code[0];

  if([95,96,99].includes(c))
    weatherAlert={color:"#C8102E",msg:"SEVERE THUNDERSTORM WARNING"};
  else if([61,63,65,80,81,82].includes(c))
    weatherAlert={color:"#F39C12",msg:"HEAVY RAIN WARNING"};
  else if([71,73,75,77,85,86].includes(c))
    weatherAlert={color:"#FFD100",text:"#000",msg:"HEAVY SNOW WARNING"};

  buildPages();
 }catch(e){}
}

function buildPages(){
 pages=[];
 const slots=weatherAlert?2:3;

 for(let i=0;i<announcements.length;i+=slots){
   pages.push(announcements.slice(i,i+slots));
 }
 if(!pages.length) pages=[[]];
}

function render(){
 const page=pages[currentPage]||[];
 let html=`
 <div class="kpi-wrap">
  <div class="kpi">
   <div class="kpi-days">${incidentDays()}</div>
   <div class="kpi-text">DAYS INCIDENT FREE</div>
  </div>
 </div>`;

 let remaining=3;

 if(weatherAlert){
   html+=`
   <div class="alert" style="background:${weatherAlert.color};color:${weatherAlert.text||'#fff'}">
    <div class="alert-head"><span class="triangle">⚠</span> WEATHER ALERT</div>
    <div class="alert-msg">${weatherAlert.msg}</div>
   </div>`;
   remaining--;
 }

 page.forEach(a=>{
   html+=`<div class="item"><div class="title">${a.title}</div><div class="message">${a.message}</div></div>`;
   remaining--;
 });

 while(remaining>0){
   html+=`<div class="empty"></div>`;
   remaining--;
 }

 document.getElementById('content').innerHTML=html;
 currentPage=(currentPage+1)%pages.length;
}

buildPages();
render();
loadWeather();

setInterval(render,ROTATE);
setInterval(loadWeather,900000);
</script>
</body>
</html>
