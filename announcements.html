
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">
<title>Announcements & Alerts</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
width:450px;
height:450px;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;

}

.header{
height:52px;
display:flex;
align-items:center;
padding:0 12px;
}

.header-accent{
width:4px;
height:24px;
background:#D22630;
border-radius:2px;
margin-right:10px;
flex-shrink:0;
}

.header-title{
font-family:"Arial Narrow",Arial,sans-serif;
font-size:20px;
font-weight:700;
color:#fff;
line-height:1;
}

.header-line{
flex:1;
height:1px;
margin-left:12px;
background:linear-gradient(to right,rgba(255,255,255,.18),rgba(255,255,255,.03));
}

#content{
height:398px;
display:grid;
grid-template-rows:repeat(4,1fr);
}

.row{
display:flex;
align-items:center;
gap:12px;
margin:4px 10px;
padding:12px 14px;
border-radius:10px;
background:linear-gradient(180deg,rgba(6,48,100,.95),rgba(2,28,65,.95));
border:1px solid rgba(255,255,255,.08);
color:white;
}

.weather.normal{background:linear-gradient(180deg,#00A651,#008f46);}
.weather.yellow{background:linear-gradient(180deg,#FFD100,#e0ba00);color:#000;}
.weather.amber{background:linear-gradient(180deg,#d8871a,#c8700d);}
.weather.red{background:linear-gradient(180deg,#d3203e,#b00020);}

.icon-wrap{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:2px solid rgba(255,255,255,.15);
background:rgba(0,0,0,.15);
flex-shrink:0;
}

.material-symbols-outlined{
font-size:28px;
font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 48;
}

.text{flex:1;min-width:0;}

.title{
font-size:16px;
font-weight:700;
line-height:1.15;
}

.message{
margin-top:4px;
font-size:14px;
line-height:1.3;
opacity:.95;
}

.weather.yellow .material-symbols-outlined,
.weather.yellow .title,
.weather.yellow .message{
color:#000;
}
</style>
</head>
<body>

<div class="header">
<div class="header-accent"></div>
<div class="header-title">Announcements &amp; Alerts</div>
<div class="header-line"></div>
</div>

<div id="content"></div>

<script>
const ROTATE_EVERY=30000;
const LATITUDE=53.3811;
const LONGITUDE=-1.4701;
const ANNOUNCEMENT_API="";

const iconMap={
safety:"shield",
maintenance:"build",
people:"groups",
production:"factory",
training:"school",
logistics:"local_shipping",
quality:"verified",
environment:"eco",
visitor:"badge",
announcement:"campaign",
celebration:"celebration"
};

let announcements=[
{
category:"training",
title:"Compliance Training - Now Due!",
message:"Please arrange completion of your Code of Conduct training with your line manager."
},
{
category:"celebration",
title:"Callum Rickhuss Promotion",
message:"Congratulations to Callum on his promotion to Warehouse Team Leader."
}
];

let weatherInfo={
class:"normal",
title:"WEATHER",
message:"No Alerts in Effect"
};

let currentPage=0;

async function loadWeather(){
try{
const response=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`);
const data=await response.json();
const code=data.daily.weather_code[0];

weatherInfo={class:"normal",title:"WEATHER",message:"No Alerts in Effect"};

if([95,96,99].includes(code)){
weatherInfo={class:"red",title:"WEATHER WARNING",message:"Severe Thunderstorm Warning in Effect"};
}else if([61,63,65,80,81,82].includes(code)){
weatherInfo={class:"amber",title:"WEATHER WARNING",message:"Heavy Rain Expected"};
}else if([71,73,75,77,85,86].includes(code)){
weatherInfo={class:"yellow",title:"WEATHER WARNING",message:"Heavy Snow Expected"};
}
}catch(e){console.log(e);}
}

function getPages(){
const pages=[];
for(let i=0;i<announcements.length;i+=3){
pages.push(announcements.slice(i,i+3));
}
if(pages.length===0) pages.push([]);
return pages;
}

function render(){
const pages=getPages();
const page=pages[currentPage]||[];

let html=`
<div class="row weather ${weatherInfo.class}">
<div class="icon-wrap"><span class="material-symbols-outlined">warning</span></div>
<div class="text">
<div class="title">${weatherInfo.title}</div>
<div class="message">${weatherInfo.message}</div>
</div>
</div>`;

for(let i=0;i<3;i++){
const item=page[i];

if(item){
const icon=iconMap[item.category]||"campaign";
html+=`
<div class="row">
<div class="icon-wrap"><span class="material-symbols-outlined">${icon}</span></div>
<div class="text">
<div class="title">${item.title}</div>
<div class="message">${item.message}</div>
</div>
</div>`;
}else{
html+=`<div class="row"><div class="text"><div class="title">&nbsp;</div></div></div>`;
}
}

document.getElementById("content").innerHTML=html;

currentPage++;
if(currentPage>=pages.length) currentPage=0;
}

async function start(){
await loadWeather();
render();
setInterval(render,ROTATE_EVERY);
setInterval(loadWeather,900000);
}

start();
</script>

</body>
</html>
