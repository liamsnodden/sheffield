<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">

<title>Factory Announcements</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:450px;
height:450px;
overflow:hidden;
background:transparent;
font-family:Arial, Helvetica, sans-serif;
}

#content{
width:450px;
height:450px;
display:grid;
grid-template-rows:
120px
110px
73px
73px
74px;
}

.kpi{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.kpi-days{
font-size:88px;
font-weight:800;
color:#00C853;
line-height:0.85;
}

.kpi-label{
font-size:24px;
font-weight:700;
color:#00C853;
letter-spacing:1px;
}

.alert,
.item{
margin:4px 0;
border-radius:8px;
padding:10px 14px;
display:flex;
align-items:center;
gap:12px;
}

.alert{
background:#C8102E;
color:white;
}

.alert-icon{
font-size:40px;
line-height:1;
}

.alert-title{
font-size:20px;
font-weight:700;
}

.alert-message{
font-size:13px;
margin-top:2px;
}

.item{
background:rgba(0,45,114,0.92);
color:white;
}

.material-symbols-outlined{
font-size:34px;
color:white;
flex-shrink:0;

font-variation-settings:
'FILL' 0,
'wght' 400,
'GRAD' 0,
'opsz' 48;
}

.text{
display:flex;
flex-direction:column;
}

.title{
font-size:20px;
font-weight:700;
line-height:1;
}

.message{
font-size:12px;
opacity:.95;
margin-top:4px;
}

.empty{
background:transparent;
}

</style>
</head>
<body>

<div id="content"></div>

<script>

/******************************************
CONFIGURATION
******************************************/

const LAST_INCIDENT_DATE = "2026-01-08";
const ROTATE_EVERY = 10000;

// Sheffield
const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

// Optional announcement API
const ANNOUNCEMENT_API = "";

/******************************************
GOOGLE ICON MAP
******************************************/

const iconMap = {

safety: "shield",
maintenance: "build",
people: "groups",
production: "factory",
training: "school",
logistics: "local_shipping",
quality: "verified",
environment: "eco",
visitor: "badge",
announcement: "campaign"

};

/******************************************
DEMO DATA
******************************************/

let announcements = [

{
category:"safety",
title:"SAFETY WEEK",
message:"Remember hearing protection in all production areas."
},

{
category:"maintenance",
title:"MAINTENANCE SHUTDOWN",
message:"Saturday 14th June."
},

{
category:"people",
title:"TEAM BRIEFING",
message:"Friday 10:00 AM in canteen."
},

{
category:"quality",
title:"QUALITY FOCUS",
message:"Verify paperwork before release."
},

{
category:"training",
title:"TRAINING",
message:"Forklift refresher this week."
}

];

let weatherAlert = null;
let currentPage = 0;

/******************************************
INCIDENT FREE DAYS
******************************************/

function getIncidentDays(){

const start =
new Date(LAST_INCIDENT_DATE);

const today =
new Date();

return Math.floor(
(today - start) /
86400000
);

}

/******************************************
WEATHER ALERTS
******************************************/

async function loadWeather(){

try{

const response =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`
);

const data =
await response.json();

weatherAlert = null;

const code =
data.daily.weather_code[0];

if([95,96,99].includes(code)){

weatherAlert = {
colour:"#C8102E",
text:"SEVERE THUNDERSTORM WARNING"
};

}
else if(
[61,63,65,80,81,82]
.includes(code)
){

weatherAlert = {
colour:"#F39C12",
text:"HEAVY RAIN WARNING"
};

}
else if(
[71,73,75,77,85,86]
.includes(code)
){

weatherAlert = {
colour:"#FFD100",
textColour:"#000",
text:"HEAVY SNOW WARNING"
};

}

}
catch(err){

console.log(err);

}

}

/******************************************
ANNOUNCEMENT API
******************************************/

async function loadAnnouncements(){

if(!ANNOUNCEMENT_API) return;

try{

const response =
await fetch(
ANNOUNCEMENT_API +
"?t=" +
Date.now()
);

announcements =
await response.json();

}
catch(err){

console.log(err);

}

}

/******************************************
PAGING
******************************************/

function getPages(){

const slots =
weatherAlert ? 2 : 3;

const pages = [];

for(
let i = 0;
i < announcements.length;
i += slots
){

pages.push(
announcements.slice(
i,
i + slots
)
);

}

if(pages.length === 0){

pages.push([]);

}

return pages;

}

/******************************************
RENDER
******************************************/

function render(){

const pages =
getPages();

const page =
pages[currentPage] || [];

let html = "";

html += `
<div class="kpi">

<div class="kpi-days">
${getIncidentDays()}
</div>

<div class="kpi-label">
DAYS INCIDENT FREE
</div>

</div>
`;

let remainingRows = 4;

if(weatherAlert){

html += `
<div
class="alert"
style="
background:${weatherAlert.colour};
color:${weatherAlert.textColour || '#fff'};
"
>

<div class="alert-icon">
⚠
</div>

<div>

<div class="alert-title">
WEATHER ALERT
</div>

<div class="alert-message">
${weatherAlert.text}
</div>

</div>

</div>
`;

remainingRows--;

}

page.forEach(item => {

const icon =
iconMap[item.category] ||
"campaign";

html += `
<div class="item">

<span class="material-symbols-outlined">
${icon}
</span>

<div class="text">

<div class="title">
${item.title}
</div>

<div class="message">
${item.message}
</div>

</div>

</div>
`;

remainingRows--;

});

while(remainingRows > 0){

html += `
<div class="empty"></div>
`;

remainingRows--;

}

document
.getElementById("content")
.innerHTML = html;

currentPage++;

if(currentPage >= pages.length){

currentPage = 0;

}

}

/******************************************
STARTUP
******************************************/

async function start(){

await loadWeather();
await loadAnnouncements();

render();

setInterval(render, ROTATE_EVERY);

setInterval(loadWeather, 900000);

setInterval(
loadAnnouncements,
300000
);

}

start();

</script>

</body>
</html>
