<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">
<title>Factory Announcements</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
width:450px;height:450px;overflow:hidden;
background:transparent;
font-family:Arial,Helvetica,sans-serif;
}
#content{
width:450px;height:450px;
display:grid;
grid-template-rows:120px 110px 73px 73px 74px;
}
.kpi{
display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.kpi-days{font-size:86px;font-weight:800;color:#19c15a;line-height:.9}
.kpi-label{font-size:24px;font-weight:700;color:#19c15a}

.alert,.item{
margin:4px 0;
border-radius:8px;
padding:10px 14px;
display:flex;
align-items:center;
gap:12px;
}
.alert{background:#c8102e;color:#fff}
.item{background:rgba(0,45,114,.92);color:#fff}
.icon,.warn{width:34px;height:34px;flex-shrink:0}
.icon{stroke:white;fill:none;stroke-width:2}
.title{font-size:20px;font-weight:700;line-height:1}
.msg{font-size:12px;margin-top:4px;opacity:.95}
.text{display:flex;flex-direction:column}
.empty{background:transparent}
</style>
</head>
<body>
<div id="content"></div>

<script>
const LAST_INCIDENT_DATE="2026-01-08";
const ROTATE_MS=10000;

const announcements=[
 {category:"safety",title:"SAFETY WEEK",message:"Remember hearing protection in all production areas."},
 {category:"maintenance",title:"MAINTENANCE SHUTDOWN",message:"Saturday 14th June."},
 {category:"people",title:"TEAM BRIEFING",message:"Friday 10:00 AM in canteen."},
 {category:"quality",title:"QUALITY FOCUS",message:"Verify paperwork before release."},
 {category:"training",title:"TRAINING",message:"Forklift refresher this week."}
];

let weatherAlert=null;
let currentPage=0;

function daysFree(){
 return Math.floor((new Date()-new Date(LAST_INCIDENT_DATE))/86400000);
}

function svg(cat){
const s={
safety:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 11-3.5-2.5-7-6-7-11V5z"/></svg>',
maintenance:'<svg class="icon" viewBox="0 0 24 24"><path d="M21 7a5 5 0 0 1-6 6L7 21l-4-4 8-8a5 5 0 0 1 6-6l-3 3 4 4z"/></svg>',
people:'<svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/></svg>',
quality:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 11-3.5-2.5-7-6-7-11V5z"/><path d="M8 12l2 2 5-5"/></svg>',
training:'<svg class="icon" viewBox="0 0 24 24"><path d="M2 8l10-5 10 5-10 5z"/><path d="M6 10v4c0 2 3 4 6 4s6-2 6-4v-4"/></svg>'
};
return s[cat]||s.safety;
}

async function loadWeather(){
 try{
  const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&daily=weather_code&timezone=Europe%2FLondon");
  const d=await r.json();
  const c=d.daily.weather_code[0];
  weatherAlert=null;
  if([95,96,99].includes(c)) weatherAlert="SEVERE THUNDERSTORM WARNING";
  else if([61,63,65,80,81,82].includes(c)) weatherAlert="HEAVY RAIN WARNING";
  else if([71,73,75,77,85,86].includes(c)) weatherAlert="HEAVY SNOW WARNING";
 } catch(e){}
}

function pages(){
 const slots=weatherAlert?2:3;
 const p=[];
 for(let i=0;i<announcements.length;i+=slots){
   p.push(announcements.slice(i,i+slots));
 }
 return p.length?p:[[]];
}

function render(){
 const pgs=pages();
 const page=pgs[currentPage]||[];

 let h=`<div class="kpi"><div class="kpi-days">${daysFree()}</div><div class="kpi-label">DAYS INCIDENT FREE</div></div>`;
 let remain=4;

 if(weatherAlert){
 h+=`<div class="alert">
 <svg class="warn" viewBox="0 0 24 24"><path fill="white" d="M12 2L23 21H1z"/><rect x="11" y="8" width="2" height="7" fill="#c8102e"/><circle cx="12" cy="18" r="1.2" fill="#c8102e"/></svg>
 <div class="text"><div class="title">WEATHER ALERT</div><div class="msg">${weatherAlert}</div></div></div>`;
 remain--;
 }

 page.forEach(a=>{
 h+=`<div class="item">${svg(a.category)}<div class="text"><div class="title">${a.title}</div><div class="msg">${a.message}</div></div></div>`;
 remain--;
 });

 while(remain-->0) h+='<div class="empty"></div>';
 document.getElementById('content').innerHTML=h;
 currentPage=(currentPage+1)%pgs.length;
}

loadWeather().then(render);
setInterval(render,ROTATE_MS);
setInterval(loadWeather,900000);
</script>
</body>
</html>
