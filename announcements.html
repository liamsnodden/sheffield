<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=450">

<title>Announcements</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:450px;
height:450px;
overflow:hidden;
background:transparent;
font-family:Arial, Helvetica, sans-serif;
}

#content{
width:450px;
height:450px;
display:grid;
grid-template-rows:repeat(4,1fr);
}

/* ROWS */

.row{
display:flex;
align-items:center;
gap:8px;
padding:0px 18px;
border-bottom:1px solid rgba(255,255,255,0.15);
background:rgba(0,45,114,0.92);
}

.row:last-child{
border-bottom:none;
}

/* WEATHER */

.weather{
transition:background .3s ease;
}

.weather.normal{
background:#00A651;
  color:#fff;
}

.weather.yellow{
background:#FFD100;
color:#000;
}

.weather.amber{
background:#F39C12;
color:#fff;
}

.weather.red{
background:#C8102E;
color:#fff;
}

/* ICONS */

.material-symbols-outlined{
font-size:40px;
flex-shrink:0;

font-variation-settings:
'FILL' 0,
'wght' 400,
'GRAD' 0,
'opsz' 48;
}

.row:not(.weather){
color:white;
}

.weather.normal .material-symbols-outlined{
color:white;
}

.weather.yellow .material-symbols-outlined{
color:black;
}

.weather.amber .material-symbols-outlined,
.weather.red .material-symbols-outlined{
color:white;
}

/* TEXT */

.text{
display:flex;
flex-direction:column;
}

.title{
font-size:22px;
font-weight:700;
line-height:1;
}

.message{
margin-top:4px;
font-size:16px;
opacity:0.95;
}

.weather .message{
opacity:1;
}

</style>
</head>
<body>

<div id="content"></div>

<script>

/*****************************************
CONFIG
*****************************************/

const ROTATE_EVERY = 10000;

// Sheffield
const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

// Optional API
const ANNOUNCEMENT_API = "";

/*****************************************
ICONS
*****************************************/

const iconMap = {

safety: "shield",
maintenance: "build",
people: "groups",
production: "factory",
training: "school",
logistics: "local_shipping",
quality: "verified",
environment: "eco",
visitor: "badge",
announcement: "campaign",
celebration: "celebration"

};

/*****************************************
DEMO DATA
*****************************************/

let announcements = [

{
category:"school",
title:"Compliance Training - Now Due!",
message:"Please arrange completion of your Code of Conduct training with your line manager."
},

{
category:"celebration",
title:"Callum Rickhuss Promotion",
message:"Congratulations to Callum on his promotion to Warehouse Team Leader - well done Callum!"
},

{
category:"people",
title:"TEAM BRIEFING",
message:"Friday 10:00 AM in canteen."
},

{
category:"celebration",
title:"TARGET ACHIEVED",
message:"Monthly production target exceeded."
},

{
category:"quality",
title:"QUALITY FOCUS",
message:"Verify paperwork before release."
},

{
category:"training",
title:"TRAINING",
message:"Forklift refresher training this week."
}

];

let weatherInfo = {
class:"normal",
title:"WEATHER",
message:"No active alerts"
};

let currentPage = 0;

/*****************************************
WEATHER
*****************************************/

async function loadWeather(){

try{

const response =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`
);

const data =
await response.json();

const code =
data.daily.weather_code[0];

weatherInfo = {
class:"normal",
title:"WEATHER",
message:"No active alerts"
};

if([95,96,99].includes(code)){

weatherInfo = {
class:"red",
title:"WEATHER ALERT",
message:"Severe thunderstorm warning"
};

}

else if(
[61,63,65,80,81,82]
.includes(code)
){

weatherInfo = {
class:"amber",
title:"WEATHER ALERT",
message:"Heavy rain warning"
};

}

else if(
[71,73,75,77,85,86]
.includes(code)
){

weatherInfo = {
class:"yellow",
title:"WEATHER ALERT",
message:"Heavy snow warning"
};

}

}
catch(err){

console.log(err);

}

}

/*****************************************
API
*****************************************/

async function loadAnnouncements(){

if(!ANNOUNCEMENT_API) return;

try{

const response =
await fetch(
ANNOUNCEMENT_API +
"?t=" +
Date.now()
);

announcements =
await response.json();

}
catch(err){

console.log(err);

}

}

/*****************************************
PAGING
*****************************************/

function getPages(){

const pages = [];

for(
let i=0;
i<announcements.length;
i+=3
){

pages.push(
announcements.slice(
i,
i+3
)
);

}

if(pages.length === 0){

pages.push([]);

}

return pages;

}

/*****************************************
RENDER
*****************************************/

function render(){

const pages =
getPages();

const page =
pages[currentPage] || [];

let html = `
<div class="row weather ${weatherInfo.class}">

<span class="material-symbols-outlined">
warning
</span>

<div class="text">

<div class="title">
${weatherInfo.title}
</div>

<div class="message">
${weatherInfo.message}
</div>

</div>

</div>
`;

for(let i=0;i<3;i++){

const item = page[i];

if(item){

const icon =
iconMap[item.category] ||
"campaign";

html += `
<div class="row">

<span
class="material-symbols-outlined"
>
${icon}
</span>

<div class="text">

<div class="title">
${item.title}
</div>

<div class="message">
${item.message}
</div>

</div>

</div>
`;

}
else{

html += `
<div class="row">

<div class="text">
<div class="title">&nbsp;</div>
</div>

</div>
`;

}

}

document
.getElementById("content")
.innerHTML = html;

currentPage++;

if(currentPage >= pages.length){

currentPage = 0;

}

}

/*****************************************
START
*****************************************/

async function start(){

await loadWeather();
await loadAnnouncements();

render();

setInterval(
render,
ROTATE_EVERY
);

setInterval(
loadWeather,
900000
);

setInterval(
loadAnnouncements,
300000
);

}

start();

</script>

</body>
</html>
