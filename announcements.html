<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safety Banner</title>

<style>

/* ✅ ALL FONTS FROM GITHUB */

/* Teko SemiBold */
@font-face {
  font-family: 'Teko';
  src: url('https://raw.githubusercontent.com/liamsnodden/sheffield/main/Teko-SemiBold.ttf') format('truetype'); 
  font-weight: 600;
  font-style: normal;
}


@font-face {
  font-family: 'Inter';
  src: url('https://raw.githubusercontent.com/liamsnodden/sheffield/main/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}


/* Inter Italic Variable */
@font-face {
  font-family: 'Inter';
  src: url('raw.githubusercontent.com/liamsnodden/sheffield/main/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
  font-style: italic;
}

/* Oswald Variable */
@font-face {
  font-family: 'Oswald';
  src: url('raw.githubusercontent.com/liamsnodden/sheffield/main/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
  font-style: normal;
}

body {
  margin: 0;
  background: #ffffff;
  font-family: 'Inter', sans-serif;
  font-weight: 400; /* default */

}

/* CONTAINER */
.incident-banner {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  max-height: 138.5px;
  height: 138.5px;
  box-sizing: border-box;
}

/* LEFT */
.left {
  margin-right: 25px;
  text-align: center;
}

.days {
  font-family: 'Teko', sans-serif;
  font-size: 95px;
  font-weight: 600;
  color: #e10600;
  line-height: 0.85;
}

.label {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: #9a9a9a;
}

/* DIVIDER */
.divider {
  width: 1px;
  height: 90px;
  background: #d0d0d0;
  margin: 0 25px;
}

/* RIGHT */
.right {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* STATUS */
.status {
  display: flex;
  align-items: center;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}

.status img {
  width: 24px;
  margin-right: 10px;
}

/* LINE */
.line {
  height: 1px;
  background: #e0e0e0;
  margin: 6px 0;
}

/* INCIDENT */
.last-incident {
  display: flex;
  align-items: center;
}

.last-incident img {
  width: 26px;
  margin-right: 10px;
}

.small {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: #888;
}

.date {
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  font-weight: 700;
}

</style>
</head>

<body>

<div class="incident-banner">
  
  <div class="left">
    <div class="days" id="daysCount">0</div>
    <div class="label">DAYS INCIDENT FREE</div>
  </div>

  <div class="divider"></div>

  <div class="right">

    <div class="status">
      <img src="https://liamsnodden.github.io/sheffield/icons/tick.svg">
      <span>Everyone home safe today</span>
    </div>

    <div class="line"></div>

    <div class="last-incident">
     
      <div>
        <div class="small">Last lost time incident:</div>
        <div class="date" id="incidentDate"></div>
      </div>
    </div>

  </div>

</div>

<script>
const incidentDate = new Date("2025-08-05");

const today = new Date();
const diffDays = Math.floor((today - incidentDate) / (1000 * 60 * 60 * 24));

document.getElementById("daysCount").textContent = diffDays;

document.getElementById("incidentDate").textContent =
  incidentDate.toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'long',
    year: 'numeric'
  }).toUpperCase();

function msUntilMidnight() {
  const midnight = new Date();
  midnight.setHours(24, 0, 0, 0);
  return midnight - new Date();
}

setTimeout(() => location.reload(), msUntilMidnight());
</script>

</body>
</html>
