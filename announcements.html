<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450,height=auto">
<title>Announcements & Alerts</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:450px;
height:auto;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:transparent;
}

/* HEADERS */

.header{
height:40px;
display:flex;
align-items:center;
padding:0 12px;
}

.header-accent{
width:4px;
height:24px;
background:#D22630;
border-radius:2px;
margin-right:10px;
}

.header-title{
font-family:"Arial Narrow",Arial,sans-serif;
font-size:20px;
font-weight:700;
color:#fff;
}

.header-line{
flex:1;
height:1px;
margin-left:12px;
background:rgba(255,255,255,.25);
}

/* CARDS */

.row{
display:flex;
align-items:center;
gap:12px;
margin:4px 10px;
padding:12px 14px;
border-radius:10px;
border:1px solid rgba(255,255,255,.08);
color:#fff;
}

.standard-card{

}

.weather.normal{
background:linear-gradient(180deg,#00A651,#008f46);
}

.weather.yellow{
background:linear-gradient(180deg,#FFD100,#E0BA00);
color:#000;
}

.weather.amber{
background:linear-gradient(180deg,#D8871A,#C8700D);
}

.weather.red{
background:linear-gradient(180deg,#D3203E,#B00020);
}

.safety-card{
background:linear-gradient(180deg,#00A651,#008F46);
min-height:105px;
}

/* ICONS */

.icon-wrap{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:2px solid rgba(255,255,255,.15);
background:rgba(0,0,0,.15);
flex-shrink:0;
}

.material-symbols-outlined{
font-size:28px;
}

.text{
flex:1;
min-width:0;
}

.title{
font-size:16px;
font-weight:700;
line-height:1.15;
}

.message{
margin-top:4px;
font-size:14px;
line-height:1.3;
opacity:.95;
}

/* SAFETY */

.safety-content{
flex:1;
text-align:left;
padding-left:8px;
}

.days{
font-size:42px;
font-weight:700;
line-height:1;
margin-top:2px;
text-align:left;
}

.days-label{
font-size:14px;
font-weight:600;
margin-top:4px;
}

.last-date{
display:flex;
align-items:flex-start;
gap:4px;
margin-top:8px;
font-size:13px;
}

.last-date .material-symbols-outlined{
font-size:16px;
}

/* CONTENT AREA */

#content{
height:220px;
overflow:hidden;
}
</style>
</head>
<body>

<!-- SAFETY PERFORMANCE -->

<div class="header">
<div class="header-accent"></div>
<div class="header-title">Lost Time Incident Free Days</div>
<div class="header-line"></div>
</div>

<div class="row safety-card">
<div class="icon-wrap">
<span class="material-symbols-outlined">shield</span>
</div>

<div class="safety-content">

<div id="daysSince" class="days">0</div>



<div class="last-date">
<span class="material-symbols-outlined">
calendar_month
</span>
25 May 2025
</div>

</div>
</div>

<!-- ANNOUNCEMENTS -->

<div class="header">
<div class="header-accent"></div>
<div class="header-title">Announcements & Alerts</div>
<div class="header-line"></div>
</div>

<div id="content"></div>

<script>
const ROTATE_EVERY = 30000;

const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

/* SAFETY */

const LTI_DATE = new Date("2025-05-25");

function updateLTIDays(){

const today = new Date();

const start = new Date(LTI_DATE);
start.setHours(0,0,0,0);

today.setHours(0,0,0,0);

const days =
Math.floor(
(today - start) /
(1000 * 60 * 60 * 24)
);

document.getElementById("daysSince").textContent =
days.toLocaleString();
}

/* ICONS */

const iconMap = {
training:"school",
celebration:"celebration",
announcement:"campaign",
safety:"shield",
maintenance:"build",
people:"groups",
production:"factory"
};

/* SAMPLE DATA */

let announcements = [
{
category:"training",
title:"Compliance Training - Now Due!",
message:"Please arrange completion of your Code of Conduct training."
},
{
category:"celebration",
title:"Callum Rickhuss Promotion",
message:"Congratulations on promotion to Warehouse Team Leader."
}
];

/* WEATHER */

let weatherInfo = {
class:"standard-card",
title:"Weather",
message:"No Alerts in Effect"
};

let currentPage = 0;

async function loadWeather(){

try{

const response =
await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`
);

const data = await response.json();

const code =
data.daily.weather_code[0];

weatherInfo = {
class:"standard-card",
title:"Weather",
message:"No Alerts in Effect"
};

if([95,96,99].includes(code)){
weatherInfo = {
class:"red",
title:"WEATHER WARNING",
message:"Severe Thunderstorm Warning"
};
}
else if([61,63,65,80,81,82].includes(code)){
weatherInfo = {
class:"amber",
title:"WEATHER WARNING",
message:"Heavy Rain Expected"
};
}
else if([71,73,75,77,85,86].includes(code)){
weatherInfo = {
class:"yellow",
title:"WEATHER WARNING",
message:"Heavy Snow Expected"
};
}

}
catch(e){
console.log(e);
}
}

/* PAGING */

function getPages(){

const pages = [];

for(let i=0;i<announcements.length;i+=3){
pages.push(
announcements.slice(i,i+3)
);
}

if(!pages.length){
pages.push([]);
}

return pages;
}

/* RENDER */

function render(){

const pages = getPages();

const page =
pages[currentPage] || [];

let html = `
<div class="row $weatherInfo.class === "standard-card"
? "standard-card"
:'weather ${weatherInfo.class}'
}">

<div class="icon-wrap">
<span class="material-symbols-outlined">
warning
</span>
</div>

<div class="text">
<div class="title">
${weatherInfo.title}
</div>

<div class="message">
${weatherInfo.message}
</div>
</div>
</div>
`;

page.forEach(item=>{

const icon =
iconMap[item.category] ||
"campaign";

html += `
<div class="row standard-card">

<div class="icon-wrap">
<span class="material-symbols-outlined">
${icon}
</span>
</div>

<div class="text">
<div class="title">
${item.title}
</div>

<div class="message">
${item.message}
</div>
</div>

</div>
`;
});

document.getElementById("content").innerHTML =
html;

currentPage++;

if(currentPage >= pages.length){
currentPage = 0;
}
}

/* START */

async function start(){

updateLTIDays();

await loadWeather();

render();

setInterval(render, ROTATE_EVERY);

setInterval(loadWeather, 900000);

setInterval(updateLTIDays, 3600000);
}

start();
</script>

</body>
</html>
