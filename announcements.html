<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=506">
<title>Safety & Announcements</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background:#f4f6f9;
}

/* CARD */
.card{
background:#fff;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin:10px;
overflow:hidden;
}

/* HEADER */
.section-header{
display:flex;
align-items:center;
background:linear-gradient(135deg,#0d47a1,#1565c0);
color:#fff;
padding:12px 16px;
font-family:'Oswald',sans-serif;
font-size:20px;
letter-spacing:.5px;
}

.section-header img{
width:22px;
margin-right:10px;
filter:invert(1);
}

/* SAFETY */
.safety-body{
display:flex;
padding:20px;
align-items:center;
}

.safety-left{
flex:1;
}

.safety-label{
color:#666;
font-size:13px;
font-weight:500;
letter-spacing:.3px;
}

.days{
font-family:'Oswald',sans-serif;
font-size:90px;
font-weight:700;
color:#d32f2f;
line-height:1;
}

.safety-message{
margin-top:12px;
color:#1565c0;
font-weight:600;
font-size:14px;
}

.safety-right{
width:140px;
text-align:center;
}

.safety-right img{
width:100px;
opacity:.25;
}

/* VALUES */
.values{
display:flex;
border-top:1px solid #eee;
padding:12px;
justify-content:space-around;
text-align:center;
font-size:12px;
color:#444;
}

.values div{
flex:1;
font-family:'Oswald',sans-serif;
font-weight:500;
}

/* ANNOUNCEMENTS */
.announcement{
display:flex;
align-items:center;
padding:14px;
border-bottom:1px solid #eee;
}

.announcement:last-child{
border-bottom:none;
}

.announcement-icon{
width:50px;
height:50px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
margin-right:12px;
flex-shrink:0;
}

.announcement-icon img{
width:26px;
filter:invert(1);
}

.blue{background:#1565c0;}
.grey{background:#6d6d6d;}
.red{background:#c62828;}

.announcement-text{
flex:1;
}

.announcement-title{
font-family:'Oswald',sans-serif;
font-weight:600;
font-size:16px;
}

.announcement-message{
font-size:13px;
color:#555;
margin-top:3px;
}

.announcement-date{
font-size:12px;
color:#1565c0;
white-space:nowrap;
margin-left:10px;
font-weight:500;
}
</style>
</head>

<body>

<!-- SAFETY -->
<div class="card">
<div class="section-header">
<img src="https://liamsnodden.github.io/sheffield/icons/shield.svg">
SAFETY PERFORMANCE
</div>

<div class="safety-body">
<div class="safety-left">
<div class="safety-label">DAYS SINCE LAST LTI</div>
<div id="daysSince" class="days">261</div>
<div class="safety-message">EVERY DAY SAFE, WE ALL GO HOME SAFE</div>
</div>

<div class="safety-right">
<img src="https://liamsnodden.github.io/sheffield/icons/shield.svg">
</div>
</div>

<div class="values">
<div>CARE<br><small>FOR EACH OTHER</small></div>
<div>WORK<br><small>SAFE</small></div>
<div>BE<br><small>RESPONSIBLE</small></div>
<div>STRIVE FOR<br><small>EXCELLENCE</small></div>
</div>
</div>

<!-- ANNOUNCEMENTS -->
<div class="card">
<div class="section-header">
<img src="https://liamsnodden.github.io/sheffield/icons/campaign.svg">
ANNOUNCEMENTS
</div>
<div id="content"></div>
</div>

<script>

/* SETTINGS */
const ROTATE_EVERY = 30000;
const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

/* STATIC DAYS (FORCED TO 261) */
function updateLTIDays(){
document.getElementById("daysSince").textContent = "261";
}

/* ICONS */
const iconMap = {
training:'https://liamsnodden.github.io/sheffield/icons/training.svg',
celebration:'https://liamsnodden.github.io/sheffield/icons/celebration.svg',
announcement:'https://liamsnodden.github.io/sheffield/icons/campaign.svg',
maintenance:'https://liamsnodden.github.io/sheffield/icons/build.svg'
};

/* DATA */
let announcements = [
{
category:"announcement",
title:"Safety Standdown This Friday",
message:"Join us this Friday at 10:00 AM for a site-wide safety standdown."
},
{
category:"training",
title:"Mandatory Training Reminder",
message:"Complete all training modules by 31 May 2025."
},
{
category:"maintenance",
title:"Planned Maintenance – Gate 2",
message:"Gate 2 closed 26 May from 9:00 AM to 12:00 PM."
},
{
category:"celebration",
title:"Promotion Announcement",
message:"Congratulations on your recent promotion."
}
];

let currentPage = 0;

/* PAGING */
function getPages(){
const pages = [];
for(let i=0;i<announcements.length;i+=3){
pages.push(announcements.slice(i,i+3));
}
return pages;
}

/* WEATHER */
let weatherInfo = {
message:"No weather alerts"
};

async function loadWeather(){
try{
const res = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weather_code&timezone=Europe/London`
);

const data = await res.json();
const code = data.daily.weather_code[0];

if([95,96,99].includes(code)){
weatherInfo.message = "⚠ Severe thunderstorm warning";
}
else if([61,63,65].includes(code)){
weatherInfo.message = "Heavy rain expected";
}
else{
weatherInfo.message = "No weather alerts";
}
}catch(e){}
}

/* RENDER */
function render(){

const pages = getPages();
const page = pages[currentPage];
let html = '';

/* weather */
html += `
<div class="announcement">
<div class="announcement-icon blue">
<img src="https://liamsnodden.github.io/sheffield/icons/warning.svgclass="announcement-title">Weather</div>
<div class="announcement-message">${weatherInfo.message}</div>
</div>
</div>
`;

/* announcements */
page.forEach(item => {

let color = "blue";
if(item.category==="training") color="grey";
if(item.category==="maintenance") color="red";

html += `
<div class="announcement">
<div class="announcement-icon ${color}">
<img src="${iconMap[item.category]}div class="announcement-text">
<div class="announcement-title">${item.title}</div>
<div class="announcement-message">${item.message}</div>
</div>

<div class="announcement-date">
${new Date().toLocaleDateString('en-GB',{
day:'2-digit', month:'short'
})}
</div>
</div>
`;
});

document.getElementById("content").innerHTML = html;

currentPage++;
if(currentPage >= pages.length) currentPage = 0;
}

/* START */
async function start(){
updateLTIDays();
await loadWeather();
render();

setInterval(render, ROTATE_EVERY);
setInterval(loadWeather, 900000);
}

start();

</script>

</body>
</html>
