<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safety Banner</title>

<!-- ✅ Proper Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #ffffff;
}

/* CONTAINER */
.incident-banner {
  display: flex;
  align-items: center;
  padding: 20px 30px;
}

/* LEFT */
.left {
  margin-right: 30px;
  text-align: center;
}

.days {
  font-family: 'Teko', sans-serif;
  font-size: 130px;
  font-weight: 700;
  color: #e10600;
  line-height: 0.85;
  letter-spacing: 2px;
}

.label {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #9a9a9a;
}

/* DIVIDER */
.divider {
  width: 1px;
  height: 120px;
  background: #d0d0d0;
  margin: 0 30px;
}

/* RIGHT */
.right {
  display: flex;
  flex-direction: column;
}

.status {
  display: flex;
  align-items: center;
  font-family: 'Inter', sans-serif;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}

.status img {
  width: 30px;
  margin-right: 12px;
}

.line {
  height: 1px;
  background: #e0e0e0;
  margin: 10px 0;
}

.last-incident {
  display: flex;
  align-items: center;
}

.last-incident img {
  width: 32px;
  margin-right: 12px;
}

.small {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  color: #888;
}

.date {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
}
</style>
</head>

<body>

<div class="incident-banner">
  
  <div class="left">
    <div class="days" id="daysCount">0</div>
    <div class="label">DAYS INCIDENT FREE</div>
  </div>

  <div class="divider"></div>

  <div class="right">

    <div class="status">
      <img src="https://liamsnodden.github.io/sheffield/icons/tick.svg">
      <span>Everyone home safe today</span>
    </div>

    <div class="line"></div>

    <div class="last-incident">
      <!-- ✅ Calendar icon -->
      <img src="https://liamsnodden.github.io/sheffield/icons/calendar.svg">
      <div>
        <div class="small">Last lost time incident:</div>
        <div class="date" id="incidentDate"></div>
      </div>
    </div>

  </div>

</div>

<script>
/* ✅ FIXED INCIDENT DATE */
const incidentDate = new Date("2025-05-30");

/* ✅ CALCULATE DAYS FROM DATE */
const today = new Date();
const diffDays = Math.floor((today - incidentDate) / (1000 * 60 * 60 * 24));

document.getElementById("daysCount").textContent = diffDays;

/* ✅ FORMAT DATE */
document.getElementById("incidentDate").textContent =
  incidentDate.toLocaleDateString('en-GB', {
    day: '2-digit',
    month: 'long',
    year: 'numeric'
  }).toUpperCase();

/* ✅ AUTO REFRESH AT MIDNIGHT */
function msUntilMidnight() {
  const midnight = new Date();
  midnight.setHours(24, 0, 0, 0);
  return midnight - new Date();
}

setTimeout(() => location.reload(), msUntilMidnight());
</script>

</body>
</html>
