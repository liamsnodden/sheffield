<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<style>

@font-face {
    font-family: 'Inter';
    src: url('https://raw.githubusercontent.com/liamsnodden/sheffield/main/Inter-VariableFont_opsz,wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    align-items: center; /* VERTICAL CENTRE */
}

#current-date {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 25px;
    font-weight: 600;
    color: #102342;
    line-height: 1;
    white-space: nowrap;
}

</style>
</head>

<body>

<div id="current-date"></div>

<script>
document.getElementById("current-date").textContent =
    new Date().toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    });
</script>

</body>
</html>
