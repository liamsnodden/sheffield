<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:transparent;
font-family:'Segoe UI',sans-serif;
}

.weather-panel{
width:700px;
height:245px;
background:linear-gradient(180deg,#004f9f 0%, #005db8 100%);
border-radius:8px;
color:white;
padding:14px 20px;
overflow:hidden;
}

.header{
font-size:18px;
font-weight:600;
letter-spacing:.5px;
border-bottom:1px solid rgba(255,255,255,.25);
padding-bottom:8px;
}

.content{
display:flex;
height:150px;
align-items:center;
}

.left{
width:60%;
display:flex;
align-items:center;
}

.icon{
width:120px;
text-align:center;
font-size:85px;
}

.temp-area{
margin-left:10px;
}

.temp{
font-size:82px;
font-weight:700;
line-height:.9;
}

.condition{
font-size:18px;
margin-top:8px;
}

.right{
width:40%;
padding-left:20px;
}

.stat{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:16px;
}

.stat label{
opacity:.9;
font-weight:600;
}

.sun{
border-top:1px solid rgba(255,255,255,.25);
margin-top:5px;
padding-top:10px;
}

.sun-row{
display:flex;
justify-content:space-between;
margin-top:8px;
font-size:16px;
}

.sun-icon{
color:#ffd54f;
}
</style>
</head>
<body>

<div class="weather-panel">

<div class="header">
SHEFFIELD, UK
</div>

<div class="content">

<div class="left">

<div id="icon" class="icon">☀️</div>

<div class="temp-area">
<div id="temp" class="temp">--°C</div>
<div id="condition" class="condition">Loading...</div>
</div>

</div>

<div class="right">

<div class="stat">
<label>Feels Like</label>
<span id="feels">--</span>
</div>

<div class="stat">
<label>Humidity</label>
<span id="humidity">--</span>
</div>

<div class="stat">
<label>Wind</label>
<span id="wind">--</span>
</div>

<div class="stat">
<label>Rain Chance</label>
<span id="rain">--</span>
</div>

<div class="sun">

<div class="sun-row">
<span><span class="sun-icon">🌅</span> Sunrise</span>
<span id="sunrise">--</span>
</div>

<div class="sun-row">
<span><span class="sun-icon">🌇</span> Sunset</span>
<span id="sunset">--</span>
</div>

</div>

</div>

</div>

</div>

<script>

function weatherIcon(code){

if(code===0) return "☀️";
if([1,2].includes(code)) return "🌤️";
if(code===3) return "☁️";
if([45,48].includes(code)) return "🌫️";
if([51,53,55].includes(code)) return "🌦️";
if([61,63,65,80,81,82].includes(code)) return "🌧️";
if([71,73,75].includes(code)) return "❄️";
if(code===95) return "⛈️";

return "☁️";
}

function weatherText(code){

const map={
0:"Clear Sky",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Overcast",
45:"Fog",
48:"Fog",
51:"Light Drizzle",
53:"Drizzle",
55:"Heavy Drizzle",
61:"Light Rain",
63:"Rain",
65:"Heavy Rain",
71:"Light Snow",
73:"Snow",
75:"Heavy Snow",
80:"Rain Showers",
81:"Rain Showers",
82:"Heavy Showers",
95:"Thunderstorm"
};

return map[code] || "Unknown";
}

async function updateWeather(){

const url =
"https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=sunrise,sunset&timezone=Europe%2FLondon";

const res = await fetch(url);
const data = await res.json();

const c = data.current.weather_code;

document.getElementById("icon").textContent =
weatherIcon(c);

document.getElementById("temp").textContent =
Math.round(data.current.temperature_2m) + "°C";

document.getElementById("condition").textContent =
weatherText(c);

document.getElementById("feels").textContent =
Math.round(data.current.apparent_temperature) + "°C";

document.getElementById("humidity").textContent =
data.current.relative_humidity_2m + "%";

document.getElementById("wind").textContent =
Math.round(data.current.wind_speed_10m) + " mph";

document.getElementById("rain").textContent =
"--";

document.getElementById("sunrise").textContent =
new Date(data.daily.sunrise[0]).toLocaleTimeString(
'en-GB',
{hour:'2-digit',minute:'2-digit'}
);

document.getElementById("sunset").textContent =
new Date(data.daily.sunset[0]).toLocaleTimeString(
'en-GB',
{hour:'2-digit',minute:'2-digit'}
);

}

updateWeather();
setInterval(updateWeather,600000);

</script>

</body>
</html>
