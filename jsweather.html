<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Widget</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
color:#fff;
}

#weatherSection{
display:flex;
align-items:center;
width:500px;
height:120px;
}

#weather-icon{
width:85px;
height:85px;
flex-shrink:0;
margin-right:8px;
}

#weatherText{
display:flex;
flex-direction:column;
justify-content:center;
height:85px;
}

#weather-temp{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:42px;
font-weight:700;
line-height:0.9;
}

#weather-condition{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:15px;
font-weight:600;
line-height:1;
margin-top:0;
}

#weather-feels{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:12px;
opacity:.9;
line-height:1;
margin-top:1px;
}

.separator{
width:1px;
height:80px;
background:rgba(255,255,255,0.25);
margin-left:12px;
margin-right:12px;
}

</style>

</head>

<body>

<div id="weatherSection">

<img id="weather-icon" src="%%ICON%%" alt="Weather">

<div id="weatherText">

<div id="weather-temp">%%TEMP%%°C</div>

<div id="weather-condition">%%CONDITION%%</div>

<div id="weather-feels">
Feels like %%FEELS%%°C
</div>

</div>

<div class="separator"></div>

</div>

</body>
</html>
