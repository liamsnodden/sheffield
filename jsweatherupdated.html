
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
color:#fff;
}

#weatherSection{
display:flex;
align-items:center;
width:700px;
height:120px;
padding:10px;
}

#weather-icon{
width:85px;
height:85px;
margin-right:18px;
}

#weatherText{
display:flex;
flex-direction:column;
justify-content:center;
height:85px;
}

#weather-temp{
font-size:42px;
font-weight:700;
line-height:1;
}

#weather-condition{
font-size:15px;
font-weight:600;
}

#weather-feels{
font-size:12px;
opacity:.85;
margin-top:4px;
}

#metrics{
display:flex;
margin-left:auto;
gap:22px;
align-items:center;
}

.metric{
display:flex;
flex-direction:column;
align-items:center;
width:60px;
}

.metricIcon{
font-family:'Material Symbols Outlined';
font-size:28px;
line-height:1;
}

.metricLabel{
font-size:11px;
opacity:.75;
}

.metricValue{
font-size:16px;
font-weight:700;
}
</style>
</head>

<body>

<div id="weatherSection">

<img id="weather-icon" src="04d.png">

<div id="weatherText">
<div id="weather-temp">24°C</div>
<div id="weather-condition">Overcast</div>
<div id="weather-feels">Feels like 23°C</div>
</div>

<div id="metrics">

<div class="metric">
<span class="metricIcon">wb_sunny</span>
<div class="metricLabel">UV</div>
<div class="metricValue">4</div>
</div>

<div class="metric">
<span class="metricIcon">air</span>
<div class="metricLabel">Wind</div>
<div class="metricValue">17</div>
</div>

<div class="metric">
<span class="metricIcon">airwave</span>
<div class="metricLabel">Gust</div>
<div class="metricValue">37</div>
</div>

<div class="metric">
<span class="metricIcon">sunny</span>
<div class="metricLabel">Rise</div>
<div class="metricValue">04:36</div>
</div>

<div class="metric">
<span class="metricIcon">bedtime</span>
<div class="metricLabel">Set</div>
<div class="metricValue">21:37</div>
</div>

</div>

</div>

</body>
</html>
