<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Widget</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
color:#fff;
}

#weatherSection{
display:flex;
align-items:center;
width:500px;
height:120px;
}

#weather-icon{
  width:85px;
  height:85px;
  flex-shrink:0;
  margin-right:8px;
}

#weatherText{
display:flex;
flex-direction:column;
justify-content:center;
}

#weather-temp{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:48px;
font-weight:700;
line-height:1;
}

#weather-condition{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:16px;
font-weight:600;
margin-top:4px;
}

#weather-feels{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:12px;
opacity:.9;
margin-top:4px;
}

</style>

</head>

<body>

<div id="weatherSection">

<img id="weather-icon" src="images/weather/04d.png" alt="weather">

<div id="weatherText">

<div id="weather-temp">13°C</div>

<div id="weather-condition">Overcast</div>

<div id="weather-feels">
Feels like 11°C
</div>

</div>

</div>

</body>
</html>
