
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Widget</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
color:white;
}

#weatherSection{
display:flex;
align-items:center;
width:500px;
height:120px;
}

#weather-icon{
width:85px;
height:85px;
margin-right:18px;
}

#weatherText{
display:flex;
flex-direction:column;
justify-content:center;
height:85px;
}

#weather-temp{
font-size:42px;
font-weight:700;
line-height:0.9;
}

#weather-condition{
font-size:15px;
font-weight:600;
line-height:1;
}

#weather-feels{
font-size:12px;
opacity:.9;
margin-top:2px;
}

</style>

</head>

<body>

<div id="weatherSection">

<img
id="weather-icon"
src="04d.png"
alt="Weather"
>

<div id="weatherText">

<div id="weather-temp">
21°C
</div>

<div id="weather-condition">
Overcast
</div>

<div id="weather-feels">
Feels like 20°C
</div>

<div id="metrics">

<div class="metric">

<img src="uv.png" class="metricIcon">

<div class="metricLabel">UV</div>

<div class="metricValue">2</div>

</div>

<div class="metric">

<img src="wind.png" class="metricIcon">

<div class="metricLabel">Wind</div>

<div class="metricValue">14</div>

</div>

</div>

</body>
</html>
