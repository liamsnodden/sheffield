
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body { margin:0; }

.container {
  display:flex;
}

/* ✅ FORECAST PANEL */
.header-block{
  background:linear-gradient(180deg,#7f1d1d,#b91c1c,#ef4444);
  color:#fff;
  width:180px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  font-family:'Oswald';
}

/* ICON */
.header-icon{
  width:50px;
  height:50px;
  margin-bottom:6px;
}

/* TEMP */
.header-temp{
  font-size:34px;
  font-weight:700;
  line-height:1;
}

/* FEELS */
.header-feels{
  font-size:13px;
  opacity:.85;
}

/* CONDITION */
.header-cond{
  font-size:13px;
}

/* RIGHT SIDE */
.content{
  display:flex;
  flex-direction:column;
  width:100%;
}

.bar{
  display:flex;
  height:54px;
  border-bottom:1px solid #e2e8f0;
}

.item{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-right:1px solid #eee;
}

.label{
  font-size:12px;
  font-family:'Inter';
}

.status{
  font-family:'Oswald';
  font-size:20px;
}

/* ALERT BAR */
.alert-bar{
  display:flex;
  align-items:center;
  height:28px;
  padding:0 12px;
}

.alert-message{
  font-family:'Inter';
  font-size:12px;
}

.alert-time{
  margin-left:auto;
  font-size:11px;
  color:#666;
  font-family:'Inter';
}
</style>
</head>

<body>

<div class="container">

<!-- ✅ FORECAST PANEL -->
<div class="header-block">
  <img class="header-icon" src="icons/cloudy.png">
  <div class="header-temp">21°C</div>
  <div class="header-feels">Feels 21°C</div>
  <div class="header-cond">Overcast</div>
</div>

<div class="content">

<div class="bar">

  <div class="item">
    <div class="label">UV</div>
    <div class="status">5</div>
  </div>

  <div class="item">
    <div class="label">Wind</div>
    <div class="status">12</div>
  </div>

</div>

<div class="alert-bar">
  <div class="alert-message">No weather-related risks identified</div>
  <div class="alert-time">20 Jun, 11:16</div>
</div>

</div>

</div>

</body>
</html>
