<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Plan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  color: #17233a;
}

.priority-card {
  width: 587px;
  height: 295px;
  padding: 8px;
  overflow: hidden;
  background: #ffffff;
}

.update-header {
  font-size: 10px;
  font-weight: 400;
  color: #94a3b8;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e8edf3;
}

.priority-row {
  display: grid;
  grid-template-columns: 38px 70px 1fr;
  align-items: center;
  min-height: 46px;
  margin-top: 3px;
  padding: 5px 8px;
  border: 1px solid #e6ebf1;
  border-radius: 10px;
  background: #ffffff;
}

.priority-number {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: #2156b5;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}

.machine {
  font-size: 20px;
  font-weight: 700;
  color: #17233a;
}

.mixers {
  font-size: 16px;
  color: #64748b;
  line-height: 1.2;
}

</style>
</head>

<body>

<div class="priority-card">

  <div class="update-header">
    Updated: 27/08/2026 11:37:05
  </div>

  <div class="priority-row">
    <div class="priority-number">1</div>
    <div class="machine">001</div>
    <div class="mixers">HSD1, HSD2, LDT1, LDT2, LDT4</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">2</div>
    <div class="machine">012</div>
    <div class="mixers">MV1, MV5</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">3</div>
    <div class="machine">PF10</div>
    <div class="mixers">TMD500</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">4</div>
    <div class="machine">582</div>
    <div class="mixers">MV3, MV9</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">5</div>
    <div class="machine">576</div>
    <div class="mixers">MV3, MV9</div>
  </div>

</div>

</body>
</html>
