<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Plan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  color: #17233a;
}

.priority-card {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e5eaf1;
  border-radius: 22px;
  padding: 28px;
  box-shadow: 0 8px 30px rgba(20, 35, 60, 0.08);
}

.card-header {
  margin-bottom: 30px;
}

.card-title {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.card-subtitle {
  margin: 5px 0 0;
  color: #718096;
  font-size: 15px;
}

.column-headings {
  display: grid;
  grid-template-columns: 170px 260px 1fr;
  padding: 0 36px 16px;
  color: #64748b;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid #e8edf3;
}

.priority-row {
  display: grid;
  grid-template-columns: 170px 260px 1fr;
  align-items: center;
  min-height: 88px;
  margin-top: 14px;
  padding: 14px 36px;
  border: 1px solid #e6ebf1;
  border-radius: 18px;
  background: #ffffff;
  box-shadow: 0 3px 10px rgba(20, 35, 60, 0.04);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.priority-row:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(20, 35, 60, 0.08);
}

.priority-number {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: #2156b5;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
}

.machine {
  font-size: 23px;
  font-weight: 700;
  color: #17233a;
}

.mixers {
  font-size: 18px;
  color: #475569;
  line-height: 1.5;
}

@media (max-width: 700px) {

  body {
    padding: 15px;
  }

  .priority-card {
    padding: 20px;
  }

  .column-headings {
    display: none;
  }

  .priority-row {
    grid-template-columns: 65px 1fr;
    gap: 8px 15px;
    padding: 18px;
  }

  .mixers {
    grid-column: 2;
    font-size: 15px;
  }

  .machine {
    font-size: 20px;
  }

}

</style>
</head>

<body>

<div class="priority-card">

  <div class="card-header">
    <h2 class="card-title">Production Priorities</h2>
    <p class="card-subtitle">Current machine and mixer assignments</p>
  </div>

  <div class="column-headings">
    <div>Priority</div>
    <div>Machine</div>
    <div>Mixers</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">1</div>
    <div class="machine">012</div>
    <div class="mixers">MV5, MV2</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">2</div>
    <div class="machine">008</div>
    <div class="mixers">MV3</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">3</div>
    <div class="machine">-</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">4</div>
    <div class="machine">-</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">5</div>
    <div class="machine">-</div>
    <div class="mixers">-</div>
  </div>

</div>

</body>
</html>
