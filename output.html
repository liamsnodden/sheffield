<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Plan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  color: #17233a;
}

.priority-card {
  width: 587px;
  height: 295px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 20px;
  padding: 12px;
  overflow: hidden;
}

.update-header {
  font-size: 12px;
  font-weight: 400;
  color: #94a3b8;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #e8edf3;
}

.column-headings {
  display: grid;
  grid-template-columns: 50px 80px 1fr;
  padding: 0 8px 8px;
  color: #64748b;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  border-bottom: 1px solid #e8edf3;
}

.priority-row {
  display: grid;
  grid-template-columns: 50px 80px 1fr;
  align-items: center;
  min-height: 40px;
  margin-top: 5px;
  padding: 6px 8px;
  border: 1px solid #e6ebf1;
  border-radius: 10px;
  background: #ffffff;
}

.priority-number {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: #2156b5;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}

.machine {
  font-size: 14px;
  font-weight: 700;
  color: #17233a;
}

.mixers {
  font-size: 11px;
  color: #475569;
  line-height: 1.2;
}

</style>
</head>

<body>

<div class="priority-card">

  <div class="update-header">
    Updated: 27/08/2026 11:15:18
  </div>

  <div class="column-headings">
    <div>Pri</div>
    <div>Line</div>
    <div>Mixers</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">1</div>
    <div class="machine">001</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">2</div>
    <div class="machine">580</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">3</div>
    <div class="machine">012</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">4</div>
    <div class="machine">PF10</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">5</div>
    <div class="machine">-</div>
    <div class="mixers">-</div>
  </div>

</div>

</body>
</html>
