<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=587">

<style>

@font-face {
font-family: 'Inter';
src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
font-weight: 200 900;
}

* {
box-sizing: border-box;
}

body {
margin: 0;
padding: 0;
background: #ffffff;
font-family: 'Inter', Arial, sans-serif;
}

/* MAIN DISPLAY */

.priority-card {
width: 587px;
height: 295px;
padding: 8px;
overflow: hidden;
background: #ffffff;
}

/* EACH ROW */

.priority-row {
display: grid;
grid-template-columns: 82px 125px 1fr;
align-items: center;

height: 51px;
margin-bottom: 5px;

border-radius: 10px;
overflow: hidden;

background: #f3f6fa;
}

/* PRIORITY NUMBER */

.priority-number {
height: 100%;

display: flex;
align-items: center;
justify-content: center;

background: #087bea;
color: #ffffff;

font-size: 25px;
font-weight: 700;

position: relative;
}

/* ANGLED DETAIL ON BLUE NUMBER */

.priority-number::after {
content: "";
position: absolute;
right: -16px;
top: 0;

width: 28px;
height: 100%;

background: #0866c7;

transform: skewX(-20deg);
}

/* MACHINE NUMBER */

.machine {
padding-left: 22px;

font-size: 26px;
font-weight: 800;

color: #10213f;

white-space: nowrap;
}

/* DIVIDER */

.machine::after {
content: "";
display: inline-block;

height: 28px;
width: 1px;

background: #9db2cb;

margin-left: 22px;

vertical-align: middle;
}

/* MIXERS */

.mixers {
padding-left: 8px;
padding-right: 12px;

font-size: 15px;
font-weight: 500;

color: #14294a;

line-height: 1.1;
}

/* PRIORITY 1 */

.priority-row.priority-one {
background: #06479d;
}

.priority-one .priority-number {
background: #087bea;
}

.priority-one .priority-number::after {
background: #0756ae;
}

.priority-one .machine {
color: #ffffff;
}

.priority-one .machine::after {
background: rgba(255,255,255,0.65);
}

.priority-one .mixers {
color: #ffffff;
font-weight: 500;
}

</style>
</head>

<body>

<div class="priority-card">

<div class="priority-row priority-one">
<div class="priority-number">1</div>

<div class="machine">
001
</div>

<div class="mixers">
HSD1, HSD2, LDT1, LDT2, LDT3, LDT4
</div>
</div>


<div class="priority-row">
<div class="priority-number">2</div>

<div class="machine">
PF6
</div>

<div class="mixers">
N/A
</div>
</div>


<div class="priority-row">
<div class="priority-number">3</div>

<div class="machine">
PF10
</div>

<div class="mixers">
TMD500
</div>
</div>


<div class="priority-row">
<div class="priority-number">4</div>

<div class="machine">
580
</div>

<div class="mixers">
MV8
</div>
</div>


<div class="priority-row">
<div class="priority-number">5</div>

<div class="machine">
PF7
</div>

<div class="mixers">
TMD1300
</div>
</div>

</div>

</body>
</html>
