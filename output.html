<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=587">

<title>Production Plan</title>

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  ';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: 'Inter', sans-serif;
}

.priority-card {
  width: 587px;
  height: 295px;
  padding: 8px;
  overflow: hidden;
  background: #ffffff;
}

.update-header {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 400;
  color: #94a3b8;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid #e8edf3;
}

.priority-row {
  display: grid;
  grid-template-columns: 38px 70px 1fr;
  align-items: center;
  min-height: 46px;
  margin-top: 3px;
  padding: 5px 8px;
  border: 1px solid #e6ebf1;
  border-radius: 10px;
  background: #f7f7f7;
}

.priority-number {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: #1042b8;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
}

.machine {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  font-weight: 500;
  color: #17233a;
}

.mixers {
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 500;
  color: #64748b;
  line-height: 1.2;
}

</style>
</head>

<body>

<div class="priority-card">

  <div class="update-header">
    Updated: 27/08/2026 12:46:27
  </div>

  <div class="priority-row">
    <div class="priority-number">1</div>
    <div class="machine">001</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">2</div>
    <div class="machine">581</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">3</div>
    <div class="machine">012</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">4</div>
    <div class="machine">PF10</div>
    <div class="mixers">-</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">5</div>
    <div class="machine">580</div>
    <div class="mixers">-</div>
  </div>

</div>

</body>
</html>
