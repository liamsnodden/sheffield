<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Plan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  color: #17233a;
}

.priority-card {
  width: 400px;
  height: 400px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e5eaf1;
  border-radius: 20px;
  padding: 15px;
  overflow: hidden;
}

.column-headings {
  display: grid;
  grid-template-columns: 55px 90px 1fr;
  padding: 0 10px 10px;
  color: #64748b;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  border-bottom: 1px solid #e8edf3;
}

.priority-row {
  display: grid;
  grid-template-columns: 55px 90px 1fr;
  align-items: center;
  min-height: 58px;
  margin-top: 8px;
  padding: 8px 10px;
  border: 1px solid #e6ebf1;
  border-radius: 12px;
  background: #ffffff;
}

.priority-number {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #2156b5;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
}

.machine {
  font-size: 16px;
  font-weight: 700;
  color: #17233a;
}

.mixers {
  font-size: 12px;
  color: #475569;
  line-height: 1.3;
}

</style>
</head>

<body>

<div class="priority-card">

  <div class="column-headings">
    <div>Pri</div>
    <div>Line</div>
    <div>Mixers</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">1</div>
    <div class="machine">011</div>
    <div class="mixers">MV6</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">2</div>
    <div class="machine">580</div>
    <div class="mixers">MV2, MV3, MV4</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">3</div>
    <div class="machine">630</div>
    <div class="mixers">MV2, MV3, MV4</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">4</div>
    <div class="machine">PF10</div>
    <div class="mixers">TMD500</div>
  </div>

  <div class="priority-row">
    <div class="priority-number">5</div>
    <div class="machine">PF5</div>
    <div class="mixers">TMD1300</div>
  </div>

</div>

</body>
</html>
