<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=587">

<style>

/* ================================
FONT
================================ */

@font-face {
font-family: 'Inter';
src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf')
format('truetype');
font-weight: 200 900;
}


/* ================================
RESET
================================ */

* {
box-sizing: border-box;
}


/* ================================
PAGE
================================ */

html,
body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
background: #ffffff;
font-family: 'Inter', Arial, sans-serif;
}


/* ================================
PRIORITY CONTAINER
================================ */

.priority-card {
width: 587px;
height: 295px;

padding: 7px 8px;

overflow: hidden;

background: #ffffff;
}


/* ================================
PRIORITY ROW
================================ */

.priority-row {
width: 100%;
height: 51px;

display: grid;

grid-template-columns:
78px
122px
1px
1fr;

align-items: center;

margin-bottom: 5px;

border-radius: 9px;

background: #eef2f6;

overflow: hidden;
}


/* ================================
PRIORITY NUMBER
================================ */

.priority-number {
width: 56px;
height: 36px;

margin-left: 10px;

display: flex;
align-items: center;
justify-content: center;

border-radius: 7px;

background: #d9e5f3;

color: #124fa8;

font-size: 20px;
font-weight: 800;

line-height: 1;
}


/* ================================
MACHINE NUMBER
================================ */

.machine {
padding-left: 8px;

color: #102342;

font-size: 25px;
font-weight: 800;

line-height: 1;

white-space: nowrap;
}


/* ================================
DIVIDER
================================ */

.priority-divider {
width: 1px;
height: 27px;

background: #9aacc0;
}


/* ================================
MIXER INFORMATION
================================ */

.mixers {
padding-left: 25px;
padding-right: 12px;

color: #1c2e49;

font-size: 15px;
font-weight: 500;

line-height: 1.15;

white-space: nowrap;

overflow: hidden;
}


/* ================================
PRIORITY 1
================================ */

.priority-row.priority-one {
background: #064a9f;
}


/* Priority 1 number */

.priority-one .priority-number {
background: #087bea;

color: #ffffff;
}


/* Priority 1 machine */

.priority-one .machine {
color: #ffffff;
}


/* Priority 1 divider */

.priority-one .priority-divider {
background: rgba(255,255,255,0.65);
}


/* Priority 1 mixer */

.priority-one .mixers {
color: #ffffff;
}


/* ================================
LAST ROW
================================ */

.priority-row:last-child {
margin-bottom: 0;
}

</style>
</head>


<body>

<div class="priority-card">


<!-- ==========================
PRIORITY 1
=========================== -->

<div class="priority-row priority-one">

<div class="priority-number">
1
</div>

<div class="machine">
001
</div>

<div class="priority-divider"></div>

<div class="mixers">
HSD1, HSD2, LDT1, LDT2, LDT3, LDT4
</div>

</div>


<!-- ==========================
PRIORITY 2
=========================== -->

<div class="priority-row">

<div class="priority-number">
2
</div>

<div class="machine">
PF6
</div>

<div class="priority-divider"></div>

<div class="mixers">
N/A
</div>

</div>


<!-- ==========================
PRIORITY 3
=========================== -->

<div class="priority-row">

<div class="priority-number">
3
</div>

<div class="machine">
PF10
</div>

<div class="priority-divider"></div>

<div class="mixers">
TMD500
</div>

</div>


<!-- ==========================
PRIORITY 4
=========================== -->

<div class="priority-row">

<div class="priority-number">
4
</div>

<div class="machine">
580
</div>

<div class="priority-divider"></div>

<div class="mixers">
MV8
</div>

</div>


<!-- ==========================
PRIORITY 5
=========================== -->

<div class="priority-row">

<div class="priority-number">
5
</div>

<div class="machine">
PF7
</div>

<div class="priority-divider"></div>

<div class="mixers">
TMD1300
</div>

</div>


</div>

</body>
</html>
