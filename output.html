<!DOCTYPE html>
<html lang="en">
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=587">

<style>

/* ================================
FONT
================================ */

@font-face {
    font-family: 'Inter';
    src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf')
        format('truetype');
    font-weight: 200 900;
}


/* ================================
RESET
================================ */

* {
    box-sizing: border-box;
}


/* ================================
PAGE
================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #ffffff;

    font-family: 'Inter', Arial, sans-serif;
}


/* ================================
PRIORITY LIST
================================ */

.priority-list {
    width: 587px;

    padding: 5px 8px;

    background: #ffffff;

    overflow: hidden;
}


/* ================================
PRIORITY ROW
================================ */

.priority-row {
    width: 100%;
    height: 29px;

    display: grid;

    grid-template-columns:
        52px
        125px
        1fr;

    align-items: center;

    border-bottom: 1px solid #dce3eb;
}

.priority-row:last-child {
    border-bottom: none;
}


/* ================================
PRIORITY NUMBER
================================ */

.priority-number {
    color: #1971c9;

    font-size: 14px;
    font-weight: 800;

    line-height: 1;

    text-align: center;
}


/* ================================
MACHINE
================================ */

.machine {
    height: 18px;

    display: flex;
    align-items: center;

    padding-left: 18px;

    border-left: 1px solid #c9d3df;

    color: #102342;

    font-size: 19px;
    font-weight: 800;

    line-height: 1;

    white-space: nowrap;
}


/* ================================
MIXERS
================================ */

.mixers {
    padding-left: 20px;
    padding-right: 8px;

    color: #526378;

    font-size: 12px;
    font-weight: 500;

    line-height: 1;

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;
}

</style>

</head>


<body>

<div class="priority-list">


    <!-- PRIORITY 1 -->

    <div class="priority-row">

        <div class="priority-number">
            1
        </div>

        <div class="machine">
            001
        </div>

        <div class="mixers">
            HSD1, HSD2, LDT1, LDT2, LDT3, LDT4
        </div>

    </div>


    <!-- PRIORITY 2 -->

    <div class="priority-row">

        <div class="priority-number">
            2
        </div>

        <div class="machine">
            581
        </div>

        <div class="mixers">
            MV41, MV11, MV3
        </div>

    </div>


    <!-- PRIORITY 3 -->

    <div class="priority-row">

        <div class="priority-number">
            3
        </div>

        <div class="machine">
            580
        </div>

        <div class="mixers">
            MV2, MV3, MV4, MV8, MV9, MV10
        </div>

    </div>


    <!-- PRIORITY 4 -->

    <div class="priority-row">

        <div class="priority-number">
            4
        </div>

        <div class="machine">
            PF6
        </div>

        <div class="mixers">
            N/A
        </div>

    </div>


    <!-- PRIORITY 5 -->

    <div class="priority-row">

        <div class="priority-number">
            5
        </div>

        <div class="machine">
            PF4
        </div>

        <div class="mixers">
            Molteni
        </div>

    </div>


</div>

</body>

</html>
