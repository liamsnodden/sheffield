<div class="ticker">
<div class="symbol">NYSE: SHW</div>

<div class="row">
<span id="price">$---</span>
<span id="change" class="change">▲ --%</span>
</div>

<div id="time" class="time">As of --:-- ET</div>
</div>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
}

.ticker{
background:#004990;
color:white;
padding:20px 30px;
width:100%;
height:100%;
box-sizing:border-box;
}

.symbol{
font-size:42px;
font-weight:500;
margin-bottom:10px;
}

.row{
display:flex;
align-items:center;
gap:25px;
}

#price{
font-size:110px;
font-weight:700;
line-height:1;
}

.change{
font-size:72px;
font-weight:700;
color:#19c15f;
}

.time{
font-size:34px;
margin-top:15px;
}
</style>

<script>
fetch("https://query1.finance.yahoo.com/v8/finance/chart/SHW")
.then(r => r.json())
.then(data => {
const meta = data.chart.result[0].meta;

const price = meta.regularMarketPrice;
const prev = meta.previousClose;
const pct = ((price - prev) / prev * 100);

document.getElementById("price").textContent =
"$" + price.toFixed(2);

document.getElementById("change").textContent =
(pct >= 0 ? "▲ " : "▼ ") +
Math.abs(pct).toFixed(1) + "%";

document.getElementById("change").style.color =
pct >= 0 ? "#19c15f" : "#ff4d4d";

const now = new Date();
document.getElementById("time").textContent =
"As of " +
now.toLocaleTimeString("en-US", {
hour: "numeric",
minute: "2-digit"
}) +
" ET";
});
</script>
