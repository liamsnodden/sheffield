<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Widget + 3 Day Forecast</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
color:#fff;
}

#weatherSection{
display:flex;
align-items:flex-start;
width:500px;
height:120px;
}

#weather-icon{
width:85px;
height:85px;
flex-shrink:0;
}

#weatherText{
display:flex;
flex-direction:column;
justify-content:center;
margin-left:4px;
min-width:120px;
height:85px;
}

#weather-temp{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:42px;
font-weight:700;
line-height:1;
}

#weather-condition{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:15px;
font-weight:600;
line-height:1.1;
margin-top:2px;
}

#weather-feels{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:12px;
opacity:.9;
margin-top:2px;
}

#forecast{
display:flex;
align-items:center;
margin-left:12px;
margin-top:6px;
height:70px;
flex:1;
}

.forecastDay{
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;
height:70px;
min-width:65px;
padding:0 12px;
position:relative;
}

.forecastDay::before{
content:'';
position:absolute;
left:0;
top:8px;
bottom:8px;
width:1px;
background:rgba(255,255,255,.18);
}

.forecastName{
font-size:10px;
font-weight:700;
letter-spacing:.8px;
opacity:.8;
text-transform:uppercase;
height:12px;
display:flex;
align-items:center;
}

.forecastIcon{
width:42px;
height:42px;
display:block;
}

.forecastTemp{
font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
font-size:22px;
font-weight:700;
line-height:1;
height:22px;
display:flex;
align-items:center;
}

.forecastEnd{
width:1px;
height:70px;
background:rgba(255,255,255,.18);
}
</style>
</head>

<body>

<div id="weatherSection">

<img id="weather-icon"
src="https://openweathermap.org/img/wn/01d@4x.png"
alt="Weather">

<div id="weatherText">
<div id="weather-temp">--°C</div>
<div id="weather-condition">Loading...</div>
<div id="weather-feels">Feels like --°C</div>
</div>

<div id="forecast">

<div class="forecastDay">
<div class="forecastName" id="day1Name">---</div>
<img class="forecastIcon" id="day1Icon" alt="">
<div class="forecastTemp" id="day1Temp">--°</div>
</div>

<div class="forecastDay">
<div class="forecastName" id="day2Name">---</div>
<img class="forecastIcon" id="day2Icon" alt="">
<div class="forecastTemp" id="day2Temp">--°</div>
</div>

<div class="forecastDay">
<div class="forecastName" id="day3Name">---</div>
<img class="forecastIcon" id="day3Icon" alt="">
<div class="forecastTemp" id="day3Temp">--°</div>
</div>

<div class="forecastEnd"></div>

</div>

</div>

<script>

const WEATHER_URL =
'https://weather.liam-snodden.workers.dev';

const weatherDescriptions = {
0:"Clear",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Overcast",
45:"Fog",
48:"Fog",
51:"Light Drizzle",
53:"Drizzle",
55:"Heavy Drizzle",
61:"Light Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
73:"Snow",
75:"Heavy Snow",
80:"Rain Showers",
81:"Heavy Showers",
82:"Heavy Rain",
95:"Thunderstorm",
96:"Thunderstorm",
99:"Thunderstorm"
};

async function updateWeather(){

try{

document.getElementById('weather-condition').textContent =
'Connecting...';

const response = await fetch(WEATHER_URL);

document.getElementById('weather-condition').textContent =
'Connected';

const data = await response.json();

document.getElementById('weather-condition').textContent =
'JSON OK';

document.getElementById('weather-temp').textContent =
Math.round(data.current.temperature_2m) + '°C';

document.getElementById('weather-condition').textContent =
weatherDescriptions[data.current.weather_code] || 'Unknown';

document.getElementById('weather-feels').textContent =
'Feels like ' +
Math.round(data.current.apparent_temperature) +
'°C';

}catch(error){

document.getElementById('weather-temp').textContent =
'ERROR';

document.getElementById('weather-condition').textContent =
error.message;

document.getElementById('weather-feels').textContent =
WEATHER_URL;

console.error(error);

}

}

updateWeather();

</script>

</body>
</html>
