<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Test</title>
<style>
body{
background:#111;
color:white;
font-family:Arial;
padding:40px;
}
</style>
</head>
<body>

<h1>Sheffield Weather</h1>

<div id="weather">Loading...</div>

<script>

const weatherUrl =
"https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe%2FLondon";

fetch(weatherUrl)
.then(r => r.json())
.then(data => {

document.getElementById("weather").innerHTML = `
Temperature: ${data.current.temperature_2m}°C<br>
Wind: ${data.current.wind_speed_10m} km/h<br>
Weather Code: ${data.current.weather_code}
`;

})
.catch(err => {

document.getElementById("weather").innerHTML =
"FAILED: " + err;

});

</script>

</body>
</html>
