<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather + Clock Widget</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
color:#fff;
}

#widget{
width:100%;
height:120px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 3px;
}

/* WEATHER */

#weatherSection{
display:flex;
align-items:center;
}

#weather-icon{
width:100px;
height:100px;
flex-shrink:0;
}

#weatherText{
display:flex;
flex-direction:column;
margin-left:4px;
}

#weather-temp{
font-size:44px;
font-weight:700;
line-height:1;
}

#weather-condition{
font-size:16px;
font-weight:600;
line-height:1.1;
}

#weather-feels{
font-size:12px;
opacity:.9;
margin-top:2px;
}

/* RIGHT SIDE */

#rightSection{
display:flex;
flex-direction:column;
align-items:flex-end;
justify-content:center;
text-align:right;
min-width:300px;
}

#date{
font-size:16px;
font-weight:600;
}

#time{
font-size:38px;
font-weight:700;
line-height:1;
margin-top:2px;
}

#worldClock{
display:flex;
justify-content:flex-end;
align-items:center;
gap:2px;
margin-top:6px;
font-size:12px;
font-weight:600;
}

#worldFlag{
width:20px;
height:14px;
object-fit:cover;
border-radius:2px;
}

#worldStatus{
width:8px;
height:8px;
border-radius:50%;
display:inline-block;
}

.day{
background:#22c55e;
}

.evening{
background:#f59e0b;
}

.night{
background:#6b7280;
}
</style>
</head>

<body>

<div id="widget">

<div id="weatherSection">

<img id="weather-icon"
src="https://openweathermap.org/img/wn/01d@4x.png"
alt="Weather">

<div id="weatherText">

<div id="weather-temp">--°C</div>

<div id="weather-condition">Loading...</div>

<div id="weather-feels">Feels like --°C</div>

</div>

</div>

<div id="rightSection">

<div id="date"></div>

<div id="time"></div>

<div id="worldClock">

<span id="worldTime"></span>

<span id="worldStatus"></span>

<span id="worldLocation"></span>

<img id="worldFlag" alt="Flag">

</div>

</div>

</div>

<script>

/* WEATHER */

const LATITUDE = 53.3811;
const LONGITUDE = -1.4701;

const weatherDescriptions = {
0:"Clear",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Overcast",
45:"Fog",
48:"Fog",
51:"Light Drizzle",
53:"Drizzle",
55:"Heavy Drizzle",
61:"Light Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
73:"Snow",
75:"Heavy Snow",
80:"Rain Showers",
81:"Heavy Showers",
82:"Heavy Rain",
95:"Thunderstorm",
96:"Thunderstorm",
99:"Thunderstorm"
};

const iconMap = {
0:"01d",
1:"02d",
2:"03d",
3:"04d",
45:"50d",
48:"50d",
51:"09d",
53:"09d",
55:"09d",
61:"10d",
63:"10d",
65:"10d",
71:"13d",
73:"13d",
75:"13d",
80:"09d",
81:"09d",
82:"09d",
95:"11d",
96:"11d",
99:"11d"
};

async function updateWeather(){

try{

const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,apparent_temperature,weather_code`
);

const data = await response.json();

const code = data.current.weather_code;

document.getElementById('weather-temp').textContent =
Math.round(data.current.temperature_2m) + '°C';

document.getElementById('weather-condition').textContent =
weatherDescriptions[code] || 'Unknown';

document.getElementById('weather-feels').textContent =
'Feels like ' +
Math.round(data.current.apparent_temperature) +
'°C';

document.getElementById('weather-icon').src =
`https://openweathermap.org/img/wn/${iconMap[code] || '04d'}@4x.png`;

}catch(error){

document.getElementById('weather-condition').textContent =
'Weather unavailable';

document.getElementById('weather-feels').textContent = '';

console.error(error);

}

}

updateWeather();
setInterval(updateWeather,600000);

/* DATE & TIME */

function updateDateTime(){

const now = new Date();

const date = now.toLocaleDateString('en-US',{
month:'long',
day:'numeric',
year:'numeric'
});

const time = now.toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

document.getElementById('date').textContent = date;
document.getElementById('time').textContent = time;

}

updateDateTime();
setInterval(updateDateTime,1000);

/* WORLD CLOCK */

const sites = [
{
city:"Cleveland HQ",
flag:"us",
timezone:"America/New_York"
},
{
city:"Brodziszewo",
flag:"pl",
timezone:"Europe/Warsaw"
},
{
city:"Bangalore",
flag:"in",
timezone:"Asia/Kolkata"
},
{
city:"Ho Chi Minh City",
flag:"vn",
timezone:"Asia/Ho_Chi_Minh"
}
];

let currentSite = 0;

function getStatus(timezone){

const hour = parseInt(
new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
hour12:false,
timeZone:timezone
}
).format(new Date())
);

if(hour >= 7 && hour < 18) return 'day';
if(hour >= 18 && hour < 22) return 'evening';
return 'night';

}

function updateWorldClock(){

const site = sites[currentSite];

document.getElementById('worldFlag').src =
`https://flagcdn.com/w40/${site.flag}.png`;

document.getElementById('worldLocation').textContent =
site.city;

document.getElementById('worldTime').textContent =
new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
minute:'2-digit',
hour12:false,
timeZone:site.timezone
}
).format(new Date());

const status =
document.getElementById('worldStatus');

status.className = '';
status.id = 'worldStatus';
status.classList.add(getStatus(site.timezone));

currentSite++;
if(currentSite >= sites.length){
currentSite = 0;
}

}

updateWorldClock();
setInterval(updateWorldClock,10000);

</script>

</body>
</html>
