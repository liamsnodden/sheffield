<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheffield Traffic Incidents</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f4f4f4;
margin:20px;
}

h1{
margin-bottom:10px;
}

#status{
color:#666;
margin-bottom:15px;
}

.incident{
background:white;
padding:12px;
margin-bottom:10px;
border-left:5px solid #e67e22;
border-radius:4px;
box-shadow:0 1px 3px rgba(0,0,0,.1);
}

.road{
font-weight:bold;
font-size:16px;
}

.type{
color:#c0392b;
}

.time{
color:#666;
font-size:13px;
}
</style>
</head>
<body>

<h1>Sheffield Traffic Incidents</h1>
<div id="status">Loading...</div>
<div id="incidents"></div>

<script>

const apiKey = "N61XFRwHAscPzxZI6ci39stZrnzoc4qS";

/*
Bounding box around Sheffield

West,South,East,North
-1.75,53.30,-1.20,53.50
*/

const bbox = "-1.75,53.30,-1.20,53.50";

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&fields={incidents{type,geometry{type,coordinates},properties{iconCategory,events{description},from,to,startTime,endTime,length}}}&language=en-GB&key=${apiKey}`;

async function loadIncidents(){

const status = document.getElementById("status");
const container = document.getElementById("incidents");

try{

const response = await fetch(url);
const data = await response.json();

container.innerHTML = "";

const incidents = data.incidents || [];

status.textContent =
`${incidents.length} incidents found`;

if(incidents.length === 0){
container.innerHTML =
"<div class='incident'>No incidents reported.</div>";
return;
}

incidents.forEach(incident => {

const p = incident.properties || {};

let description = "Traffic Incident";

if(p.events &&
p.events.length &&
p.events[0].description){
description =
p.events[0].description;
}

const div = document.createElement("div");
div.className = "incident";

div.innerHTML = `
<div class="road">${p.from || "Unknown Road"}</div>
<div class="type">${description}</div>
<div>To: ${p.to || "-"}</div>
<div>Length: ${p.length || 0} m</div>
<div class="time">
Started:
${p.startTime
? new Date(p.startTime).toLocaleString()
: "Unknown"}
</div>
`;

container.appendChild(div);
});

} catch(err){

status.textContent =
"Error loading TomTom data";

console.error(err);
}
}

loadIncidents();

/* Refresh every 60 seconds */
setInterval(loadIncidents, 60000);

</script>

</body>
</html>
