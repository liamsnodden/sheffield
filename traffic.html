<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450">

<title>Road Status</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

html,body{
width:450px;
height:320px;
overflow:hidden;


}

/* HEADER */

.header{
height:52px;

display:flex;
align-items:center;

padding:0 12px;
}

.header-accent{
width:4px;
height:24px;

background:#D22630;

border-radius:2px;

margin-right:10px;

flex-shrink:0;
}

.header-title{
font-family:"Arial Narrow",Arial,sans-serif;
font-size:20px;
font-weight:700;

color:#fff;

line-height:1;
}

.header-line{
flex:1;

height:1px;

margin-left:12px;

background:linear-gradient(
to right,
rgba(255,255,255,.18),
rgba(255,255,255,.03)
);
}

/* WIDGET */

#widget{
width:450px;
height:268px;

color:#fff;

overflow:hidden;
}

#content{
height:268px;

padding:4px 12px 0 12px;
}

/* ROWS */

.row{
height:34px;

display:flex;
align-items:center;

gap:10px;

padding:0 4px;
}

/* DOTS */

.dot{
width:10px;
height:10px;

border-radius:50%;

flex-shrink:0;
}

.dot.red{
background:#ff5a5f;
}

.dot.amber{
background:#f5a623;
}

.dot.yellow{
background:#fadb14;
}

.dot.green{
background:#67c23a;
}

/* ROAD */

.road{
width:155px;

font-family:"Arial Narrow",Arial,sans-serif;
font-size:16px;
font-weight:700;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

color:#fff;
}

/* STATUS */

.status{
flex:1;

font-size:14px;

color:rgba(255,255,255,.82);
}

/* DELAY */

.delay{
width:65px;

text-align:right;

font-size:14px;
font-weight:700;
}

/* DELAY COLOURS */

.red-text{
color:#ff5a5f;
}

.amber-text{
color:#f5a623;
}

.yellow-text{
color:#fadb14;
}

.green-text{
color:#67c23a;
}

</style>
</head>

<body>

<div class="header">

<div class="header-accent"></div>

<div class="header-title">
Road Status
</div>

<div class="header-line"></div>

</div>

<div id="widget">
<div id="content"></div>
</div>

<script>

const apiKey="N61XFRwHAscPzxZI6ci39stZrnzoc4qS";

const bbox="-1.60,53.32,-1.34,53.45";

const monitoredRoads=[
"M1_N",
"M1_S",
"M18",
"A57",
"A61",
"A616",
"A630"
];

const roadNames={
"M1_N":"M1 Northbound",
"M1_S":"M1 Southbound",
"M18":"M18",
"A57":"A57 Worksop",
"A61":"A61 Barnsley",
"A616":"Stocksbridge Bypass",
"A630":"Sheffield Parkway"
};

const trafficUrl=
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=en-GB&fields={incidents{properties{roadNumbers,delay,events{description}}}}&key=${apiKey}`;

function getColour(delay){

if(delay>=15) return "red";
if(delay>=5) return "amber";
if(delay>0) return "yellow";

return "green";
}

function getStatus(delay){

if(delay>=15) return "Severe Delays";
if(delay>=5) return "Delays";
if(delay>0) return "Minor Delays";

return "Clear";
}

function getRank(status){

switch(status){

case "Severe Delays":
return 4;

case "Delays":
return 3;

case "Minor Delays":
return 2;

default:
return 1;
}
}

async function loadTraffic(){

try{

const response=await fetch(trafficUrl);
const data=await response.json();

const rows=[];

monitoredRoads.forEach(road=>{

let incidents=(data.incidents||[]).filter(i=>{

const roads=i.properties?.roadNumbers||[];
const text=JSON.stringify(i).toLowerCase();

if(road==="M1_N"){
return roads.some(r=>String(r).toUpperCase()==="M1")
&& text.includes("northbound");
}

if(road==="M1_S"){
return roads.some(r=>String(r).toUpperCase()==="M1")
&& text.includes("southbound");
}

return roads.some(r=>String(r).toUpperCase()===road);

});

let totalDelay=0;

incidents.forEach(i=>{

totalDelay += i.properties?.delay
? Math.round(i.properties.delay/60)
: 0;

});

rows.push({
road:roadNames[road],
delay:totalDelay,
status:getStatus(totalDelay),
colour:getColour(totalDelay)
});

});

rows.sort((a,b)=>{

const rankDiff=
getRank(b.status)-getRank(a.status);

if(rankDiff!==0){
return rankDiff;
}

return b.delay-a.delay;

});

render(rows);

}
catch(error){

console.error(error);

}
}

function render(rows){

document.getElementById("content").innerHTML=

rows.map(item=>`

<div class="row">

<div class="dot ${item.colour}"></div>

<div class="road">
${item.road}
</div>

<div class="status">
${item.status}
</div>

<div class="delay ${item.colour}-text">
${
item.delay > 0
? item.delay + " min" + (item.delay===1 ? "" : "s")
: ""
}
</div>

</div>

`).join("");

}

loadTraffic();

setInterval(loadTraffic,60000);

</script>

</body>
</html>
