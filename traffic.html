
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://cdn.jsdelivr.net/gh/liamsnodden/sheffield@main/inter.ttf') format('truetype');
  font-display: swap;
}

*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:#fff;
  padding:10px;
  margin:0;
}

table{
  width:430px;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

th{
  border-bottom:2px solid #ddd;
  font-weight:700;
}

.sign{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  height:32px;
  padding:0 10px;
  color:#fff;
  font-weight:700;
  border-radius:5px;
}

.motorway{
  background:#0057B8;
}

.aroad{
  background:#0B8F3C;
}

.red{
  color:#d32f2f;
}

.orange{
  color:#ef6c00;
}

.yellow{
  color:#c49000;
}

.green{
  color:#2e7d32;
}

.status,
.delay{
  font-weight:700;
}

.delay{
  text-align:right;
}

</style>
</head>

<body>

<table>

<thead>
<tr>
<th>ROAD</th>
<th>NAME</th>
<th>STATUS</th>
<th style="text-align:right">DELAY</th>
</tr>
</thead>

<tbody>

<tr>
<td>
<span class="sign aroad">
A61
</span>
</td>

<td>Barnsley Rd</td>

<td class="red status">
Severe delays
</td>

<td class="red delay">
15 mins
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A57
</span>
</td>

<td>Worksop Rd</td>

<td class="yellow status">
Minor delays
</td>

<td class="yellow delay">
1 min
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M1
</span>
</td>

<td>Northbound</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M1
</span>
</td>

<td>Southbound</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M18
</span>
</td>

<td>Doncaster</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A630
</span>
</td>

<td>Parkway</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A616
</span>
</td>

<td>Stocksbridge</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

</tbody>

</table>

</body>
</html>
