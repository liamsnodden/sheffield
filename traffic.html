<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheffield Major Road Incidents</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f4f4f4;
margin:20px;
}

h1{
margin:0 0 15px 0;
}

#status{
margin-bottom:15px;
color:#666;
}

.incident{
background:#fff;
border-left:6px solid #ff9800;
padding:12px;
margin-bottom:10px;
border-radius:4px;
box-shadow:0 1px 3px rgba(0,0,0,.15);
}

.road{
font-size:18px;
font-weight:bold;
margin-bottom:5px;
}

.desc{
color:#d32f2f;
font-weight:bold;
margin-bottom:5px;
}

.details{
color:#555;
font-size:14px;
}

.noIncidents{
background:#fff;
padding:15px;
border-left:6px solid #4caf50;
border-radius:4px;
}
</style>
</head>
<body>

<h1>Sheffield Major Road Incidents</h1>

<div id="status">Loading...</div>
<div id="incidents"></div>

<script>

const apiKey = "YOUR_TOMTOM_API_KEY";

/*
Sheffield-focused area

West,South,East,North
*/
const bbox = "-1.60,53.32,-1.34,53.45";

const majorRoads = [
"M1",
"A57",
"A61",
"A616",
"A630"
];

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&fields={incidents{type,properties{from,to,length,startTime,endTime,events{description}}}}&language=en-GB&key=${apiKey}`;

async function loadIncidents(){

const status = document.getElementById("status");
const container = document.getElementById("incidents");

try{

const response = await fetch(url);
const data = await response.json();

const allIncidents = data.incidents || [];

const incidents = allIncidents.filter(incident => {

const p = incident.properties || {};

const text = `
${p.from || ""}
${p.to || ""}
${(p.events || [])
.map(e => e.description || "")
.join(" ")}
`.toUpperCase();

return majorRoads.some(road =>
text.includes(road.toUpperCase())
);

});

status.innerHTML =
`Last updated: ${new Date().toLocaleTimeString()} | ${incidents.length} major-road incidents`;

container.innerHTML = "";

if(incidents.length === 0){

container.innerHTML = `
<div class="noIncidents">
No incidents currently affecting the main Sheffield routes.
</div>
`;

return;
}

incidents.forEach(incident => {

const p = incident.properties || {};

const description =
p.events?.[0]?.description ||
"Traffic Incident";

const div = document.createElement("div");

div.className = "incident";

div.innerHTML = `
<div class="road">
${p.from || "Major Route"}
</div>

<div class="desc">
${description}
</div>

<div class="details">
To: ${p.to || "-"}<br>
Length: ${(p.length || 0).toLocaleString()} m
</div>
`;

container.appendChild(div);

});

}
catch(error){

console.error(error);

status.innerHTML =
"Unable to load TomTom traffic data.";

}
}

loadIncidents();

setInterval(loadIncidents, 60000);

</script>

</body>
</html>
