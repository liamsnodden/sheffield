<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sheffield Traffic Updates</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

.container{
width:100%;
height:100%;
padding:25px 35px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:42px;
font-weight:700;
color:#111;
}

.updated{
font-size:18px;
color:#666;
}

.feed{
overflow:auto;
height:calc(100% - 80px);
}

.item{
display:flex;
gap:18px;
padding:18px 0;
border-bottom:1px solid #ececec;
}

.dot{
width:28px;
height:28px;
border-radius:50%;
flex-shrink:0;
margin-top:4px;
}

.red{
background:#ff3b30;
}

.orange{
background:#ff9500;
}

.green{
background:#34c759;
}

.content{
flex:1;
}

.headline{
font-size:24px;
font-weight:700;
color:#111;
}

.desc{
font-size:18px;
color:#666;
margin-top:4px;
line-height:1.4;
}

</style>
</head>
<body>

<div class="container">

<div class="header">
<div class="title">SHEFFIELD TRAFFIC UPDATES</div>
<div class="updated" id="updated">Loading...</div>
</div>

<div id="feed" class="feed">
Loading live traffic...
</div>

</div>

<script>

/*
CURRENT INCIDENTS FEED
*/

const RSS_URL =
'https://www.trafficengland.com/rss/feeds/currentincidents';

const API =
'https://api.rss2json.com/v1/api.json?rss_url=' +
encodeURIComponent(RSS_URL);

function getSeverity(text){

text = text.toLowerCase();

if(
text.includes('closed') ||
text.includes('closure') ||
text.includes('collision') ||
text.includes('accident')
){
return 'red';
}

if(
text.includes('delay') ||
text.includes('congestion') ||
text.includes('roadworks')
){
return 'orange';
}

return 'green';
}

async function loadTraffic(){

try{

const response = await fetch(API);
const data = await response.json();

console.log(data);

let incidents = data.items.filter(item=>{

const text =
(item.title + " " + item.description).toLowerCase();

return (
text.includes("m1") ||
text.includes("a57") ||
text.includes("a61") ||
text.includes("sheffield") ||
text.includes("rotherham") ||
text.includes("barnsley")
);

});

if(incidents.length === 0){
incidents = data.items.slice(0,6);
}

document.getElementById("feed").innerHTML =
incidents.slice(0,6).map(item=>`

<div class="item">

<div class="dot ${getSeverity(item.title)}"></div>

<div class="content">

<div class="headline">
${item.title}
</div>

<div class="desc">
${item.description
.replace(/<[^>]+>/g,'')
.substring(0,150)}
</div>

</div>

</div>

`).join("");

document.getElementById("updated").innerHTML =
"Updated " +
new Date().toLocaleTimeString("en-GB",{
hour:"2-digit",
minute:"2-digit"
});

}
catch(error){

console.error(error);

document.getElementById("feed").innerHTML =
`
<div style="font-size:20px;color:red">
Unable to load traffic data.<br><br>
Check browser console (F12) for details.
</div>
`;
}
}

loadTraffic();

setInterval(loadTraffic,60000);

</script>

</body>
</html>
