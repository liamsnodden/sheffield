<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheffield Traffic News</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:transparent;
font-family:Arial,sans-serif;
}

#traffic-container{
width:100%;
height:100%;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
}

.news-item{
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,0.15);
}

.news-item:last-child{
border-bottom:none;
}

.news-title{
font-size:22px;
font-weight:700;
color:#ffffff;
line-height:1.3;
}

.news-date{
margin-top:4px;
font-size:14px;
color:rgba(255,255,255,0.6);
}

.status{
color:#ffffff;
font-size:18px;
}
</style>
</head>
<body>

<div id="traffic-container">
<div class="status">Loading Sheffield traffic updates...</div>
</div>

<script>

const RSS_URL =
'https://feeds.bbci.co.uk/news/england/south_yorkshire/rss.xml';

const API_URL =
'https://api.rss2json.com/v1/api.json?rss_url=' +
encodeURIComponent(RSS_URL);

async function loadTrafficNews() {

try {

const response = await fetch(API_URL);
const data = await response.json();

const container =
document.getElementById('traffic-container');

const trafficItems = data.items
.filter(item =>
item.title.toLowerCase().includes('road') ||
item.title.toLowerCase().includes('traffic') ||
item.title.toLowerCase().includes('closure') ||
item.title.toLowerCase().includes('motorway') ||
item.title.toLowerCase().includes('m1')
)
.slice(0,5);

if(!trafficItems.length){
container.innerHTML =
'<div class="status">No current Sheffield traffic incidents found.</div>';
return;
}

container.innerHTML = trafficItems.map(item => `
<div class="news-item">
<div class="news-title">${item.title}</div>
<div class="news-date">
${new Date(item.pubDate).toLocaleString('en-GB')}
</div>
</div>
`).join('');

} catch(error){

document.getElementById('traffic-container').innerHTML =
'<div class="status">Unable to load traffic data.</div>';

console.error(error);
}
}

loadTrafficNews();

/* Refresh every 5 minutes */
setInterval(loadTrafficNews, 300000);

</script>

</body>
</html>
