
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}


body{
  width:586px;
  padding:10px;
  margin:0;
  background:#fff;
}

table{
  width:586px;
  border-collapse:separate;
  border-spacing:0 4px;
}

tr{
  background:#f7f7f7;
}

td{
  padding:4px 10px;
  height:30px;
  font-size:14px;
  color:#1c2740;
  border-top:1px solid #e8e8e8;
  border-bottom:1px solid #e8e8e8;
}

td:first-child{
  border-left:1px solid #e8e8e8;
  border-radius:8px 0 0 8px;
}

td:last-child{
  border-right:1px solid #e8e8e8;
  border-radius:0 8px 8px 0;
}

.road-col{
  width:72px;
}

.name-col{
  width:260px;
}

.status-col{
  width:160px;
  font-family:'Inter',sans-serif;
  font-weight:500;
  white-space:nowrap;
}

.delay-pill{
  width:90px;
  text-align:center;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-weight:700;
}

.sign{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:52px;
  height:24px;
  color:#fff;
  font-weight:700;
  border-radius:5px;
  font-size:14px;
}

.motorway{
  background:#1042b8;
}

.aroad{
  background:#17933d;
}

.icon{
  margin-right:8px;
}

.red{
  color:#f15a24;
}

.orange{
  color:#f29b13;
}

.yellow{
  color:#dba300;
}

.green{
  color:#138f42;
}

.red.delay-pill{
  background:#fff0e8;
}

.orange.delay-pill{
  background:#fff4e8;
}

.yellow.delay-pill{
  background:#fff8e7;
}

.green.delay-pill{
  background:#edf7ed;
}


body {
  font-family: 'Inter', sans-serif;
}

th,
.status,
.delay {
  font-family: 'Inter Bold', sans-serif;
}


</style>
</head>

<body>

<table>


<tbody>

<tr class="row">

  <td class="road-col">
    <span class="sign aroad">
      A616
    </span>
  </td>

  <td class="name-col">
    Stocksbridge
  </td>

  <td class="status-col yellow">
    <span class="icon">🚗</span>
    Minor delays
  </td>

  <td class="delay-pill yellow">
    3 mins
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign aroad">
      A61
    </span>
  </td>

  <td class="name-col">
    Barnsley Rd
  </td>

  <td class="status-col yellow">
    <span class="icon">🚗</span>
    Minor delays
  </td>

  <td class="delay-pill yellow">
    2 mins
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign aroad">
      A57
    </span>
  </td>

  <td class="name-col">
    Worksop Rd
  </td>

  <td class="status-col yellow">
    <span class="icon">🚗</span>
    Minor delays
  </td>

  <td class="delay-pill yellow">
    1 min
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign motorway">
      M1
    </span>
  </td>

  <td class="name-col">
    Northbound
  </td>

  <td class="status-col green">
    <span class="icon">✓</span>
    Clear
  </td>

  <td class="delay-pill green">
    –
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign motorway">
      M1
    </span>
  </td>

  <td class="name-col">
    Southbound
  </td>

  <td class="status-col green">
    <span class="icon">✓</span>
    Clear
  </td>

  <td class="delay-pill green">
    –
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign motorway">
      M18
    </span>
  </td>

  <td class="name-col">
    Doncaster
  </td>

  <td class="status-col green">
    <span class="icon">✓</span>
    Clear
  </td>

  <td class="delay-pill green">
    –
  </td>

</tr>

<tr class="row">

  <td class="road-col">
    <span class="sign aroad">
      A630
    </span>
  </td>

  <td class="name-col">
    Parkway
  </td>

  <td class="status-col green">
    <span class="icon">✓</span>
    Clear
  </td>

  <td class="delay-pill green">
    –
  </td>

</tr>

</tbody>

</table>

</body>
</html>
