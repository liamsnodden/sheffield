<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheffield Major Road Traffic</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:20px;
}

h1{
margin:0 0 15px;
}

#status{
color:#666;
margin-bottom:15px;
}

.incident{
background:#fff;
border-left:6px solid #ff9800;
padding:12px;
margin-bottom:10px;
border-radius:4px;
box-shadow:0 1px 3px rgba(0,0,0,.15);
}

.road{
font-size:18px;
font-weight:bold;
}

.desc{
margin:6px 0;
color:#d32f2f;
font-weight:bold;
}

.details{
color:#555;
font-size:14px;
line-height:1.5;
}

.good{
border-left-color:#4caf50;
}
</style>
</head>
<body>

<h1>Major Sheffield Routes</h1>

<div id="status">Loading...</div>
<div id="incidents"></div>

<script>

const apiKey = "YOUR_TOMTOM_API_KEY";

const bbox = "-1.60,53.32,-1.34,53.45";

const majorRoads = [
"M1",
"A57",
"A61",
"A616",
"A630"
];

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=en-GB&fields={incidents{properties{roadNumbers,from,to,length,delay,events{description}}}}&key=${apiKey}`;

async function loadTraffic() {

const status = document.getElementById("status");
const container = document.getElementById("incidents");

try {

const response = await fetch(url);
const data = await response.json();

const incidents = (data.incidents || []).filter(i => {

const roads = i.properties?.roadNumbers || [];

return roads.some(r =>
majorRoads.includes(
String(r).toUpperCase()
)
);

});

container.innerHTML = "";

status.textContent =
`${incidents.length} incidents • Updated ${new Date().toLocaleTimeString()}`;

if (incidents.length === 0) {

container.innerHTML = `
<div class="incident good">
No incidents affecting M1, A57, A61, A616 or A630.
</div>
`;

return;
}

incidents.forEach(i => {

const p = i.properties || {};

const roads =
(p.roadNumbers || []).join(", ");

const description =
p.events?.[0]?.description ||
"Traffic incident";

const delay =
p.delay
? Math.round(p.delay / 60)
: null;

const div = document.createElement("div");

div.className = "incident";

div.innerHTML = `
<div class="road">${roads}</div>

<div class="desc">
${description}
</div>

<div class="details">
From: ${p.from || "-"}<br>
To: ${p.to || "-"}<br>
Queue Length: ${((p.length || 0)/1000).toFixed(1)} km<br>
Delay: ${delay !== null ? delay + " mins" : "Not supplied by TomTom"}
</div>
`;

container.appendChild(div);

});

}
catch(err){

console.error(err);

status.textContent =
"Unable to load traffic data.";

}

}

loadTraffic();
setInterval(loadTraffic,60000);

</script>

</body>
</html>
