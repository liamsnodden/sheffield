
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}


body{
  width:586px;
  padding:10px;
  margin:0;
  background:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
}



th,
td{
  font-family:'Inter',sans-serif;
  padding:5px 8px;
  font-size:13px;
  line-height:1.1;
}

.sign{
  height:22px;
  min-width:54px;
  font-size:12px;
}


.sign{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  height:32px;
  padding:0 10px;
  color:#fff;
  font-weight:700;
  border-radius:5px;
}



.delay{
  font-family:'Inter',sans-serif;
  font-weight:700;
  text-align:right;
}



.motorway{
  background:#0057B8;
}

.aroad{
  background:#0B8F3C;
}

.red{
  color:#d32f2f;
}

.orange{
  color:#ef6c00;
}

.yellow{
  color:#c49000;
}

.green{
  color:#2e7d32;
}

.status,
.delay{
  font-weight:700;
}

.delay{
  text-align:right;
}


body {
  font-family: 'Inter', sans-serif;
}

th,
.status,
.delay {
  font-family: 'Inter Bold', sans-serif;
}


</style>
</head>

<body>

<table>


<tbody>

<tr>
<td>
<span class="sign aroad">
A616
</span>
</td>

<td>Stocksbridge</td>

<td class="yellow status">
Minor delays
</td>

<td class="yellow delay">
4 mins
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A61
</span>
</td>

<td>Barnsley Rd</td>

<td class="yellow status">
Minor delays
</td>

<td class="yellow delay">
4 mins
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M1
</span>
</td>

<td>Northbound</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M1
</span>
</td>

<td>Southbound</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign motorway">
M18
</span>
</td>

<td>Doncaster</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A630
</span>
</td>

<td>Parkway</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

<tr>
<td>
<span class="sign aroad">
A57
</span>
</td>

<td>Worksop Rd</td>

<td class="green status">
Clear
</td>

<td class="green delay">
—
</td>
</tr>

</tbody>

</table>

</body>
</html>
