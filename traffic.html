
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=470">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}


body{
  width:586px;
  padding:10px;
  margin:0;
  background:#fff;
}

table{
  width:560px;
  border-collapse:separate;
  border-spacing:0 4px;
}

tr{
  background:#f7f7f7;
}


td{
  padding:4px 10px;
  height:30px;
  font-size:14px;
  color:#1c2740;
  background:#f7f7f7;
}


td:first-child{
  border-left:1px solid #e8e8e8;
  border-radius:8px 0 0 8px;
}

td:last-child{
  border-right:1px solid #e8e8e8;
  border-radius:0 8px 8px 0;
}

.road-col{
  width:72px;
}

.name-col{
  width:230px;
}


.status-text{
  margin-left:4px;
}



.status-col{
  display:flex;
  align-items:center;
  gap:10px !important;
  width:160px;
  font-family:'Inter',sans-serif;
  font-weight:500;
  white-space:nowrap;
}



.status-icon{
  width:18px;
  height:18px;
  display:inline-block;
  flex-shrink:0;
}


.status-icon svg{
  width:18px;
  height:18px;
}

.green-icon{
  color:#138f42;
}

.yellow-icon{
  color:#dba300;
}

.orange-icon{
  color:#f29b13;
}

.red-icon{
  color:#f15a24;
}

.green-icon svg *,
.yellow-icon svg *,
.orange-icon svg *,
.red-icon svg *{
  fill:currentColor !important;
  stroke:currentColor !important;
}

.status-icon{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}


.delay-pill{
  width:90px;
  text-align:center;
  border-radius:999px;
  font-family:'Inter',sans-serif;
  font-weight:700;
}

.sign{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:52px;
  height:24px;
  color:#fff;
  font-weight:700;
  border-radius:5px;
  font-size:14px;
}

.status-icon{
  display:inline-flex;
  width:18px;
  height:18px;
  flex-shrink:0;
}

.status-icon svg{
  width:18px;
  height:18px;
}

.green-icon{
  color:#138f42;
}

.yellow-icon{
  color:#dba300;
}

.orange-icon{
  color:#f29b13;
}

.red-icon{
  color:#f15a24;
}

.green-icon svg *,
.yellow-icon svg *,
.orange-icon svg *,
.red-icon svg *{
  fill:currentColor !important;
  stroke:currentColor !important;
}

.motorway{
  background:#1042b8;
}

.aroad{
  background:#17933d;
}

.icon{
  margin-right:8px;
}

.red{
  color:#f15a24;
}

.orange{
  color:#f29b13;
}

.yellow{
  color:#dba300;
}

.green{
  color:#138f42;
}

.red.delay-pill{
  background:#fff0e8;
}

.orange.delay-pill{
  background:#fff4e8;
}

.yellow.delay-pill{
  background:#fff8e7;
}

.green.delay-pill{
  background:#edf7ed;
}


body {
  font-family: 'Inter', sans-serif;
}

th,
.status,
.delay {
  font-family: 'Inter Bold', sans-serif;
}


</style>
</head>

<body>

</tbody>

</table>



<script>
async function refreshTable() {
  try {
    const response = await fetch(
      window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' }
    );

    const html = await response.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    const newBody = doc.getElementById('traffic-body');
    const currentBody = document.getElementById('traffic-body');

    if (newBody && currentBody) {
      currentBody.innerHTML = newBody.innerHTML;
    }
  } catch (err) {
    console.error('Refresh failed:', err);
  }
}

// Refresh every 2 minutes
setInterval(refreshTable, 120000);
</script>


</body>
</html>
