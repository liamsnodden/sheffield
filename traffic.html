<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

.container{
width:100%;
height:100%;
padding:25px 35px;
}

.header{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:20px;
}

.title{
font-size:42px;
font-weight:700;
color:#111;
}

.updated{
font-size:18px;
color:#666;
}

.feed{
height:calc(100% - 80px);
overflow:hidden;
}

.item{
display:flex;
gap:18px;
padding:16px 0;
border-bottom:1px solid #ececec;
}

.dot{
width:28px;
height:28px;
border-radius:50%;
flex-shrink:0;
margin-top:3px;
}

.red{
background:#ff3b30;
}

.orange{
background:#ff9500;
}

.green{
background:#34c759;
}

.content{
flex:1;
}

.headline{
font-size:24px;
font-weight:700;
color:#111;
}

.desc{
font-size:18px;
color:#666;
margin-top:4px;
line-height:1.3;
}

.time{
font-size:16px;
color:#999;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="title">SHEFFIELD TRAFFIC UPDATES</div>
<div class="updated" id="updated">Loading...</div>
</div>

<div class="feed" id="feed">
Loading...
</div>

</div>

<script>

/*
National Highways RSS
Replace if you find a more specific Yorkshire feed
*/
const RSS_URL =
'https://m.highways.gov.uk/feeds/rss/UnplannedEvents.xml';

const API =
'https://api.rss2json.com/v1/api.json?rss_url=' +
encodeURIComponent(RSS_URL);

function severity(text){

text = text.toLowerCase();

if(
text.includes('closure') ||
text.includes('closed') ||
text.includes('accident') ||
text.includes('collision')
){
return 'red';
}

if(
text.includes('delay') ||
text.includes('roadworks') ||
text.includes('congestion')
){
return 'orange';
}

return 'green';
}

async function loadTraffic(){

try{

const res = await fetch(API);
const data = await res.json();

let incidents = data.items.filter(item => {

const t =
(item.title + ' ' + item.description)
.toLowerCase();

return (
t.includes('m1') ||
t.includes('a57') ||
t.includes('a61') ||
t.includes('sheffield') ||
t.includes('rotherham') ||
t.includes('barnsley')
);

}).slice(0,6);

if(incidents.length === 0){
incidents = data.items.slice(0,6);
}

document.getElementById('feed').innerHTML =
incidents.map(item => {

const colour =
severity(item.title);

return `
<div class="item">

<div class="dot ${colour}"></div>

<div class="content">
<div class="headline">
${item.title}
</div>

<div class="desc">
${item.description
.replace(/<[^>]+>/g,'')
.substring(0,120)}
</div>
</div>

</div>
`;
}).join('');

document.getElementById('updated').innerHTML =
'Updated ' +
new Date().toLocaleTimeString('en-GB',{
hour:'2-digit',
minute:'2-digit'
});

}
catch(err){

document.getElementById('feed').innerHTML =
'Unable to load traffic data';

console.error(err);
}
}

loadTraffic();
setInterval(loadTraffic,60000);

</script>

</body>
</html>
