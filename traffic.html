<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=450">
<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
width:450px;
background:transparent;
overflow:hidden
}

#widget{
width:450px;
height:320px;
background:transparent;
color:#fff;
border-radius:0;
overflow:hidden;
box-shadow:0 8px 24px rgba(0,0,0,.35);
}

#content{
height:295px;
}

.row{
height:98px;
padding:14px 16px;
border-bottom:1px solid rgba(255,255,255,.08)
}

.top{
display:flex;
justify-content:space-between;
align-items:center
}

.road{
font-size:22px;
font-weight:700;
line-height:1.1
}

.delay{
font-size:20px;
font-weight:700;
line-height:1
}

.details{
margin-top:10px;
font-size:18px;
color:#e5e5e5
}

.red{color:#ff4d4f}
.amber{color:#faad14}
.yellow{color:#fadb14}
.green{color:#73d13d}

.footer{
height:25px;
display:flex;
justify-content:center;
align-items:center;
gap:8px
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#35507d
}

.dot.active{
background:#fff
}
</style>
</head>
<body>

<div id="widget">
<div id="content"></div>
<div class="footer" id="footer"></div>
</div>

<script>
const apiKey="N61XFRwHAscPzxZI6ci39stZrnzoc4qS";

const bbox="-1.60,53.32,-1.34,53.45";

const monitoredRoads=[
"M1_N",
"M1_S",
"M18",
"A57",
"A61",
"A616",
"A630"
];

const roadNames={
"M1_N":"M1 Northbound",
"M1_S":"M1 Southbound",
"M18":"M18",
"A630":"A630 Parkway",
"A616":"A616 Stocksbridge",
"A61":"A61 Barnsley Rd",
"A57":"A57 Worksop Rd"
};

const trafficUrl=`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=en-GB&fields={incidents{properties{roadNumbers,delay,events{description}}}}&key=${apiKey}`;

let pages=[];
let currentPage=0;

function getColour(delay){
if(delay>=15) return "red";
if(delay>=5) return "amber";
if(delay>0) return "yellow";
return "green";
}

async function loadTraffic(){

try{

const response=await fetch(trafficUrl);
const data=await response.json();

const rows=[];

monitoredRoads.forEach(road=>{

let incidents=(data.incidents||[]).filter(i=>{

const roads=i.properties?.roadNumbers||[];
const text=JSON.stringify(i).toLowerCase();

if(road==="M1_N"){
return roads.some(r=>String(r).toUpperCase()==="M1")
&& text.includes("northbound");
}

if(road==="M1_S"){
return roads.some(r=>String(r).toUpperCase()==="M1")
&& text.includes("southbound");
}

return roads.some(r=>String(r).toUpperCase()===road);
});

let totalDelay=0;

incidents.forEach(i=>{
totalDelay += i.properties?.delay
? Math.round(i.properties.delay/60)
: 0;
});

let status="Clear";

if(totalDelay>=15){
status="Severe Delays";
}
else if(totalDelay>=5){
status="Delays";
}
else if(totalDelay>0){
status="Minor Delays";
}

rows.push({
road:roadNames[road],
delay:totalDelay,
status,
colour:getColour(totalDelay)
});

});

rows.sort((a,b)=>{
return (b.delay||0)-(a.delay||0);
});

pages=[];

for(let i=0;i<rows.length;i+=3){
pages.push(rows.slice(i,i+3));
}

currentPage=0;
renderPage();

}catch(e){
console.error(e);
}
}

function renderPage(){

const page=pages[currentPage]||[];

document.getElementById("content").innerHTML=page.map(item=>`

<div class="row">

<div class="top">

<div class="road ${item.colour}">
${item.road}
</div>

<div class="delay ${item.colour}">
${
item.delay > 0
? item.delay + " min" + (item.delay === 1 ? "" : "s")
: ""
}
</div>

</div>

<div class="details">
${item.status}
</div>

</div>

`).join("");

document.getElementById("footer").innerHTML=
pages.map((_,i)=>
`<div class="dot ${i===currentPage?'active':''}"></div>`
).join("");
}

setInterval(()=>{

if(pages.length<=1) return;

currentPage=(currentPage+1)%pages.length;

renderPage();

},10000);

loadTraffic();

setInterval(loadTraffic,60000);

</script>

</body>
</html>
