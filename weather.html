<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Bar Final Transparent</title>
<style>
body{margin:0;background:transparent;font-family:Segoe UI,Arial,sans-serif}
.bar{
width:700px;
height:100px;
background:transparent;
color:#fff;
display:flex;
align-items:center;
overflow:hidden;
}
.icon{width:70px;text-align:center;font-size:42px}
.temp{font-size:54px;font-weight:700;line-height:1;margin-right:10px}
.desc{width:140px}
.cond{font-size:18px;font-weight:600}
.feels{font-size:13px}
.metric{width:62px;text-align:center;font-size:11px}
.metric svg{width:24px;height:24px;display:block;margin:0 auto 2px}
.val{font-size:14px;font-weight:700}
.metric-divider{width:1px;height:42px;background:rgba(255,255,255,.30);margin:0 6px}
.high{color:#ff4d4d}
.low{color:#4ea1ff}
</style>
</head>
<body>
<div class="bar">
<div class="icon" id="weatherIcon">⛅</div>
<div class="temp" id="temp">--°</div>

<div class="desc">
<div class="cond" id="cond">Loading...</div>
<div class="feels">Feels Like <span id="feels">--°</span></div>
</div>

<div class="metric">
<svg viewBox="0 0 24 24"><path d="M12 2C12 2 6 10 6 14a6 6 0 0 0 12 0c0-4-6-12-6-12z" fill="none" stroke="#4ea1ff" stroke-width="2"/></svg>
<div class="val" id="humidity">--</div><div>HUM</div>
</div>

<div class="metric">
<svg viewBox="0 0 24 24"><path d="M3 8h10M3 12h16M3 16h8" fill="none" stroke="#4ea1ff" stroke-width="2" stroke-linecap="round"/></svg>
<div class="val" id="wind">--</div><div>WIND</div>
</div>

<div class="metric">
<svg viewBox="0 0 24 24"><path d="M7 17h9a4 4 0 0 0 0-8a5 5 0 0 0-9-2a4 4 0 0 0 0 10z" fill="none" stroke="#4ea1ff" stroke-width="2"/></svg>
<div class="val" id="rain">--</div><div>RAIN</div>
</div>

<div class="metric-divider"></div>

<div class="metric">
<div class="val high" id="high">--</div>
<div class="high">HIGH</div>
</div>

<div class="metric">
<div class="val low" id="low">--</div>
<div class="low">LOW</div>
</div>
</div>

<script>
const icons={0:'☀️',1:'⛅',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',61:'🌧️',63:'🌧️',65:'🌧️',80:'🌦️',81:'🌦️',82:'🌦️',95:'⛈️'};
const descs={0:'Clear Sky',1:'Mainly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',61:'Rain',80:'Showers',95:'Thunderstorm'};

async function loadWeather(){
 const url='https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FLondon';
 const d=await (await fetch(url)).json();

 temp.textContent=Math.round(d.current.temperature_2m)+'°';
 feels.textContent=Math.round(d.current.apparent_temperature)+'°';
 humidity.textContent=d.current.relative_humidity_2m+'%';
 wind.textContent=Math.round(d.current.wind_speed_10m)+'mph';
 rain.textContent=d.daily.precipitation_probability_max[0]+'%';
 high.textContent=Math.round(d.daily.temperature_2m_max[0])+'°';
 low.textContent=Math.round(d.daily.temperature_2m_min[0])+'°';
 weatherIcon.textContent=icons[d.current.weather_code]||'⛅';
 cond.textContent=descs[d.current.weather_code]||'Current';
}
loadWeather();
setInterval(loadWeather,600000);
</script>
</body>
</html>
