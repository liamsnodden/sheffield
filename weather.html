<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Icon Widget 1</title>

<style>
body{
margin:0;
background:transparent;
overflow:hidden;
}

#weatherIcon{
width:100px;
height:100px;
display:flex;
align-items:center;
justify-content:center;
}

#weatherIcon img{
width:110px;
height:110px;
object-fit:contain;
}
</style>
</head>

<body>

<div id="weatherIcon">
<img id="icon" alt="Weather">
</div>

<script>

// OpenWeather Open Source Icons
const icons = {
clear: "https://openweathermap.org/img/wn/01d@2x.png",
partly: "https://openweathermap.org/img/wn/02d@2x.png",
cloudy: "https://openweathermap.org/img/wn/03d@2x.png",
rain: "https://openweathermap.org/img/wn/10d@2x.png",
thunderstorm: "https://openweathermap.org/img/wn/11d@2x.png",
snow: "https://openweathermap.org/img/wn/13d@2x.png",
fog: "https://openweathermap.org/img/wn/50d@2x.png"
};

function getIcon(code){

// Clear
if(code === 0)
return icons.clear;

// Partly Cloudy
if([1,2].includes(code))
return icons.partly;

// Cloudy
if(code === 3)
return icons.cloudy;

// Fog
if([45,48].includes(code))
return icons.fog;

// Snow
if([71,73,75,77,85,86].includes(code))
return icons.snow;

// Thunderstorm
if([95,96,99].includes(code))
return icons.thunderstorm;

// Rain / Showers / Drizzle
if([
51,53,55,
56,57,
61,63,65,
66,67,
80,81,82
].includes(code))
return icons.rain;

return icons.partly;
}

async function loadWeather(){

try{

const response = await fetch(
'https://api.open-meteo.com/v1/forecast?' +
'latitude=53.3811&longitude=-1.4701&' +
'current=weather_code&' +
'timezone=Europe/London'
);

const data = await response.json();

document.getElementById('icon').src =
getIcon(data.current.weather_code);

}catch(error){

console.error(error);

document.getElementById('icon').src =
icons.partly;
}
}

loadWeather();

// Refresh every 10 minutes
setInterval(loadWeather, 600000);

</script>

</body>
</html>
