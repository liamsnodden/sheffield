<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Transparent Weather Widget</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;

overflow:hidden;

background:transparent !important;

font-family:Arial,sans-serif;

color:white;
}

/* MAIN CONTAINER */

.widget{

width:100%;
height:100%;

padding:4%;

display:flex;

flex-direction:column;

justify-content:space-between;

background:transparent !important;

border:none;
}

/* TOP */

.top{

text-align:center;
}

.location{

font-size:4.2vh;

letter-spacing:0.3vh;

opacity:.9;

margin-bottom:1vh;

font-weight:700;
}

.icon{

font-size:20vh;

line-height:1;
}

.temp{

font-size:18vh;

font-weight:700;

line-height:1;
}

.feels{

font-size:4vh;

opacity:.85;

margin-top:1vh;
}

/* FORECAST */

.forecast{

margin-top:2vh;
}

.forecast-title{

font-size:5vh;

margin-bottom:1.5vh;

letter-spacing:.1vh;

color:#ffffff;

text-align:center;

font-weight:700;
}

.days{

display:flex;

justify-content:space-between;

gap:2%;
}

.day{

flex:1;

text-align:center;

background:rgba(255,255,255,0.08);

border-radius:2vh;

padding:2vh 1vh;

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,0.08);
}

.day-name{

font-size:2.10vh;

margin-bottom:1vh;

font-weight:700;
}

.day-icon{

font-size:5vh;

margin-bottom:1vh;
}

.day-temp{

font-size:3.6vh;

font-weight:700;
}

</style>

</head>

<body>

<div class="widget">

<div class="top">

<div class="location">
SHEFFIELD
</div>

<div class="icon"
id="mainIcon">
☁️
</div>

<div class="temp"
id="temp">
18°C
</div>

<div class="feels"
id="feels">
Feels like 17°C
</div>

</div>

<div class="forecast">

<div class="forecast-title">
3 DAY FORECAST
</div>

<div class="days"
id="forecastDays"></div>

</div>

</div>

<script>

/* WEATHER ICONS */

const weatherIcons = {

0:'☀️',
1:'🌤️',
2:'⛅',
3:'☁️',
45:'🌫️',
48:'🌫️',
51:'🌦️',
61:'🌧️',
71:'❄️',
95:'⛈️'
};

/* OPEN METEO API */

const api =
'https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max&forecast_days=4&timezone=Europe/London';

/* LOAD WEATHER */

async function loadWeather(){

const response =
await fetch(api);

const data =
await response.json();

/* CURRENT WEATHER */

document.getElementById('temp').innerText =
Math.round(
data.current.temperature_2m
) + '°C';

document.getElementById('feels').innerText =
'Feels like ' +
Math.round(
data.current.apparent_temperature
) + '°C';

document.getElementById('mainIcon').innerText =
weatherIcons[
data.current.weather_code
] || '☁️';

/* FORECAST */

const container =
document.getElementById(
'forecastDays'
);

container.innerHTML = '';

for(let i = 1; i <= 3; i++){

const date =
new Date(
data.daily.time[i]
);

const dayName =
date.toLocaleDateString(
'en-GB',
{
weekday:'short'
}
).toUpperCase();

const temp =
Math.round(
data.daily
.temperature_2m_max[i]
);

const code =
data.daily.weather_code[i];

container.innerHTML += `

<div class="day">

<div class="day-name">
${dayName}
</div>

<div class="day-icon">
${weatherIcons[code] || '☁️'}
</div>

<div class="day-temp">
${temp}°
</div>

</div>

`;
}
}

/* INITIAL LOAD */

loadWeather();

/* AUTO REFRESH */

setInterval(
loadWeather,
300000
);

</script>

</body>

</html>
