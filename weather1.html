<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Bar</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:;
font-family:Arial, Helvetica, sans-serif;
}

#weather-bar{
height:120px;
display:flex;
align-items:center;
color:white;
padding:0 10px;
}

#weather-icon{
width:120px;
height:120px;
margin-right:8px;
filter:drop-shadow(0 0 10px rgba(255,255,255,0.2));
}

#weather-temp{
font-size:68px;
font-weight:700;
line-height:1;
margin-right:20px;
white-space:nowrap;
}

#weather-info{
display:flex;
flex-direction:column;
justify-content:center;
}

#weather-condition{
font-size:25px;
font-weight:600;
line-height:1.1;
}

#weather-feels{
font-size:18px;
opacity:0.9;
margin-top:4px;
}
</style>
</head>

<body>

<div id="weather-bar">

<img id="weather-icon"
src="https://openweathermap.org/img/wn/01d@4x.png"
alt="Weather">

<div id="weather-temp">--°c</div>

<div id="weather-info">
<div id="weather-condition">Loading...</div>
<div id="weather-feels">Feels like --°c</div>
</div>

</div>

<script>

const LATITUDE = 53.3811; // Sheffield
const LONGITUDE = -1.4701;

const weatherDescriptions = {
0: "Clear",
1: "Mainly Clear",
2: "Partly Cloudy",
3: "Overcast",
45: "Fog",
48: "Fog",
51: "Light Drizzle",
53: "Drizzle",
55: "Heavy Drizzle",
61: "Light Rain",
63: "Rain",
65: "Heavy Rain",
71: "Snow",
73: "Snow",
75: "Heavy Snow",
80: "Rain Showers",
81: "Heavy Showers",
82: "Heavy Rain",
95: "Thunderstorm",
96: "Thunderstorm",
99: "Thunderstorm"
};

const iconMap = {
0: "01d",
1: "02d",
2: "03d",
3: "04d",
45: "50d",
48: "50d",
51: "09d",
53: "09d",
55: "09d",
61: "10d",
63: "10d",
65: "10d",
71: "13d",
73: "13d",
75: "13d",
80: "09d",
81: "09d",
82: "09d",
95: "11d",
96: "11d",
99: "11d"
};

async function updateWeather() {

try {

const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,apparent_temperature,weather_code`
);

const data = await response.json();

const code = data.current.weather_code;

document.getElementById('weather-temp').textContent =
Math.round(data.current.temperature_2m) + '°c';

document.getElementById('weather-condition').textContent =
weatherDescriptions[code] || 'Unknown';

document.getElementById('weather-feels').textContent =
'Feels like ' +
Math.round(data.current.apparent_temperature) +
'°c';

document.getElementById('weather-icon').src =
`https://openweathermap.org/img/wn/${iconMap[code] || '04d'}@4x.png`;

} catch (error) {

console.error(error);

document.getElementById('weather-condition').textContent =
'Weather unavailable';

document.getElementById('weather-feels').textContent = '';
}
}

updateWeather();

/* Refresh every 10 minutes */
setInterval(updateWeather, 600000);

</script>

</body>
</html>
