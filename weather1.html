<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Bar</title>

<style>
body{
margin:0;
background:#1565c0;
font-family:Arial, Helvetica, sans-serif;
}

.weather-bar{
height:120px;
display:flex;
align-items:center;
padding:0 20px;
color:white;
}

.weather-icon{
width:90px;
height:90px;
margin-right:20px;
object-fit:contain;
}

.temperature{
font-size:64px;
font-weight:700;
line-height:1;
margin-right:25px;
}

.weather-details{
display:flex;
flex-direction:column;
justify-content:center;
}

.condition{
font-size:28px;
font-weight:600;
line-height:1.1;
}

.feels-like{
font-size:20px;
opacity:.9;
margin-top:4px;
}
</style>
</head>

<body>

<div class="weather-bar">

<img id="weatherIcon"
class="weather-icon"
alt="Weather">

<div id="temperature" class="temperature">
--
</div>

<div class="weather-details">
<div id="condition" class="condition">
Loading...
</div>

<div id="feelsLike" class="feels-like">
Feels like --
</div>
</div>

</div>

<script>

const LATITUDE = 53.3811; // Sheffield
const LONGITUDE = -1.4701;

const iconBase =
"https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/all/";

const descriptions = {
0:"Clear",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Overcast",
45:"Fog",
48:"Fog",
51:"Light Drizzle",
53:"Drizzle",
55:"Heavy Drizzle",
61:"Light Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
73:"Snow",
75:"Heavy Snow",
80:"Rain Showers",
81:"Heavy Showers",
82:"Violent Showers",
95:"Thunderstorm",
96:"Thunderstorm",
99:"Thunderstorm"
};

const icons = {
0:"clear-day.svg",
1:"partly-cloudy-day.svg",
2:"partly-cloudy-day.svg",
3:"overcast.svg",
45:"fog.svg",
48:"fog.svg",
51:"drizzle.svg",
53:"drizzle.svg",
55:"drizzle.svg",
61:"rain.svg",
63:"rain.svg",
65:"rain.svg",
71:"snow.svg",
73:"snow.svg",
75:"snow.svg",
80:"rain.svg",
81:"rain.svg",
82:"rain.svg",
95:"thunderstorms.svg",
96:"thunderstorms.svg",
99:"thunderstorms.svg"
};

async function updateWeather() {

try {

const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,apparent_temperature,weather_code`
);

const data = await response.json();

const code = data.current.weather_code;

document.getElementById("temperature").textContent =
Math.round(data.current.temperature_2m) + "°C";

document.getElementById("condition").textContent =
descriptions[code] || "Unknown";

document.getElementById("feelsLike").textContent =
"Feels like " +
Math.round(data.current.apparent_temperature) +
"°C";

document.getElementById("weatherIcon").src =
iconBase + (icons[code] || "overcast.svg");

} catch(err) {

document.getElementById("condition").textContent =
"Weather unavailable";

console.error(err);
}
}

updateWeather();

/* Refresh every 10 minutes */
setInterval(updateWeather, 600000);

</script>

</body>
</html>
