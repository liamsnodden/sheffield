<div id="weatherPanel" style="
width:100%;
height:100%;
background:#0f172a;
border-radius:20px;
padding:18px;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
color:white;
display:flex;
flex-direction:column;
gap:14px;
overflow:hidden;
">

<div style="
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
">

border-radius:18px;
padding:18px;
">

display:flex;
align-items:center;
gap:10px;
margin-bottom:14px;
">

<svg width="28" height="28" viewBox="0 0 24 24"
fill="none"
stroke="#ffffff"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M3 8h11a3 3 0 1 0-3-3"/>
<path d="M2 12h15a3 3 0 1 1-3 3"/>
<path d="M4 16h9"/>

</svg>

<div style="
font-size:12px;
color:#94a3b8;
letter-spacing:1px;
">
WIND
</div>

</div>

<div id="windVal" style="
font-size:38px;
font-weight:700;
line-height:1;
">
--
</div>

</div>

<!-- HUMIDITY -->
<div style="
background:#1e293b;
border-radius:18px;
padding:18px;
">

<div style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:14px;
">

<svg width="28" height="28" viewBox="0 0 24 24"
fill="none"
stroke="#ffffff"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M12 2C12 2 6 9 6 13a6 6 0 0 0 12 0c0-4-6-11-6-11z"/>

<div style="
font-size:12px;
color:#94a3b8;
letter-spacing:1px;
">
HUMIDITY
</div>

</div>

<div id="humidityVal" style="
font-size:38px;
font-weight:700;
line-height:1;
">
--
</div>

</div>

<!-- UV -->
<div style="
background:#1e293b;
border-radius:18px;
padding:18px;
">

<div style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:14px;
">

<svg width="28" height="28" viewBox="0 0 24 24"
fill="none"
stroke="#ffffff"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<circle cx="12" cy="12" r="4"/>
<path d="M12 2v2"/>
<path d="M12 20v2"/>

<path d="M20 12h2"/>

<path d="M4.9 19.1l1.4-1.4"/>

<div style="

color:#94a3b8;

UV INDEX

<div id="uvVal" style="
font-size:38px;
font-weight:700;

--
</div>

<!-- ALERTS -->
<div id="alertsBox" style="
background:#052e16;
border-radius:18px;
padding:18px;
">

<div style="
font-size:12px;
color:#86efac;
letter-spacing:1px;

WEATHER ALERTS

<div id="alertsText" style="
font-size:26px;
font-weight:700;
color:#4ade80;

No weather alerts

<!-- SUN -->

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
">

<!-- SUNRISE -->

background:#1e293b;
border-radius:18px;
padding:18px;
">

margin-bottom:14px;

fill="none"
stroke="#ffffff"
stroke-width="2"

<path d="M17 18a5 5 0 0 0-10 0"/>
<line x1="12" y1="2" x2="12" y2="9"/>

<!-- SUNSET -->

border-radius:18px;
padding:18px;
">

<div style="
display:flex;
align-items:center;
gap:10px;
margin-bottom:14px;
">

<svg width="28" height="28" viewBox="0 0 24 24"
fill="none"
stroke="#ffffff"
stroke-width="2"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M17 18a5 5 0 0 0-10 0"/>
<line x1="12" y1="9" x2="12" y2="2"/>
<line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/>
<line x1="1" y1="18" x2="23" y2="18"/>
<line x1="20.78" y1="10.22" x2="19.36" y2="11.64"/>

<div style="
font-size:12px;

">

<!-- CLEVELAND -->
<div style="
background:#1e293b;
border-radius:18px;
padding:18px;
display:flex;
align-items:center;
justify-content:space-between;
">

<div>

<div style="
font-size:12px;
color:#94a3b8;
letter-spacing:1px;
margin-bottom:8px;
">
CLEVELAND, OHIO
</div>

<div id="clevelandTemp" style="
font-size:34px;
font-weight:700;
">
--
</div>

</div>

<div id="clevelandIcon"></div>

</div>

</div>

<script>

function weatherIcon(code) {

if (code >= 95) {

return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><polyline points="13 11 9 17 15 17 11 23"/></svg>';

}

if (code >= 61) {

return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="8" y1="19" x2="8.01" y2="19"/><line x1="8" y1="23" x2="8.01" y2="23"/><line x1="16" y1="19" x2="16.01" y2="19"/><line x1="16" y1="23" x2="16.01" y2="23"/></svg>';

}

if (code >= 1) {

return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-.9-8.9A6 6 0 1 0 6 18h11.5z"/></svg>';

}

return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>';
}

fetch('https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=relative_humidity_2m,windspeed_10m&daily=uv_index_max,precipitation_sum,windspeed_10m_max,weathercode,sunrise,sunset&timezone=auto')

.then(function(response) {
return response.json();
})

.then(function(data) {

document.getElementById('windVal').innerHTML =
Math.round(data.current.windspeed_10m) +
'<span style="font-size:16px;color:#94a3b8;"> km/h</span>';

document.getElementById('humidityVal').innerHTML =
data.current.relative_humidity_2m + '%';

document.getElementById('uvVal').innerHTML =
data.daily.uv_index_max[0];

document.getElementById('sunriseVal').innerHTML =
data.daily.sunrise[0].split('T')[1];

document.getElementById('sunsetVal').innerHTML =
data.daily.sunset[0].split('T')[1];

var alerts = [];

if (data.daily.uv_index_max[0] >= 6) {
alerts.push('High UV');
}

if (data.daily.precipitation_sum[0] >= 10) {
alerts.push('Heavy Rain');
}

if (data.daily.windspeed_10m_max[0] >= 35) {
alerts.push('High Winds');
}

if (
data.daily.weathercode[0] == 95 ||
data.daily.weathercode[0] == 96 ||
data.daily.weathercode[0] == 99
) {
alerts.push('Storm Risk');
}

if (alerts.length > 0) {

document.getElementById('alertsBox').style.background =
'#3f1113';

document.getElementById('alertsText').style.color =
'#fca5a5';

document.getElementById('alertsText').innerHTML =
alerts.join(' • ');
}

});

fetch('https://api.open-meteo.com/v1/forecast?latitude=41.4993&longitude=-81.6944&current=temperature_2m,weathercode')

.then(function(response) {
return response.json();
})

.then(function(data) {

document.getElementById('clevelandTemp').innerHTML =
Math.round(data.current.temperature_2m) + '°C';

document.getElementById('clevelandIcon').innerHTML =
weatherIcon(data.current.weathercode);

});

</script>
