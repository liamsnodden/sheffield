<script>

function weatherDescription(code) {

if (code >= 95) return 'Storm';
if (code >= 80) return 'Rain Showers';
if (code >= 61) return 'Rain';
if (code >= 51) return 'Drizzle';
if (code >= 3) return 'Cloudy';
if (code >= 1) return 'Partly Cloudy';

return 'Clear';
}

function weatherIcon(code, size) {

if (code >= 95) {

return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M19 16.9A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3"/><polyline points="13 11 9 17 15 17 11 23"/></svg>';

}

if (code >= 61) {

return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/><line x1="8" y1="19" x2="8.01" y2="19"/><line x1="8" y1="23" x2="8.01" y2="23"/><line x1="16" y1="19" x2="16.01" y2="19"/><line x1="16" y1="23" x2="16.01" y2="23"/></svg>';

}

if (code >= 1) {

return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 1 0-.9-8.9A6 6 0 1 0 6 18h11.5z"/></svg>';

}

return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/></svg>';
}

fetch('https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&current=temperature_2m,apparent_temperature,relative_humidity_2m,windspeed_10m,weathercode&daily=uv_index_max,precipitation_sum,windspeed_10m_max,weathercode,sunrise,sunset&timezone=auto')

.then(function(response) {
return response.json();
})

.then(function(data) {

document.getElementById('mainTemp').innerHTML =
Math.round(data.current.temperature_2m) + '°';

document.getElementById('mainCondition').innerHTML =
weatherDescription(data.current.weathercode);

document.getElementById('feelsLike').innerHTML =
'Feels like ' +
Math.round(data.current.apparent_temperature) + '°';

document.getElementById('mainIcon').innerHTML =
weatherIcon(data.current.weathercode, 170);

document.getElementById('windVal').innerHTML =
Math.round(data.current.windspeed_10m);

document.getElementById('humidityVal').innerHTML =
data.current.relative_humidity_2m;

document.getElementById('uvVal').innerHTML =
data.daily.uv_index_max[0];

document.getElementById('sunriseVal').innerHTML =
data.daily.sunrise[0].split('T')[1];

document.getElementById('sunsetVal').innerHTML =
data.daily.sunset[0].split('T')[1];

var alerts = [];

if (data.daily.uv_index_max[0] >= 6) alerts.push('High UV');
if (data.daily.precipitation_sum[0] >= 10) alerts.push('Heavy Rain');
if (data.daily.windspeed_10m_max[0] >= 35) alerts.push('High Winds');

if (
data.daily.weathercode[0] == 95 ||
data.daily.weathercode[0] == 96 ||
data.daily.weathercode[0] == 99
) {
alerts.push('Storm Risk');
}

if (alerts.length > 0) {

document.getElementById('alertsBox').style.background =
'rgba(127,29,29,0.82)';

document.getElementById('alertsText').innerHTML =
alerts.join(' • ');
}

});

fetch('https://api.open-meteo.com/v1/forecast?latitude=41.4993&longitude=-81.6944&current=temperature_2m,weathercode')

.then(function(response) {
return response.json();
})

.then(function(data) {

document.getElementById('clevelandTemp').innerHTML =
Math.round(data.current.temperature_2m) + '°';

document.getElementById('clevelandIcon').innerHTML =
weatherIcon(data.current.weathercode, 64);

});

</script>
