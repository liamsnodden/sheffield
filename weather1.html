<div id="weatherSummary">
<div id="temp">18°</div>

<div class="weather-text">
<div id="condition">Partly Cloudy</div>
<div id="feels">Feels Like 16°</div>
</div>
</div>

<style>
body{
margin:0;
background:transparent;
font-family:Arial, sans-serif;
}

#weatherSummary{
display:flex;
align-items:center;
height:100px;
color:white;
}

#temp{
font-size:64px;
font-weight:700;
line-height:1;
margin-right:18px;
}

.weather-text{
display:flex;
flex-direction:column;
justify-content:center;
}

#condition{
font-size:20px;
font-weight:600;
line-height:1.2;
}

#feels{
font-size:14px;
color:#cfd8e3;
margin-top:4px;
}
</style>

<script>
async function loadWeather(){

const url =
'https://api.open-meteo.com/v1/forecast?' +
'latitude=53.3811&longitude=-1.4701&' +
'current=temperature_2m,apparent_temperature,weather_code&' +
'timezone=Europe/London';

const data = await fetch(url).then(r => r.json());

const conditions = {
0:'Clear Sky',
1:'Mainly Clear',
2:'Partly Cloudy',
3:'Cloudy',
45:'Fog',
48:'Fog',
51:'Light Drizzle',
53:'Drizzle',
55:'Heavy Drizzle',
61:'Light Rain',
63:'Rain',
65:'Heavy Rain',
71:'Snow',
73:'Heavy Snow',
75:'Snowfall',
80:'Rain Showers',
81:'Heavy Showers',
82:'Violent Showers',
95:'Thunderstorm',
96:'Thunderstorm',
99:'Severe Thunderstorm'
};

document.getElementById('temp').textContent =
Math.round(data.current.temperature_2m) + '°';

document.getElementById('condition').textContent =
conditions[data.current.weather_code] || 'Current Conditions';

document.getElementById('feels').textContent =
'Feels Like ' +
Math.round(data.current.apparent_temperature) +
'°';
}

loadWeather();
setInterval(loadWeather, 600000);
</script>
