
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Inter', sans-serif;
}

.container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
}

/* LEFT */
.left{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon{
  width:52px;
}

.temp{
  font-family:'Oswald';
  font-size:40px;
  font-weight:700;
}

.desc{
  font-family:'Oswald';
  font-size:16px;
  font-weight:700;
}

.feels{
  font-size:13px;
  color:#555;
}

.hilo{
  font-family:'Oswald';
  font-size:14px;
}

.hi{ color:#dc2626; }
.lo{ color:#2563eb; }

/* CLOCK */
.clock{
  text-align:right;
}

.date{
  font-size:12px;
  color:#666;
}

.time{
  font-family:'Oswald';
  font-size:26px;
  font-weight:700;
}

.world{
  font-size:11px;
  color:#444;
}
</style>
</head>

<body>

<div class="container">

  <!-- WEATHER -->
  <div class="left">
    <img class="icon" src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/partly-cloudy-day.svg" />
    <div>
      <div class="temp">28°C</div>
      <div class="desc">PARTLY CLOUDY</div>
      <div class="feels">Feels like 28°C</div>
      <div class="hilo">
        <span class="hi">32°</span> /
        <span class="lo">22°</span>
      </div>
    </div>
  </div>

  <!-- CLOCK -->
  <div class="clock">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
    <div class="world" id="world"></div>
  </div>

</div>

<script>

// DATE
function updateDate(){
  const d = new Date();
  document.getElementById("date").textContent =
    d.toLocaleDateString("en-GB",{ day:"2-digit", month:"short" });
}

// LOCAL TIME
function updateTime(){
  const t = new Date();
  document.getElementById("time").textContent =
    t.toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" });
}

// WORLD CLOCK
const sites = [
  {city:"Cleveland", tz:"America/New_York"},
  {city:"Tournus", tz:"Europe/Paris"},
  {city:"Lelystad", tz:"Europe/Amsterdam"},
  {city:"Frankfurt", tz:"Europe/Berlin"},
  {city:"Pianoro", tz:"Europe/Rome"},
  {city:"Poland", tz:"Europe/Warsaw"},
  {city:"Bangalore", tz:"Asia/Kolkata"},
  {city:"Vietnam", tz:"Asia/Ho_Chi_Minh"}
];

let i = 0;

function updateWorld(){
  const s = sites[i];
  const time = new Intl.DateTimeFormat("en-GB",{
    hour:"2-digit",
    minute:"2-digit",
    timeZone:s.tz
  }).format(new Date());

  document.getElementById("world").textContent =
    time + " • " + s.city;

  i = (i + 1) % sites.length;
}

updateDate();
updateTime();
updateWorld();

setInterval(updateTime,1000);
setInterval(updateWorld,10000);

</script>

</body>
</html>
