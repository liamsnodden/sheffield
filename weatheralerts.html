
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body { margin:0; }

.container { display:flex; }

.header-block{
  background:linear-gradient(180deg,#7f1d1d,#b91c1c,#ef4444);
  color:#fff;
  font-family:'Oswald';
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  width:170px;
  text-align:center;
}

.header-inner{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1.1;
}

.content{
  display:flex;
  flex-direction:column;
  width:100%;
}

.bar{
  display:flex;
  height:54px;
}

.item{
  flex:1;
  display:flex;
  align-items:center;
  padding-left:8px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
}

.label{
  font-size:12px;
  font-family:'Inter';
}

.status{
  font-family:'Oswald';
  font-size:18px;
}

.alert-bar{
  display:flex;
  align-items:center;
  height:28px;
  padding:0 12px;
}

.alert-message{
  font-family:'Inter';
  font-size:12px;
}

.alert-time{
  margin-left:auto;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="header-block">
  <div class="header-inner">
    <div style="font-size:28px">☁️</div>
    <div style="font-size:16px">22°C</div>
    <div style="font-size:11px">Feels 22°C</div>
    <div style="font-size:11px">Overcast</div>
  </div>
</div>

<div class="content">

<div class="bar">

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Temp</div>
            <div class="status" style="">23° / 18°</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">UV</div>
            <div class="status" style="color:#f59e0b">CAUTION</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Wind</div>
            <div class="status" style="color:#16a34a">NO ALERTS</div>
          </div>
        </div>
      </div>
</div>

<div class="alert-bar">
  <div class="alert-message">High UV exposure</div>
  <div class="alert-time">20 Jun, 18:15</div>
</div>

</div>

</div>

</body>
</html>
