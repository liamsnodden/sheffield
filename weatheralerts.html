
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body { margin:0; }

.bar { display:flex; height:66px; border-bottom:1px solid #e2e8f0; }

.item { flex:1; display:flex; align-items:center; padding-left:12px; border-right:1px solid #ddd; }

.row { display:flex; align-items:center; gap:16px; }

.dot { width:18px; height:18px; border-radius:50%; }

.label { font-size:14px; font-weight:700; color:#082b5b; font-family:'Inter'; }

.status { font-family:'Oswald'; font-size:26px; font-weight:700; }

.alert-bar {
  display:flex;
  align-items:center;
  gap:14px;
  height:40px;
  padding:0 16px;
  background:#fff;
  border-top:1px solid #e2e8f0;
}

/* TEXT */
.alert-message,
.alert-message *,
.alert-time {
  font-family:'Inter', Arial, sans-serif !important;
}

.alert-title {
  font-family:'Oswald';
  font-size:15px;
  color:#b91c1c;
}

.alert-divider {
  width:1px;
  height:18px;
  background:#e5e5e5;
}

.alert-message {
  font-size:14px;
  font-weight:600;
  color:#222;
}

.high {
  color:#991b1b;
  font-weight:700;
  background:rgba(153,27,27,0.08);
  padding:2px 6px;
  border-radius:4px;
}

.scope {
  color:#dc2626;
  font-weight:700;
}

.alert-time {
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<div class="bar">

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Temp (Hi/Lo)</div>
              <div class="status" style="">
                23° / 17°
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">UV</div>
              <div class="status" style="color:#16a34a">
                NO ALERTS
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Wind</div>
              <div class="status" style="color:#16a34a">
                NO ALERTS
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Rain</div>
              <div class="status" style="color:#16a34a">
                NO ALERTS
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Storm</div>
              <div class="status" style="color:#16a34a">
                NO ALERTS
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Air Quality</div>
              <div class="status" style="color:#16a34a">
                GOOD
              </div>
            </div>
          </div>
        </div>

        <div class="item">
          <div class="row">
            <div class="dot" style="background:#16a34a"></div>
            <div>
              <div class="label">Visibility</div>
              <div class="status" style="color:#16a34a">
                GOOD
              </div>
            </div>
          </div>
        </div>
</div>

<div class="alert-bar">
<div class="alert-message">No weather-related risks identified. Work safely and follow standard procedures.</div>
     <div class="alert-time">Valid for today • Updated 20 Jun, 03:00</div>
</div>

</body>
</html>
