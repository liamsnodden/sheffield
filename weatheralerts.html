
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}


body {
  margin: 0;
  font-family: 'Inter';
  color: #fff;
}

/* MAIN CONTAINER */
.container {
  position: fixed;
  top: 0px;
  right: 0;

  display: inline-flex;
  align-items: center;

  width: auto;
  white-space: nowrap;

  padding: 0 14px;
}

.time,
.temp,
.desc {
  line-height: 1;
}

/* XIBO-SAFE SPACING */
.container > * {
  padding-right: 20px;
}

.container > *:last-child {
  padding-right: 0;
}

/* LEFT BLOCK */
.left {
  display: flex;
  align-items: center;
}

.left > * {
  padding-right: 14px;
}

.left > *:last-child {
  padding-right: 0;
}

.icon {
  width: 70px;
}

.temp {
  font-family: 'Oswald';
  font-size: 50px;
  font-weight: 500;
}

.desc {
  font-family: 'Oswald';
  font-size: 18px;
}


.forecast {
  display: flex;
  margin-left: 50px;
}


.forecast > * {
  padding-right: 10px;
}

.forecast > *:last-child {
  padding-right: 0;
}

.fcol {
  text-align: center;
}

/* CLOCK */
.clock {
  display: flex;
  flex-direction: column;
  align-items: flex-end;

  width: 140px;
  flex-shrink: 0;
  
  margin-left: 60px; /* increase gap */

}

.time {
  font-family: 'Oswald';
  font-size: 60px;
  font-weight: 700;
}



.hilow {
  color: #ffffff;
}

.high {
  color: #ffb3b3;
}

.low {
  color: #9ec5ff;
}




</style>
</head>

<body>

<div class="container">

  <div class="left">
    <div class="temp">22°C</div>
    <img class="icon" src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/partly-cloudy-day.svg">
    

<div>
  <div class="desc">PARTLY CLOUDY</div>
  <div>Feels 22°C</div>

  <div class="hilow">
    <span class="high">23°</span> /
    <span class="low">16°</span>
  </div>
</div>


  <div class="clock">
    <div class="time" id="time"></div>
  </div>

</div>


<script>
function updateTime() {
  const t = new Date();
  document.getElementById("time").textContent =
    t.toLocaleTimeString("en-GB", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

updateTime();
setInterval(updateTime, 1000);

// Refresh every 5 minutes with cache-busting
setInterval(() => {
  window.location.href =
    window.location.pathname + "?t=" + Date.now();
}, 300000);
</script>


</body>
</html>
