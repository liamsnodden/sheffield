
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>

body { margin:0; }

/* MAIN BAR */
.bar { display:flex; height:54px; border-bottom:1px solid #e2e8f0; }

/* ✅ NEW HEADER BLOCK */
.header-block{
  background:#b91c1c;
  color:#fff;
  font-family:'Oswald';
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 12px;
  min-width:150px;
  letter-spacing:0.5px;
}

.item { flex:1; display:flex; align-items:center; padding-left:8px; border-right:1px solid #eee; }

.row { display:flex; align-items:center; gap:10px; }

.dot { width:14px; height:14px; border-radius:50%; }

.label { font-size:12px; font-weight:600; color:#082b5b; font-family:'Inter'; }

.status { font-family:'Oswald'; font-size:20px; font-weight:700; }

/* ALERT BAR */
.alert-bar {
  display:flex;
  align-items:center;
  gap:10px;
  height:28px;
  padding:0 12px;
  background:#fff;
  border-top:1px solid #e2e8f0;
}

.alert-message,
.alert-message *,
.alert-time {
  font-family:'Inter', Arial, sans-serif !important;
}

.alert-title {
  font-family:'Oswald';
  font-size:13px;
  color:#b91c1c;
}

.alert-message {
  font-size:12px;
  font-weight:600;
  color:#222;
}

.high {
  color:#991b1b;
  font-weight:700;
  background:rgba(153,27,27,0.08);
  padding:1px 4px;
  border-radius:3px;
}

.alert-time {
  font-size:11px;
  color:#666;
}

</style>
</head>

<body>

<div class="bar">

<div class="header-block">WEATHER ALERTS</div>


      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Temp</div>
            <div class="status" style="">23° / 18°</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">UV</div>
            <div class="status" style="color:#f59e0b">CAUTION</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Wind</div>
            <div class="status" style="color:#16a34a">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Rain</div>
            <div class="status" style="color:#16a34a">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Storm</div>
            <div class="status" style="color:#16a34a">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Air</div>
            <div class="status" style="color:#16a34a">GOOD</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Vis</div>
            <div class="status" style="color:#16a34a">GOOD</div>
          </div>
        </div>
      </div>

</div>

<div class="alert-bar">
<div class="alert-title">ALERT</div>
     <div class="alert-message">Moderate UV: Use protection</div>
     <div class="alert-time">20 Jun, 10:52</div>
</div>

</body>
</html>
