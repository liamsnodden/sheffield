
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>
body { margin:0; }
.container { display:flex; }

/* HEADER */
.header-block{
  background:#ffffff;
  padding:0 24px 0 12px;
  width:220px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-inner{
  display:flex;
  align-items:center;
  gap:16px;
}

.icon{
  width:72px;
  height:72px;
}

.text-col{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.temp{
  font-size:36px;
  font-family:'Oswald';
  font-weight:700;
}

.feels{
  font-size:12px;
  font-family:Helvetica, Arial, sans-serif;
}

.desc{
  font-size:18px;
  font-family:'Oswald';
  font-weight:700;
}

.meta{
  font-size:11px;
  font-family:Helvetica, Arial, sans-serif;
  color:#555;
}

/* REST */
.content{ display:flex; flex-direction:column; width:100%; }
.bar{ display:flex;height:54px;border-bottom:1px solid #e2e8f0;}
.item{ flex:1;display:flex;align-items:center;padding-left:8px;border-right:1px solid #eee;}
.row{ display:flex;align-items:center;gap:10px;}
.dot{ width:14px;height:14px;border-radius:50%;}
.label{ font-size:12px;font-family:'Inter';}
.status{ font-family:'Oswald';font-size:20px;}
.alert-bar{display:flex;height:28px;align-items:center;padding:0 12px;}
.alert-time{margin-left:auto;font-size:11px;font-family:Helvetica, Arial, sans-serif;}
</style>
</head>

<body>

<div class="container">

<div class="header-block">
  <div class="header-inner">

    <img class="icon" src="https://openweathermap.org/img/wn/04d@2x.png">

    <div class="text-col">
      <div class="temp">22°C</div>
      <div class="feels">FEELS LIKE 22°C</div>
      <div class="desc">OVERCAST</div>
      <div class="meta">UPDATED Saturday 20 June 20 Jun, 18:57</div>
      <div class="meta">VALID FOR TODAY</div>
    </div>

  </div>
</div>

<div class="content">

<div class="bar">

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Temp</div>
            <div class="status">23° / 18°</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">UV</div>
            <div class="status">CAUTION</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Wind</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Rain</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Storm</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Air</div>
            <div class="status">GOOD</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Vis</div>
            <div class="status">GOOD</div>
          </div>
        </div>
      </div>
</div>

<div class="alert-bar">
  <div>No weather-related risks identified.</div>
  <div class="alert-time">20 Jun, 18:57</div>
</div>

</div>

</div>

</body>
</html>
