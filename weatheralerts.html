

<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8"/>

<title>Weather</title>

<style>

body{
font-family:sans-serif;
margin:0;
padding:20px;
background:#111;
color:#fff
}

.bar{
display:flex;
flex-wrap:wrap;
gap:10px
}

.item{
background:#1f2937;
padding:10px;
border-radius:12px;
min-width:150px
}

.row{
display:flex;
align-items:center;
gap:10px
}

.dot{
width:10px;
height:10px;
border-radius:50%
}

.label{
font-size:12px;
color:#9ca3af
}

.status{
font-size:14px;
font-weight:600
}

</style>

</head>

<body>

<div>Updated: 20 Jun, 20:53</div>

<div class="bar">



      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Temp (High/Low)</div>

            <div class="status" style="">23° / 18°</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#f59e0b"></div>

          <div>

            <div class="label">UV Index</div>

            <div class="status" style="color:#f59e0b">CAUTION</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Wind</div>

            <div class="status" style="color:#16a34a">NO ALERTS</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Heavy Rain</div>

            <div class="status" style="color:#16a34a">NO ALERTS</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Storm Warnings</div>

            <div class="status" style="color:#16a34a">NO ALERTS</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Air Quality</div>

            <div class="status" style="color:#16a34a">GOOD</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Pollen</div>

            <div class="status" style="color:#16a34a">LOW</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Visibility</div>

            <div class="status" style="color:#16a34a">GOOD</div>

          </div>

        </div>

      </div>


      <div class="item">

        <div class="row">

          <div class="dot" style="background:#16a34a"></div>

          <div>

            <div class="label">Wind Direction</div>

            <div class="status" style="color:#16a34a">NW (321°)</div>

          </div>

        </div>

      </div> <!-- ✅ NEW -->

</div>

</body>
</html>
