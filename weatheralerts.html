<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Alerts</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
}

#weather {
  display: flex;
  height: 150px;
  color: white;
}

.panel {
  flex: 1;
  padding: 15px;
  box-sizing: border-box;
}

.left {
  border-right: 1px solid rgba(255,255,255,0.1);
}

.title {
  font-size: 20px;
  font-weight: bold;
  color: #93c5fd;
  margin-bottom: 12px;
}

.alerts {
  display: flex;
  flex-wrap: wrap;
}

.pill {
  padding: 6px 10px;
  margin: 4px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  display: inline-block;
}

/* alert colours */
.uv { background: rgba(245,158,11,0.2); color:#fbbf24; }
.rain { background: rgba(37,99,235,0.2); color:#60a5fa; }
.wind { background: rgba(20,184,166,0.2); color:#2dd4bf; }
.storm { background: rgba(124,58,237,0.2); color:#a78bfa; }
.none { background: rgba(255,255,255,0.1); color:#ccc; }

</style>
</head>

<body>

<div id="weather">
  <div class="panel left">
    <div class="title">TODAY</div>
    <div id="today" class="alerts">Loading...</div>
  </div>

  <div class="panel">
    <div class="title">TOMORROW</div>
    <div id="tomorrow" class="alerts">Loading...</div>
  </div>
</div>

<script>
function makePill(text, className) {
  return '<div class="pill ' + className + '">' + text + '</div>';
}

function loadWeather() {

  var url = "https://api.open-meteo.com/v1/forecast?latitude=53.3811&longitude=-1.4701&daily=uv_index_max,precipitation_sum,windspeed_10m_max,weathercode&windspeed_unit=kmh&timezone=Europe/London";

  fetch(url)
    .then(res => res.json())
    .then(data => {

      function build(i) {
        var html = "";

        var uv = data.daily.uv_index_max[i];
        var rain = data.daily.precipitation_sum[i];
        var wind = data.daily.windspeed_10m_max[i];
        var code = data.daily.weathercode[i];

        if (uv >= 6)
          html += makePill("UV " + uv, "uv");

        if (rain >= 10)
          html += makePill(rain + "mm Rain", "rain");

        if (wind >= 35)
          html += makePill(wind + "kmh Wind", "wind");

        if (code == 95 || code == 96 || code == 99)
          html += makePill("Storm Risk", "storm");

        if (html === "")
          html = makePill("No Alerts", "none");

        return html;
      }

      document.getElementById("today").innerHTML = build(0);
      document.getElementById("tomorrow").innerHTML = build(1);

    })
    .catch(() => {
      document.getElementById("today").innerHTML = makePill("Unavailable", "none");
      document.getElementById("tomorrow").innerHTML = makePill("Unavailable", "none");
    });
}

// load + refresh every 30 mins
loadWeather();
setInterval(loadWeather, 1800000);
</script>

</body>
</html>
