
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ YOUR GITHUB FONTS */
@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

body { margin:0; font-family:'Inter'; color:#fff; }

.container{
  position:fixed;
  top:0;
  right:0;

  display:inline-flex;      /* ✅ shrink-to-fit */
  width:auto;               /* ✅ remove fixed width */
  white-space:nowrap;       /* ✅ prevent wrapping */

  justify-content:space-between;
  align-items:center;
  gap:20px;

  padding:10px 14px;
}

.left{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon{ width:70px; }

.temp{
  font-family:'Oswald';
  font-size:50px;
  font-weight:500;
}

.desc{
  font-family:'Oswald';
  font-size:18px;
}


.clock{
  display:flex;
  flex-direction:column;
  align-items:flex-end;

  width:140px;        /* ✅ FIXED WIDTH */
  flex-shrink:0;      /* ✅ NEVER shrink */
}


.time{
  font-family:'Oswald';
  font-size:46px;
  font-weight:700;
}

.forecast{
  display:flex;
  gap:10px;
}

.fcol{text-align:center;}

</style>
</head>

<body>

<div class="container">

<div class="left">
  <div class="temp">19°C</div>
  <img class="icon" src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/clear-day.svg">
  <div>
    <div class="desc">CLEAR SKIES</div>
    <div>Feels 19°C</div>
    <div>28° / 19°</div>
  </div>
</div>

<div class="forecast">

  <div class="fcol">
    <div>Sun</div>
    <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
    <div>22°</div>
  </div>

  <div class="fcol">
    <div>Mon</div>
    <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
    <div>22°</div>
  </div>

  <div class="fcol">
    <div>Tue</div>
    <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
    <div>20°</div>
  </div>

</div>

<div class="clock">
  <div class="time" id="time"></div>
</div>

</div>

<script>
function updateTime(){
  const t = new Date();
  document.getElementById("time").textContent =
    t.toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" });
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
