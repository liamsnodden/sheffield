
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* ========================================================= */
/* BASE */
/* ========================================================= */

body {
  margin:0;
}

.container {
  display:flex;
}

/* ========================================================= */
/* HEADER BLOCK */
/* ========================================================= */

.header-block {
  background:#ffffff;
  width:260px;
  display:flex;
  align-items:center;
  padding:0 30px 0 10px;
}

.header-inner {
  display:flex;
  align-items:center;
  gap:18px;
}

/* ========================================================= */
/* ICON (50% bigger) */
/* ========================================================= */

.icon {
  width:108px;
  height:108px;
}

/* ========================================================= */
/* TEXT COLUMN */
/* ========================================================= */

.text-col {
  display:flex;
  flex-direction:column;
  gap:3px;
}

/* TEMP */

.temp {
  font-size:40px;
  font-family:'Oswald';
  font-weight:700;
}

/* FEELS LIKE */

.feels {
  font-family:Helvetica, Arial, sans-serif;
  font-size:12px;
}

/* CONDITIONS */

.desc {
  font-family:'Oswald';
  font-size:18px;
  font-weight:700;
}

/* ========================================================= */
/* MAIN CONTENT */
/* ========================================================= */

.content {
  display:flex;
  flex-direction:column;
  width:100%;
}

/* BAR */

.bar {
  display:flex;
  height:54px;
  border-bottom:1px solid #eee;
}

/* ITEMS */

.item {
  flex:1;
  display:flex;
  align-items:center;
  padding-left:10px;
  border-right:1px solid #eee;
}

.row {
  display:flex;
  align-items:center;
  gap:10px;
}

.dot {
  width:14px;
  height:14px;
  border-radius:50%;
}

.label {
  font-size:12px;
  font-family:'Inter';
}

.status {
  font-size:20px;
  font-family:'Oswald';
  font-weight:700;
}

/* ========================================================= */
/* ALERT BAR */
/* ========================================================= */

.alert-bar {
  display:flex;
  align-items:center;
  height:28px;
  padding:0 12px;
}

.alert-time {
  margin-left:auto;
  font-size:11px;
  font-family:Helvetica, Arial, sans-serif;
}

</style>
</head>

<body>

<div class="container">

<div class="header-block">

  <div class="header-inner">

    https://openweathermap.org/img/wn/04d@2x.png

    <div class="text-col">
      <div class="temp">21°C</div>
      <div class="feels">Feels like 21°C</div>
      <div class="desc">OVERCAST</div>
    </div>

  </div>

</div>

<div class="content">

<div class="bar">

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Temp</div>
            <div class="status">23° / 18°</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">UV</div>
            <div class="status">CAUTION</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Wind</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Rain</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Storm</div>
            <div class="status">NO ALERTS</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Air</div>
            <div class="status">GOOD</div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#16a34a"></div>
          <div>
            <div class="label">Vis</div>
            <div class="status">GOOD</div>
          </div>
        </div>
      </div>
</div>

<div class="alert-bar">
  <div>No weather-related risks identified.</div>
  <div class="alert-time">UPDATED 20 Jun, 19:10 • VALID FOR TODAY</div>
</div>

</div>

</div>

</body>
</html>
