
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  padding:0;
  background:#ffffff;
  overflow:hidden;
}

*{
  box-sizing:border-box;
}

.bar{
  width:100%;
  height:78px;
  display:flex;
  align-items:center;
  background:#ffffff;
  border-top:1px solid #e5e5e5;
  border-bottom:1px solid #e5e5e5;
  font-family:Helvetica,Arial,sans-serif;
}

.item{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:12px;
  border-right:1px solid #d9d9d9;
}

.item:last-child{
  border-right:none;
}

.row{
  display:flex;
  align-items:center;
  gap:16px; /* spacing increased */
}

.text{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.label{
  font-size:14px;
  font-weight:700;
  color:#082b5b;
}

.status{
  font-family:'Oswald',sans-serif;
  font-size:28px;
  font-weight:700;
  line-height:1;
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  flex-shrink:0;
}
</style>
</head>

<body>

<div class="bar">

  <!-- TEMP -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#f59e0b"></div>
      <div class="text">
        <div class="label">Temp (Hi/Lo)</div>
        <div class="status"><span style="color:#f59e0b; font-weight:700;">25°</span> / 17°</div>
      </div>
    </div>
  </div>

  <!-- UV -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#f59e0b"></div>
      <div class="text">
        <div class="label">UV Index</div>
        <div class="status" style="color:#f59e0b">CAUTION</div>
      </div>
    </div>
  </div>

  <!-- WIND -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Wind</div>
        <div class="status" style="color:#22c55e">NORMAL</div>
      </div>
    </div>
  </div>

  <!-- RAIN -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Rain Impact</div>
        <div class="status" style="color:#22c55e">LOW</div>
      </div>
    </div>
  </div>

  <!-- STORM -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Thunderstorm</div>
        <div class="status" style="color:#22c55e">NONE</div>
      </div>
    </div>
  </div>

  <!-- HEAT -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Heat Stress</div>
        <div class="status" style="color:#22c55e">LOW</div>
      </div>
    </div>
  </div>

  <!-- AIR -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Air Quality</div>
        <div class="status" style="color:#22c55e">GOOD</div>
      </div>
    </div>
  </div>

  <!-- VISIBILITY -->
  <div class="item">
    <div class="row">
      <div class="dot" style="background:#22c55e"></div>
      <div class="text">
        <div class="label">Visibility</div>
        <div class="status" style="color:#22c55e">GOOD</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
