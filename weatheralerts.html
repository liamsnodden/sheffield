
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ FONTS FROM YOUR GITHUB */
@font-face {
  font-family:'Inter';
  src:url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf');
}

@font-face {
  font-family:'Oswald';
  src:url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf');
}

/* RESET */
html,body{
  margin:0;
  padding:0;
  width:100vw;
  overflow:hidden;
  font-family:'Inter';
  color:#fff;
}

/* ✅ FULL WIDTH XIBO BAR */
.container{
  position:fixed;
  top:0;
  left:0;

  width:100vw;              /* ✅ FORCE FULL WIDTH */
  height:90px;

  display:grid;
  grid-template-columns: 1fr 1px 1fr 1px 180px; /* ✅ fixed layout */
  align-items:center;

  padding:10px 30px;
  box-sizing:border-box;

  background:linear-gradient(90deg,#1e3a8a,#1e40af); /* blue bar */
  border-bottom:4px solid #dc2626; /* red strip */
}

/* SECTIONS */
.left, .middle, .right{
  display:flex;
  align-items:center;
  gap:16px;
  overflow:hidden;
}

/* DIVIDERS */
.divider{
  width:1px;
  height:60px;
  background:#fff;
  opacity:0.5;
}

/* WEATHER */
.temp{
  font-family:'Oswald';
  font-size:56px;
  white-space:nowrap;
}

.icon{
  width:60px;
}

.desc{
  font-family:'Oswald';
  font-size:20px;
}

.sub{
  font-size:13px;
}

/* FORECAST */
.forecast{
  display:flex;
  gap:22px;
}

.fcol{
  text-align:center;
  min-width:60px;
}

.ficon{
  width:36px;
}

.ftemp{
  font-family:'Oswald';
  font-size:16px;
}

/* CLOCK */
.clock-box{
  width:100%;              /* ✅ locked width column */
  background:rgba(0,0,0,0.25);
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.time{
  font-family:'Oswald';
  font-size:42px;
  line-height:1;
}

.date{
  font-size:14px;
  opacity:0.9;
}

</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <div class="temp">30°C</div>
    <img class="icon" src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/clear-day.svg">
    <div>
      <div class="desc">CLEAR SKIES</div>
      <div class="sub">Feels 30°C</div>
      <div class="sub">30° / 19°</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- MIDDLE -->
  <div class="middle">
    <div class="forecast">
      
        <div class="fcol">
          <div>Fri</div>
          <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" class="ficon">
          <div class="ftemp">34°</div>
        </div>
      
        <div class="fcol">
          <div>Sat</div>
          <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" class="ficon">
          <div class="ftemp">28°</div>
        </div>
      
        <div class="fcol">
          <div>Sun</div>
          <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" class="ficon">
          <div class="ftemp">22°</div>
        </div>
      
    </div>
  </div>

  <div class="divider"></div>

  <!-- RIGHT -->
  <div class="right">
    <div class="clock-box">
      <div class="time" id="time"></div>
      <div class="date" id="date"></div>
    </div>
  </div>

</div>

<script>
function updateTime(){
  const t = new Date();

  document.getElementById("time").textContent =
    t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});

  document.getElementById("date").textContent =
    t.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
}

setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
