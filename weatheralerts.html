
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body { margin:0; }

.container { display:flex; }

/* HEADER */
.header-block{
  background:linear-gradient(180deg,#7f1d1d,#b91c1c,#ef4444);
  color:#fff;
  font-family:'Oswald';
  font-size:16px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 16px;
  width:200px;
}

/* RIGHT SIDE */
.content{
  display:flex;
  flex-direction:column;
  width:100%;
}

/* CURRENT CONDITIONS ROW */
.current{
  display:flex;
  align-items:center;
  height:70px;
  border-bottom:1px solid #e2e8f0;
}

/* ICON COLUMN */
.icon-col{
  width:80px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
}

/* DATA COLUMN */
.data-col{
  display:flex;
  flex-direction:column;
  font-family:'Inter';
}

.temp{
  font-family:'Oswald';
  font-size:26px;
  font-weight:700;
}

.feels{
  font-size:12px;
  color:#555;
}

.desc{
  font-size:14px;
  font-weight:600;
  color:#082b5b;
}

/* ALERT BAR (UNCHANGED) */
.alert-bar{
  display:flex;
  align-items:center;
  height:28px;
  padding:0 12px;
}

.alert-message{
  font-family:'Inter';
  font-size:12px;
  font-weight:600;
}

.alert-time{
  margin-left:auto;
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="header-block">CURRENT WEATHER CONDITIONS</div>

<div class="content">

  <div class="current">
    <div class="icon-col">☁️</div>
    <div class="data-col">
      <div class="temp">22°C</div>
      <div class="feels">Feels like 22°C</div>
      <div class="desc">Overcast</div>
    </div>
  </div>

  <div class="alert-bar">
    <div class="alert-message">Moderate or high UV. Use sun protection</div>
    <div class="alert-time">20 Jun, 18:06</div>
  </div>

</div>
</div>

</body>
</html>
