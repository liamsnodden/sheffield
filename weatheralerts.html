
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

body {
  margin:0;
  font-family:'Inter';
  color:#fff;
}

/* ✅ MAIN CONTAINER */
.container{
  position:fixed;
  top:0;
  right:0;

  display:inline-flex;
  width:auto;
  white-space:nowrap;

  align-items:center;
  padding:10px 14px;
}

/* ✅ FORCE SPACING (Xibo-safe) */
.container > * {
  margin-left:20px;
}
.container > *:first-child {
  margin-left:0;
}

/* ✅ LEFT BLOCK */
.left{
  display:flex;
  align-items:center;
}

.left > * {
  margin-left:14px;
}
.left > *:first-child {
  margin-left:0;
}

.icon{ width:70px; }

.temp{
  font-family:'Oswald';
  font-size:50px;
  font-weight:500;
}

.desc{
  font-family:'Oswald';
  font-size:18px;
}

/* ✅ FORECAST */
.forecast{
  display:flex;
}

.forecast > * {
  margin-left:10px;
}
.forecast > *:first-child {
  margin-left:0;
}

.fcol{
  text-align:center;
}

/* ✅ CLOCK */
.clock{
  display:flex;
  flex-direction:column;
  align-items:flex-end;

  width:140px;
  flex-shrink:0;
}

.time{
  font-family:'Oswald';
  font-size:46px;
  font-weight:700;
}

</style>
</head>

<body>

<div class="container">

  <div class="left">
    <div class="temp">19°C</div>
    <img class="icon" src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg">
    <div>
      <div class="desc">OVERCAST</div>
      <div>Feels 19°C</div>
      <div>20° / 13°</div>
    </div>
  </div>

  <div class="forecast">
    
      <div class="fcol">
        <div>Tue</div>
        <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
        <div>22°</div>
      </div>
    
      <div class="fcol">
        <div>Wed</div>
        <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
        <div>21°</div>
      </div>
    
      <div class="fcol">
        <div>Thu</div>
        <img src="https://raw.githubusercontent.com/liamsnodden/sheffield/main/icons/overcast-day.svg" width="35">
        <div>20°</div>
      </div>
    
  </div>

  <div class="clock">
    <div class="time" id="time"></div>
  </div>

</div>

<script>
function updateTime(){
  const t = new Date();
  document.getElementById("time").textContent =
    t.toLocaleTimeString("en-GB",{ hour:"2-digit", minute:"2-digit" });
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
