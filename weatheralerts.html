
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

<style>

body { margin:0; font-family: Helvetica, Arial, sans-serif; }

.bar { display:flex; height:68px; border-bottom:1px solid #ddd; }

.item { flex:1; display:flex; align-items:center; padding-left:12px; border-right:1px solid #ddd; }

.row { display:flex; align-items:center; gap:16px; }

.dot { width:18px; height:18px; border-radius:50%; }

.label { font-size:14px; font-weight:700; color:#082b5b; }

.status { font-family:'Oswald'; font-size:26px; font-weight:700; }

.alert-bar {
  display:flex;
  align-items:center;
  gap:18px;
  height:38px;
  padding:0 16px;
  background:#fff;
  border-top:1px solid #ddd;
}

/* FORCE HELVETICA */
.alert-bar, .alert-bar * {
  font-family: Helvetica, Arial, sans-serif !important;
}

.alert-title {
  font-family:'Oswald';
  font-size:14px;
  font-weight:700;
  color:#b91c1c;
}

.alert-divider {
  width:1px;
  height:20px;
  background:#e5e5e5;
}

.alert-message {
  font-size:13px;
  font-weight:600;
  color:#222;
}

/* HIGH highlight */
.high {
  color:#991b1b;
  font-weight:700;
}

.alert-time {
  font-size:12px;
  color:#666;
}

</style>
</head>

<body>

<div class="bar">


      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">Temp (Hi/Lo)</div>
            <div class="status" style="">
              <span style="color:#f59e0b;font-weight:700;">25°</span> / 17°
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#f59e0b"></div>
          <div>
            <div class="label">UV</div>
            <div class="status" style="color:#f59e0b">
              CAUTION
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#22c55e"></div>
          <div>
            <div class="label">Wind</div>
            <div class="status" style="color:#22c55e">
              NORMAL
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#22c55e"></div>
          <div>
            <div class="label">Rain</div>
            <div class="status" style="color:#22c55e">
              LOW
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#22c55e"></div>
          <div>
            <div class="label">Storm</div>
            <div class="status" style="color:#22c55e">
              NONE
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#22c55e"></div>
          <div>
            <div class="label">Air Quality</div>
            <div class="status" style="color:#22c55e">
              GOOD
            </div>
          </div>
        </div>
      </div>

      <div class="item">
        <div class="row">
          <div class="dot" style="background:#22c55e"></div>
          <div>
            <div class="label">Visibility</div>
            <div class="status" style="color:#22c55e">
              GOOD
            </div>
          </div>
        </div>
      </div>

</div>

<div class="alert-bar">
<div class="alert-title">ALERT ACTION</div>
     <div class="alert-divider"></div>
     <div class="alert-message">Warm temperatures (25–29°C): Stay hydrated and use caution &nbsp;&nbsp;•&nbsp;&nbsp; Moderate UV levels: Use sun protection</div>
     <div class="alert-time">Updated 19:55</div>
</div>

</body>
</html>
