
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ FONTS */
@font-face {
  font-family: 'OswaldCustom';
  src: url('https://liamsnodden.github.io/sheffield/fonts/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

@font-face {
  font-family: 'InterCustom';
  src: url('https://liamsnodden.github.io/sheffield/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

/* BASE */
body {
  margin:0;
  background:#ffffff;
  overflow:hidden;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#ffffff;
}

/* 🔴 / 🟢 ALERT PILL */
.alert-pill{
  font-family:'OswaldCustom', Arial, sans-serif;
  font-weight:700;

  color:#fff;
  font-size:18px;
  letter-spacing:1px;

  padding:6px 16px;
  border-radius:6px;

  margin-right:28px; /* ✅ FORCE SPACING */
}

/* MESSAGE */
.alert-message{
  font-family:'InterCustom', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;

  line-height:1.2;
}

/* FLASH */
@keyframes tripleFlash {
  0% {opacity:1;}
  20% {opacity:0.2;}
  40% {opacity:1;}
  60% {opacity:0.2;}
  80% {opacity:1;}
  100% {opacity:1;}
}

.flash{
  animation: tripleFlash 0.9s ease;
}

</style>
</head>

<body>

<div class="alert-bar">
  <div class="alert-pill" id="title"></div>
  <div class="alert-message" id="message">All conditions normal. Follow standard safe working procedures.</div>
</div>

<script>

const alerts = ["All conditions normal. Follow standard safe working procedures."];
const noAlerts = true;

let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

// ✅ INITIAL STATE
if (noAlerts) {
  title.textContent = "NO ALERTS";
  title.style.background = "#16a34a"; // green
} else {
  title.textContent = "FORECAST ALERT";
  title.style.background = "#dc2626"; // red
}

// ✅ ROTATION
setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  if (!noAlerts) {
    title.classList.remove("flash");
    void title.offsetWidth;
    title.classList.add("flash");
  }

}, 20000);

</script>

</body>
</html>
