
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ YOUR GITHUB FONTS */
@font-face {
  font-family: 'InterCustom';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'OswaldCustom';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

/* BASE */
body {
  margin:0;
  overflow:hidden;
  background:#ffffff;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;
  gap:14px;

  padding:12px 16px;
  background:#ffffff;
}

/* ✅ RED PILL (OSWALD) */
.alert-pill{
  font-family:'OswaldCustom', Arial, sans-serif;
  font-weight:600;

  background:#dc2626;
  color:#fff;

  font-size:16px;
  letter-spacing:1px;

  padding:6px 14px;
  border-radius:6px;
  white-space:nowrap;
}

/* ✅ MESSAGE (INTER) */
.alert-message{
  font-family:'InterCustom', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;
}

/* ✅ FLASH (HARD SWITCH — WORKS IN XIBO) */
.flash{
  transform:scale(0.96);
  opacity:0.4;
  transition: all 0.15s ease;
}

</style>
</head>

<body>

<div class="alert-bar">
  <div class="alert-pill" id="title">FORECAST ALERT</div>
  <div class="alert-message" id="message">HIGH RISK: Extreme heat. Hydration required.</div>
</div>

<script>
const alerts = ["HIGH RISK: Extreme heat. Hydration required.","CAUTION: Elevated UV."];
let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  // ✅ FORCE FLASH (works reliably in Xibo)
  title.classList.remove("flash");
  void title.offsetWidth; // force reflow
  title.classList.add("flash");

}, 20000);
</script>

</body>
</html>
