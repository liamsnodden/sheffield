
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

/* BASE */
body {
  margin:0;
  background:#ffffff;
  overflow:hidden;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#ffffff;
}

/* 🔴 / 🟢 ALERT PILL */
.alert-pill{
  font-family:'Oswald', Arial, sans-serif;
  font-weight:700;

  color:#fff;
  font-size:18px;
  letter-spacing:1px;

  padding:6px 16px;
  border-radius:6px;

  margin-right:28px; /* ✅ FORCE SPACING */
}

/* MESSAGE */
.alert-message{
  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;

  line-height:1.2;
}

/* FLASH */
@keyframes tripleFlash {
  0% {opacity:1;}
  20% {opacity:0.2;}
  40% {opacity:1;}
  60% {opacity:0.2;}
  80% {opacity:1;}
  100% {opacity:1;}
}

.flash{
  animation: tripleFlash 0.9s ease;
}


icon{
  width:28px;
  height:28px;
  display:block;
}

.icon-uv{
  filter: brightness(0) saturate(100%) invert(55%) sepia(96%) saturate(1542%) hue-rotate(359deg) brightness(101%) contrast(97%);
}

.icon-temp{
  filter: brightness(0) saturate(100%) invert(19%) sepia(95%) saturate(3650%) hue-rotate(355deg) brightness(104%) contrast(97%);
}

.icon-wind{
  filter: brightness(0) saturate(100%) invert(28%) sepia(89%) saturate(1650%) hue-rotate(199deg) brightness(98%) contrast(96%);
}

.icon-pollen{
  filter: brightness(0) saturate(100%) invert(64%) sepia(77%) saturate(511%) hue-rotate(43deg) brightness(96%) contrast(91%);
}

.icon-aqi{
  filter: brightness(0) saturate(100%) invert(49%) sepia(60%) saturate(594%) hue-rotate(70deg) brightness(95%) contrast(89%);
}


.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#fff;
}

/* ALERT PILL */
.alert-pill{
  flex-shrink:0;
  margin-right:30px;
}

/* MESSAGE TAKES ALL AVAILABLE SPACE */
.alert-message{
  flex:1 1 auto;
  min-width:0;

  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;
}

/* RIGHT PANEL */

.weather-strip{
  margin-left:auto;

  display:flex;
  align-items:center;

  white-space:nowrap;

  flex-shrink:0;
}


/* EACH METRIC */
.metric{
  display:flex;
  align-items:center;
  gap:10px;

  padding:0 30px;   /* <-- creates spacing */
}

/* VERTICAL SEPARATORS */

.divider{
  width:1px;
  height:28px;
  background:#d4d4d4;
}

.temp-hi{
  color:#dc2626;
  font-weight:700;
}

.temp-lo{
  color:#2563eb;
  font-weight:700;
}

.uv{
  color:#f97316;
  font-weight:700;
}

.pollen{
  color:#f97316;
  font-weight:700;
}

.aqi{
  color:#16a34a;
  font-weight:700;
}


</style>
</head>

<body>



<div class="alert-bar">

    <div class="alert-pill" id="title"></div>

    <div class="alert-message" id="message">
        All conditions normal. Follow standard safe working procedures.
    </div>

   <div class="weather-strip">

    <div class="metric">
        <img
          src="https://liamsnodden.github.io/sheffield/icons/UV.svg"
          class="icon icon-uv"
        >
        UV
        <span class="uv">3.95</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
        <img
          src="https://liamsnodden.github.io/sheffield/icons/Temp.svg"
          class="icon icon-temp"
        >

        <span class="temp-hi">21°</span>
        /
        <span class="temp-lo">15°</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
        <img
          src="https://liamsnodden.github.io/sheffield/icons/Wind.svg"
          class="icon icon-wind"
        >

        18 mph
    </div>

    <div class="divider"></div>

    <div class="metric">
        <img
          src="https://liamsnodden.github.io/sheffield/icons/Pollen.svg"
          class="icon icon-pollen"
        >

        POLLEN
        <span class="pollen">LOW</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
        <img
          src="https://liamsnodden.github.io/sheffield/icons/AQ.svg"
          class="icon icon-aqi"
        >

        AQI
        <span class="aqi">FAIR (29)</span>
    </div>

</div>



<script>

const alerts = ["All conditions normal. Follow standard safe working procedures."];
const noAlerts = true;

let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

// ✅ INITIAL STATE
if (noAlerts) {
  title.textContent = "NO ACTIVE WEATHER ALERTS";
  title.style.background = "#16a34a"; // green
} else {
  title.textContent = "ACTIVE WEATHER ALERTS";
  title.style.background = "#dc2626"; // red
}

// ✅ ROTATION
setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  if (!noAlerts) {
    title.classList.remove("flash");
    void title.offsetWidth;
    title.classList.add("flash");
  }

}, 20000);

</script>

</body>
</html>
