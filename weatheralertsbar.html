
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ LOAD FONTS CORRECTLY */
@font-face {
  font-family: 'OswaldCustom';
  src: url('https://liamsnodden.github.io/sheffield/fonts/Oswald-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

@font-face {
  font-family: 'InterCustom';
  src: url('https://liamsnodden.github.io/sheffield/fonts/Inter-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

body {
  margin:0;
  overflow:hidden;
  background:#ffffff;
}

/* ALERT BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;
  gap:14px;

  background:#ffffff;
  color:#111;

  padding:12px 16px;
}

/* ✅ RED PILL RESTORED */
.alert-pill{
  font-family:'OswaldCustom', sans-serif;
  background:#dc2626;
  color:#fff;

  font-size:15px;
  letter-spacing:0.8px;

  padding:5px 12px;
  border-radius:6px;
  white-space:nowrap;
}

/* ✅ INTER MESSAGE */
.alert-message{
  font-family:'InterCustom', sans-serif;
  font-size:15px;
  font-weight:600;
  color:#111;
}

/* FLASH */
@keyframes flash {
  0% { opacity:1; }
  50% { opacity:0.3; }
  100% { opacity:1; }
}

.flash{
  animation: flash 0.6s ease;
}

</style>
</head>

<body>

<div class="alert-bar">
  <div class="alert-pill" id="title">FORECAST ALERT</div>
  <div class="alert-message" id="message">HIGH RISK: Extreme heat. Hydration and breaks required.</div>
</div>

<script>
const alerts = ["HIGH RISK: Extreme heat. Hydration and breaks required.","CAUTION: Elevated UV."];
let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

setInterval(() => {
  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  title.classList.add("flash");
  setTimeout(() => title.classList.remove("flash"), 600);

}, 20000);
</script>

</body>
</html>
