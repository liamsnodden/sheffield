
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

/* BASE */
body {
  margin:0;
  background:#ffffff;
  overflow:hidden;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#ffffff;
}

/* 🔴 / 🟢 ALERT PILL */
.alert-pill{
  font-family:'Oswald', Arial, sans-serif;
  font-weight:700;

  color:#fff;
  font-size:18px;
  letter-spacing:1px;

  padding:6px 16px;
  border-radius:6px;

  margin-right:28px; /* ✅ FORCE SPACING */
}

/* MESSAGE */
.alert-message{
  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;

  line-height:1.2;
}

/* FLASH */
@keyframes tripleFlash {
  0% {opacity:1;}
  20% {opacity:0.2;}
  40% {opacity:1;}
  60% {opacity:0.2;}
  80% {opacity:1;}
  100% {opacity:1;}
}

.flash{
  animation: tripleFlash 0.9s ease;
}




.icon{
  width:28px;
  height:28px;
  display:block;
  margin-right:12px;
  flex-shrink:0;
}



.icon-uv{
  filter: brightness(0) saturate(100%) invert(55%) sepia(96%) saturate(1542%) hue-rotate(359deg) brightness(101%) contrast(97%);
}

.icon-temp{
  filter: brightness(0) saturate(100%) invert(19%) sepia(95%) saturate(3650%) hue-rotate(355deg) brightness(104%) contrast(97%);
}

.icon-wind{
  filter: brightness(0) saturate(100%) invert(28%) sepia(89%) saturate(1650%) hue-rotate(199deg) brightness(98%) contrast(96%);
}

.icon-pollen{
  filter: brightness(0) saturate(100%) invert(64%) sepia(77%) saturate(511%) hue-rotate(43deg) brightness(96%) contrast(91%);
}

.icon-aqi{
  filter: brightness(0) saturate(100%) invert(49%) sepia(60%) saturate(594%) hue-rotate(70deg) brightness(95%) contrast(89%);
}


.icon-precipitation{
  filter: brightness(0) saturate(100%) invert(28%) sepia(89%) saturate(1650%) hue-rotate(199deg) brightness(98%) contrast(96%);
}



.icon-humidity{
  filter: brightness(0) saturate(100%) invert(19%) sepia(95%) saturate(3650%) hue-rotate(355deg) brightness(104%) contrast(97%);
}



.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#fff;
}

/* ALERT PILL */
.alert-pill{
  flex-shrink:0;
  margin-right:30px;
}

/* MESSAGE TAKES ALL AVAILABLE SPACE */
.alert-message{
  flex:1 1 auto;
  min-width:0;

  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;
}






.metric-label{
  font-family:'Oswald', Arial, sans-serif;
  font-weight:700;
  font-size:20px;
  line-height:1;

  display:inline-block;
  margin-right:12px;
  min-width:28px;
}


.label-uv{
  color:#f97316;
}


/* RIGHT PANEL */


.weather-strip{
  margin-left:auto;

  display:flex;
  align-items:center;

  white-space:nowrap;

  flex-shrink:0;

  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
}



/* EACH METRIC */


.metric{
  
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 30px;
  font-family:'Inter', Arial, sans-serif;
}


.metric-text{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.metric-value{
  font-family:'Inter', Arial, sans-serif;
  font-weight:700;
  font-size:16px;
}

.metric-sub{
  font-family:'Inter', Arial, sans-serif;
  font-size:10px;
  font-weight:500;
  color:#737373;
  text-transform:uppercase;
  margin-top:4px;
  letter-spacing:0.5px;
}



.label-aq{
  color:#16a34a;
}



/* VERTICAL SEPARATORS */

.divider{
  width:1px;
  height:28px;
  background:#d4d4d4;
}

.temp-hi{
  color:#dc2626;
  font-weight:700;
}

.temp-lo{
  color:#2563eb;
  font-weight:700;
}

.uv{
  color:#f97316;
  font-weight:700;
}

.pollen{
  color:#16a34a;
  font-weight:700;
}

.aqi{
  color:#16a34a;
  font-weight:700;
}


</style>
</head>

<body>



<div class="alert-bar">

    <div class="alert-pill" id="title"></div>

    <div class="alert-message" id="message">
        All conditions normal. Stay safe and have a great day!
    </div>


<div class="weather-strip">

   
<div class="metric">

  <span class="metric-label label-uv">UV</span>

  <div class="metric-text">
    <span class="metric-value uv">3.05</span>
    <span class="metric-sub">UV Index</span>
  </div>

</div>


    <div class="divider"></div>

    
<div class="metric">
  <img src="https://liamsnodden.github.io/sheffield/icons/Wind.svg"
  class="icon icon-wind">
  
  <div class="metric-text">
    <span class="metric-value">2 mph</span>
    <span class="metric-sub">Wind</span>
  </div>
</div>


    <div class="divider"></div>

    <div class="metric">
        <img src="https://liamsnodden.github.io/sheffield/icons/Pollen.svg"
             class="icon icon-pollen">

        <div class="metric-text">
          <span class="metric-value pollen">LOW</span>
          <span class="metric-sub">Pollen</span>
        </div>
    </div>

    <div class="divider"></div>

    <div class="metric">
        
<span class="metric-label label-aq">AQ</span>

<div class="metric-text">
    <span class="metric-value">GOOD (24)</span>
    <span class="metric-sub">Air Quality</span>
  </div>


    </div>

    <div class="divider"></div>

    
<div class="metric">
    <img src="https://liamsnodden.github.io/sheffield/icons/humidity.svg"
         class="icon icon-humidity">

    
<div class="metric-text">
    <span class="metric-value">65%</span>
    <span class="metric-sub">Humidity</span>
  </div>

</div>

<div class="divider"></div>

<div class="metric">
    <img src="https://liamsnodden.github.io/sheffield/icons/precipitation.svg"
         class="icon icon-precipitation">

  <div class="metric-text">
    <span class="metric-value">0.0 mm</span>
    <span class="metric-sub">Rainfall</span>
  </div>

</div>


</div>


</div>



<script>

const alerts = ["All conditions normal. Stay safe and have a great day!"];
const noAlerts = true;

let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

// ✅ INITIAL STATE
if (noAlerts) {
  title.textContent = "NO ACTIVE WEATHER ALERTS";
  title.style.background = "#16a34a"; // green
} else {
  title.textContent = "ACTIVE WEATHER ALERTS";
  title.style.background = "#dc2626"; // red
}

// ✅ ROTATION
setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  if (!noAlerts) {
    title.classList.remove("flash");
    void title.offsetWidth;
    title.classList.add("flash");
  }

}, 20000);

</script>


<script>
setTimeout(() => {
  location.reload();
}, 120000); // 2 minutes
</script>


</body>
</html>
