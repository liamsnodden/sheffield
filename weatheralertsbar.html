
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* ✅ LOAD FONTS PROPERLY */
/* ✅ YOUR GITHUB FONTS */
@font-face {
  font-family: 'InterCustom';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'OswaldCustom';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}




/* BASE */
body {
  margin:0;
  background:#ffffff;
  overflow:hidden;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;
  gap:14px;

  padding:12px 16px;
  background:#ffffff;
}

/* 🔴 OSWALD PILL */
.alert-pill{
  font-family:'OswaldCustom', Arial, sans-serif;
  font-weight:700;

  background:#dc2626;
  color:#fff;

  font-size:18px;   /* slightly bigger so you see difference */
  letter-spacing:1px;

  padding:6px 14px;
  border-radius:6px;
}

/* ✅ INTER MESSAGE */
.alert-message{
  font-family:'InterCustom', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;
}

/* FLASH */
@keyframes tripleFlash {
  0% {opacity:1;}
  20% {opacity:0.2;}
  40% {opacity:1;}
  60% {opacity:0.2;}
  80% {opacity:1;}
  100% {opacity:1;}
}

.flash{
  animation: tripleFlash 0.9s ease;
}

</style>
</head>

<body>

<div class="alert-bar">
  <div class="alert-pill" id="title">FORECAST ALERT</div>
  <div class="alert-message" id="message">ELEVATED UV LEVELS (≥5): Limit prolonged sun exposure.</div>
</div>

<script>
const alerts = ["ELEVATED UV LEVELS (≥5): Limit prolonged sun exposure."];
let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  title.classList.remove("flash");
  void title.offsetWidth;
  title.classList.add("flash");

}, 20000);
</script>

</body>
</html>
