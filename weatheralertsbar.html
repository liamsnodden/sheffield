
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  font-weight: 100 900;
}

@font-face {
  font-family: 'Inter';
  src: url('https://liamsnodden.github.io/sheffield/Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
  font-style: italic;
}

@font-face {
  font-family: 'Oswald';
  src: url('https://liamsnodden.github.io/sheffield/Oswald-VariableFont_wght.ttf') format('truetype');
  font-weight: 200 700;
}

/* BASE */
body {
  margin:0;
  background:#ffffff;
  overflow:hidden;
}

/* BAR */
.alert-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  display:flex;
  align-items:center;

  padding:12px 16px;
  background:#ffffff;
}

/* 🔴 / 🟢 ALERT PILL */
.alert-pill{
  font-family:'Oswald', Arial, sans-serif;
  font-weight:700;

  color:#fff;
  font-size:18px;
  letter-spacing:1px;

  padding:6px 16px;
  border-radius:6px;

  margin-right:28px; /* ✅ FORCE SPACING */
}

/* MESSAGE */
.alert-message{
  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;

  line-height:1.2;
}

/* FLASH */
@keyframes tripleFlash {
  0% {opacity:1;}
  20% {opacity:0.2;}
  40% {opacity:1;}
  60% {opacity:0.2;}
  80% {opacity:1;}
  100% {opacity:1;}
}

.flash{
  animation: tripleFlash 0.9s ease;
}



.alert-message{
  flex:1;

  font-family:'Inter', Arial, sans-serif;
  font-weight:600;
  font-size:16px;
  color:#111;

  line-height:1.2;

  padding-right:80px;   /* <-- forces gap */
}

.weather-strip{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:24px;             /* <-- bigger spacing between metrics */

  min-width:700px;      /* <-- keeps metrics grouped on right */

  white-space:nowrap;

  font-family:'Inter', Arial, sans-serif;
  font-size:16px;
  font-weight:600;
}


.metric{
  display:flex;
  align-items:center;
  gap:8px;
}

.divider{
  width:1px;
  height:28px;
  background:#d4d4d4;
}

.temp-hi{
  color:#dc2626;
  font-weight:700;
}

.temp-lo{
  color:#2563eb;
  font-weight:700;
}

.uv{
  color:#f97316;
  font-weight:700;
}

.pollen{
  color:#f97316;
  font-weight:700;
}

.aqi{
  color:#16a34a;
  font-weight:700;
}


</style>
</head>

<body>


<div class="alert-bar">

  <div class="alert-pill" id="title"></div>

  <div class="alert-message" id="message">
    All conditions normal. Follow standard safe working procedures.
  </div>

  <div class="weather-strip">

    <div class="metric">
      ☀️ UV
      <span class="uv">4</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
      🌡️
      <span class="temp-hi">21°</span>
      /
      <span class="temp-lo">15°</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
      💨 12 mph
    </div>

    <div class="divider"></div>

    <div class="metric">
      🌿 POLLEN
      <span class="pollen">LOW</span>
    </div>

    <div class="divider"></div>

    <div class="metric">
      AQI
      <span class="aqi">FAIR (26)</span>
    </div>

  </div>

</div>


<script>

const alerts = ["All conditions normal. Follow standard safe working procedures."];
const noAlerts = true;

let i = 0;

const msg = document.getElementById("message");
const title = document.getElementById("title");

// ✅ INITIAL STATE
if (noAlerts) {
  title.textContent = "NO ACTIVE WEATHER ALERTS";
  title.style.background = "#16a34a"; // green
} else {
  title.textContent = "ACTIVE WEATHER ALERTS";
  title.style.background = "#dc2626"; // red
}

// ✅ ROTATION
setInterval(() => {

  i = (i + 1) % alerts.length;
  msg.textContent = alerts[i];

  if (!noAlerts) {
    title.classList.remove("flash");
    void title.offsetWidth;
    title.classList.add("flash");
  }

}, 20000);

</script>

</body>
</html>
