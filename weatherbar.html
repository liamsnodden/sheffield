<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:"Arial Narrow", Arial, sans-serif;
}

.weather-card{
width:1356px;
height:450px;
background:linear-gradient(135deg,#0055a4,#003f8a);
border-radius:20px;
color:#fff;
display:flex;
align-items:center;
padding:0 40px;
overflow:hidden;
}

.main-weather{
display:flex;
align-items:center;
gap:20px;
min-width:520px;
}

.main-weather img{
width:180px;
height:180px;
}

.temp-section{
display:flex;
flex-direction:column;
}

.temp{
font-size:110px;
font-weight:700;
line-height:1;
}

.condition{
font-size:38px;
font-weight:600;
}

.metrics{
display:flex;
flex:1;
height:180px;
}

.metric{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
border-left:2px solid rgba(255,255,255,.25);
}

.metric-label{
font-size:28px;
font-weight:700;
margin-bottom:18px;
}

.metric-value{
font-size:70px;
font-weight:700;
line-height:1;
}

.metric-unit{
font-size:24px;
opacity:.9;
}
</style>
</head>

<body>

<div class="weather-card">

<div class="main-weather">
<img id="weatherIcon"
src="https://openweathermap.org/img/wn/01d@4x.png">

<div class="temp-section">
<div class="temp" id="temp">--°C</div>
<div class="condition" id="condition">Loading...</div>
</div>
</div>

<div class="metrics">

<div class="metric">
<div class="metric-label">HIGH</div>
<div class="metric-value" id="high">--</div>
</div>

<div class="metric">
<div class="metric-label">LOW</div>
<div class="metric-value" id="low">--</div>
</div>

<div class="metric">
<div class="metric-label">RAIN</div>
<div class="metric-value" id="rain">--%</div>
</div>

<div class="metric">
<div class="metric-label">WIND</div>
<div class="metric-value" id="wind">--</div>
<div class="metric-unit">mph</div>
</div>

<div class="metric">
<div class="metric-label">GUSTS</div>
<div class="metric-value" id="gusts">--</div>
<div class="metric-unit">mph</div>
</div>

<div class="metric">
<div class="metric-label">UV</div>
<div class="metric-value" id="uv">--</div>
</div>

</div>

</div>

<script>

const LATITUDE = 53.38; // Change to your site
const LONGITUDE = -1.47; // Change to your site

function weatherDescription(code){

const map = {
0:"Clear",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Cloudy",
45:"Fog",
48:"Fog",
51:"Drizzle",
53:"Drizzle",
55:"Drizzle",
61:"Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
73:"Snow",
75:"Snow",
80:"Showers",
81:"Showers",
82:"Heavy Showers",
95:"Thunderstorm"
};

return map[code] || "Weather";
}

function weatherIcon(code){

if(code === 0)
return "01d";

if([1,2].includes(code))
return "02d";

if([3,45,48].includes(code))
return "03d";

if([51,53,55,61,63,65,80,81,82].includes(code))
return "10d";

if([71,73,75,77,85,86].includes(code))
return "13d";

if([95,96,99].includes(code))
return "11d";

return "03d";
}

async function loadWeather(){

try{

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,weather_code,wind_speed_10m,wind_gusts_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&forecast_days=1`;

const response = await fetch(url);
const data = await response.json();

const code = data.current.weather_code;

document.getElementById('temp').innerText =
Math.round(data.current.temperature_2m) + "°C";

document.getElementById('condition').innerText =
weatherDescription(code);

document.getElementById('high').innerText =
Math.round(data.daily.temperature_2m_max[0]) + "°";

document.getElementById('low').innerText =
Math.round(data.daily.temperature_2m_min[0]) + "°";

document.getElementById('rain').innerText =
data.daily.precipitation_probability_max[0] + "%";

document.getElementById('wind').innerText =
Math.round(data.current.wind_speed_10m * 0.621371);

document.getElementById('gusts').innerText =
Math.round(data.current.wind_gusts_10m * 0.621371);

document.getElementById('uv').innerText =
Math.round(data.daily.uv_index_max[0]);

document.getElementById('weatherIcon').src =
`https://openweathermap.org/img/wn/${weatherIcon(code)}@4x.png`;

}
catch(error){
console.error(error);
document.getElementById('condition').innerText =
"Weather unavailable";
}
}

loadWeather();

/* Refresh every 10 minutes */
setInterval(loadWeather, 600000);

</script>

</body>
</html>
