<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:"Arial Narrow", Arial, sans-serif;
}

.weather-card{
width:800px;
height:300px;
background:linear-gradient(135deg,#0055a4,#003f8a);
border-radius:20px;
color:#fff;
display:flex;
align-items:center;
padding:0 40px;
overflow:hidden;
}

.main-weather{
display:flex;
align-items:center;
gap:30px;
min-width:520px;
}

.main-weather img{
width:180px;
height:180px;
}

.temp-section{
display:flex;
flex-direction:column;
}

.temp{
font-size:110px;
font-weight:700;
line-height:1;
}

.condition{
font-size:40px;
font-weight:600;
margin-top:10px;
}

.metrics{
display:flex;
flex:1;
height:180px;
}

.metric{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
border-left:2px solid rgba(255,255,255,0.25);
}

.metric-label{
font-size:28px;
font-weight:700;
letter-spacing:1px;
opacity:.95;
margin-bottom:25px;
}

.metric-value{
font-size:72px;
font-weight:700;
line-height:1;
}

.metric-small{
font-size:26px;
}
</style>
</head>

<body>

<div class="weather-card">

<div class="main-weather">
<!-- OpenWeather icon -->
<img id="weatherIcon"
src="https://openweathermap.org/img/wn/01d@4x.png"
alt="Weather">

<div class="temp-section">
<div class="temp" id="temp">18°C</div>
<div class="condition" id="condition">Sunny</div>
</div>
</div>

<div class="metrics">

<div class="metric">
<div class="metric-label">HIGH</div>
<div class="metric-value" id="high">21°</div>
</div>

<div class="metric">
<div class="metric-label">LOW</div>
<div class="metric-value" id="low">11°</div>
</div>

<div class="metric">
<div class="metric-label">RAIN</div>
<div class="metric-value" id="rain">10%</div>
</div>

<div class="metric">
<div class="metric-label">WIND</div>
<div class="metric-value">12</div>
<div class="metric-small">mph</div>
</div>

<div class="metric">
<div class="metric-label">GUSTS</div>
<div class="metric-value">21</div>
<div class="metric-small">mph</div>
</div>

<div class="metric">
<div class="metric-label">UV</div>
<div class="metric-value">6</div>
</div>

</div>

</div>

</body>
</html>
