<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Test</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

#weatherSection{
display:flex;
align-items:center;
gap:15px;
}

#weather-icon{
width:80px;
height:80px;
}

#weather-temp{
font-size:40px;
font-weight:bold;
}

#weather-condition{
font-size:18px;
}

#weather-feels{
font-size:14px;
opacity:0.8;
}

#debug{
margin-top:20px;
font-size:12px;
white-space:pre-wrap;
background:#222;
padding:10px;
border-radius:5px;
}
</style>
</head>

<body>

<div id="weatherSection">

<img id="weather-icon"
src="https://openweathermap.org/img/wn/01d@4x.png">

<div>

<div id="weather-temp">Loading...</div>

<div id="weather-condition"></div>

<div id="weather-feels"></div>

</div>

</div>

<div id="debug">Connecting...</div>

<script>

const weatherDescriptions = {
0:"Clear",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Overcast",
45:"Fog",
48:"Fog",
51:"Light Drizzle",
53:"Drizzle",
55:"Heavy Drizzle",
61:"Light Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
73:"Snow",
75:"Heavy Snow",
80:"Rain Showers",
81:"Heavy Showers",
82:"Heavy Rain",
95:"Thunderstorm",
96:"Thunderstorm",
99:"Thunderstorm"
};

const iconMap = {
0:"01d",
1:"02d",
2:"03d",
3:"04d",
45:"50d",
48:"50d",
51:"09d",
53:"09d",
55:"09d",
61:"10d",
63:"10d",
65:"10d",
71:"13d",
73:"13d",
75:"13d",
80:"09d",
81:"09d",
82:"09d",
95:"11d",
96:"11d",
99:"11d"
};

async function updateWeather(){

try{

const response = await fetch(
'https://weather.liam-snodden.workers.dev'
);

const data = await response.json();

document.getElementById('debug').textContent =
JSON.stringify(data,null,2);

const code = data.current.weather_code;

document.getElementById('weather-temp').textContent =
Math.round(data.current.temperature_2m) + '°C';

document.getElementById('weather-condition').textContent =
weatherDescriptions[code] || 'Unknown';

document.getElementById('weather-feels').textContent =
'Feels like ' +
Math.round(data.current.apparent_temperature) +
'°C';

document.getElementById('weather-icon').src =
`https://openweathermap.org/img/wn/${iconMap[code] || '04d'}@4x.png`;

}catch(error){

document.getElementById('debug').textContent =
'ERROR:\n\n' + error;

document.getElementById('weather-condition').textContent =
'Failed';

console.error(error);

}

}

updateWeather();

</script>

</body>
</html>
