<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Test</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

#weatherSection{
display:flex;
align-items:center;
gap:15px;
}

#weather-icon{
width:80px;
height:80px;
}

#weather-temp{
font-size:40px;
font-weight:bold;
}

#weather-condition{
font-size:18px;
}

#weather-feels{
font-size:14px;
opacity:0.8;
}

#debug{
margin-top:20px;
font-size:12px;
white-space:pre-wrap;
background:#222;
padding:10px;
border-radius:5px;
}
</style>
</head>

<body>

<div id="weatherSection">

<img id="weather-icon"
src="https://openweathermap.org/img/wn/01d@4x.png">

<div>

<div id="weather-temp">Loading...</div>

<div id="weather-condition"></div>

<div id="weather-feels"></div>

</div>

</div>

<div id="debug">Connecting...</div>

<script>

fetch('https://weather.liam-snodden.workers.dev')
.then(r => r.json())
.then(data => {

document.body.innerHTML =
'<pre>' + JSON.stringify(data,null,2) + '</pre>';

})
.catch(err => {

document.body.innerHTML =
'<h1>ERROR</h1><pre>' + err + '</pre>';

});

</script>

</body>
</html>
