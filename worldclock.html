<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>World Clock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html,body{
width:100%;
height:100%;
background:transparent;
overflow:hidden;
}

#world-clocks{
width:400px;
height:296px;
background:transparent;
display:flex;
flex-direction:column;
}

.clock-row{
flex:1;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid rgba(0,71,186,.12);
padding:0 14px;
}

.clock-row:last-child{
border-bottom:none;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.flag{
width:25px;
height:25px;
border-radius:50%;
object-fit:cover;
flex-shrink:0;
}

.location{
display:flex;
flex-direction:column;
}

.city{
font-size:18px;
font-weight:700;
color:#000000;
line-height:1.1;
}

.country{
font-size:12px;
color:#6b7280;
margin-top:2px;
}

.right{
display:flex;
align-items:center;
gap:10px;
}

.status{
width:15px;
height:15px;
border-radius:50%;
}

.day{
background:#22c55e;
}

.night{
background:#4b5563;
}

.time{
font-size:35px;
font-weight:700;
color:#16325C;
letter-spacing:-1px;
min-width:110px;
text-align:right;
}

</style>
</head>

<body>

<div id="world-clocks"></div>

<script>

const sites = [

{
city:"Cleveland HQ",
country:"United States",
flag:"us",
timezone:"America/New_York"
},

{
city:"Sheffield",
country:"United Kingdom",
flag:"gb",
timezone:"Europe/London"
},

  {
city:"Brodziszewo",
country:"Poland",
flag:"pl",
timezone:"Europa/Warsaw"
},

{
city:"Bangalore",
country:"India",
flag:"in",
timezone:"Asia/Kolkata"
},

{
city:"Hồ Chí Minh City",
country:"Vietnam",
flag:"vn",
timezone:"Asia/Ho_Chi_Minh"
}

];

function getStatus(timezone){

const hour = parseInt(
new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
hour12:false,
timeZone:timezone
}
).format(new Date())
);

return (hour >= 7 && hour < 19)
? 'day'
: 'night';
}

function render(){

const container=document.getElementById('world-clocks');

container.innerHTML='';

sites.forEach(site=>{

const time=new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
minute:'2-digit',
hour12:false,
timeZone:site.timezone
}
).format(new Date());

const status=getStatus(site.timezone);

container.innerHTML+=`
<div class="clock-row">

<div class="left">

<img
class="flag"
src="https://flagcdn.com/w80/${site.flag}.png"
alt=""
>

<div class="location">
<div class="city">${site.city}</div>
<div class="country">${site.country}</div>
</div>

</div>

<div class="right">

<div class="status ${status}"></div>

<div class="time">${time}</div>

</div>

</div>
`;
});

}

render();

setInterval(render,60000);

</script>

</body>
</html>
