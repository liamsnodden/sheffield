<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Clocks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,
body{
width:80%;
height:100%;
background:transparent;
overflow:hidden;
}

#worldClocks{
width:470px;
height:190px;
display:flex;
flex-direction:column;
background:transparent;
}

.clock-row{
flex:1;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
border-bottom:1px solid rgba(0,71,186,0.12);
}

.clock-row:last-child{
border-bottom:none;
}

.left{
display:flex;
align-items:center;
gap:10px;
}

.flag{
width:26px;
height:26px;
border-radius:50%;
object-fit:cover;
border:1px solid rgba(0,0,0,0.08);
flex-shrink:0;
}

.location{
display:flex;
flex-direction:column;
}

.city{
font-size:16px;
font-weight:700;
color:#000000;
line-height:1.1;
}

.country{
font-size:10px;
color:#777;
margin-top:2px;
text-transform:uppercase;
letter-spacing:.5px;
}

.right{
display:flex;
align-items:center;
gap:10px;
}

.status{
width:10px;
height:10px;
border-radius:50%;
}

.day{
background:#22c55e;
}

.evening{
background:#f59e0b;
}

.night{
background:#6b7280;
}

.time{
font-size:32px;
font-weight:700;
color:#16325C;
min-width:90px;
text-align:right;
letter-spacing:-1px;
}

</style>
</head>

<body>

<div id="worldClocks"></div>

<script>

const sites = [

{
city:"Cleveland HQ",
country:"United States",
flag:"us",
timezone:"America/New_York"
},

{
city:"Sheffield",
country:"United Kingdom",
flag:"gb",
timezone:"Europe/London"
},

{
city:"Brodziszewo",
country:"Poland",
flag:"pl",
timezone:"Europe/Warsaw"
},

{
city:"Bangalore",
country:"India",
flag:"in",
timezone:"Asia/Kolkata"
},

{
city:"Hồ Chí Minh City",
country:"Vietnam",
flag:"vn",
timezone:"Asia/Ho_Chi_Minh"
}

];

function getHour(timezone){

return parseInt(
new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
hour12:false,
timeZone:timezone
}
).format(new Date())
);

}

function getStatus(timezone){

const hour = getHour(timezone);

if(hour >= 7 && hour < 18){
return 'day';
}

if(hour >= 17 && hour < 22){
return 'evening';
}

return 'night';
}

function getTime(timezone){

return new Intl.DateTimeFormat(
'en-GB',
{
hour:'2-digit',
minute:'2-digit',
hour12:false,
timeZone:timezone
}
).format(new Date());

}

function renderClocks(){

const container =
document.getElementById('worldClocks');

container.innerHTML = '';

sites.forEach(site=>{

const status =
getStatus(site.timezone);

const time =
getTime(site.timezone);

container.innerHTML += `

<div class="clock-row">

<div class="left">

<img
class="flag"
src="https://flagcdn.com/w80/${site.flag}.png"
alt="${site.country}"
>

<div class="location">

<div class="city">
${site.city}
</div>

<div class="country">
${site.country}
</div>

</div>

</div>

<div class="right">

<div class="status ${status}"></div>

<div class="time">
${time}
</div>

</div>

</div>

`;

});

}

renderClocks();

/* Update every minute */
setInterval(renderClocks, 1000);

</script>

</body>
</html>
